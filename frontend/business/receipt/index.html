<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Receipt Maker — Nexauren Business</title><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/nexauren-redesign.css"><style>.wrap{max-width:760px;margin:45px auto;padding:20px}.card,.receipt{border:1px solid #ddd;border-radius:18px;padding:24px}.muted{color:#667085}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:grid;gap:6px;font-weight:700;font-size:.9rem}input,textarea{padding:12px;border:1px solid #d8dde5;border-radius:10px;font:inherit}.item{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:8px;margin:8px 0}.btn{border:1px solid #ccd2da;border-radius:10px;padding:11px 15px;background:#fff;font-weight:800;cursor:pointer}.primary{background:#111827;color:#fff}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.status{margin:12px 0;padding:10px;border-radius:10px;background:#f5f7fa}.receipt{display:none;margin-top:25px}.receipt table{width:100%;border-collapse:collapse}.receipt td{padding:9px;border-bottom:1px solid #ddd}.total{text-align:right;font-size:1.35rem;font-weight:900}@media(max-width:600px){.grid,.item{grid-template-columns:1fr}}@media print{header,.form,.actions,.status{display:none!important}.wrap{margin:0;padding:0}.receipt{display:block;border:0}}</style></head><body><header id="site-header"></header><main class="wrap"><div class="card form"><h1>🧾 Receipt Maker</h1><p class="muted">Emita recibos simples para confirmar pagamentos recebidos.</p><div id="status" class="status">A verificar a sua conta…</div><div class="grid"><label>Seu negócio<input id="biz" placeholder="Nome do negócio"></label><label>Cliente<input id="client" placeholder="Nome do cliente"></label><label>Data<input id="date" type="date"></label><label>Número<input id="number" placeholder="REC-001"></label><label>Método de pagamento<input id="method" placeholder="M-Pesa, dinheiro, transferência…"></label><label>Moeda<input id="currency" value="USD"></label></div><h3>Pagamento</h3><div id="items"></div><button class="btn" onclick="addItem()">+ Adicionar item</button><div class="actions"><button class="btn primary" onclick="generate()">Gerar recibo</button><a class="btn" href="/billing/">Comprar créditos</a></div></div><section id="receipt" class="receipt"></section></main><footer id="site-footer"></footer><script src="/js/app.js" defer></script><script>
const TOOL='business-receipt';let remaining=0;date.value=new Date().toISOString().slice(0,10);function addItem(){let x=document.createElement('div');x.className='item';x.innerHTML='<input class="desc" placeholder="Descrição"><input class="qty" type="number" value="1" min="0"><input class="price" type="number" step="0.01" placeholder="Valor"><button class="btn" onclick="this.parentElement.remove()">×</button>';items.appendChild(x)}addItem();async function usage(){let r=await fetch('/api/business/tools/usage?tool='+TOOL,{credentials:'include'});if(r.status===401)return location.href='/auth/';let d=await r.json();remaining=d.free_generations_remaining;status.textContent=`${remaining} recibo(s) grátis restante(s) hoje • depois 5 créditos`}async function generate(){let r=await fetch('/api/business/tools/consume',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({tool:TOOL,reference:(number.value||'REC')+'-'+Date.now()})});let d=await r.json();if(r.status===401)return location.href='/auth/';if(!r.ok)return status.textContent=d.error||'Não foi possível gerar.';let a=[...document.querySelectorAll('.item')].map(x=>[x.querySelector('.desc').value||'Item',+x.querySelector('.qty').value||0,+x.querySelector('.price').value||0]);let total=a.reduce((s,x)=>s+x[1]*x[2],0);receipt.innerHTML=`<h1>${biz.value||'Recibo'}</h1><p>Recibo <b>${number.value||'REC-001'}</b> · ${date.value}</p><p>Recebido de: <b>${client.value||'—'}</b></p><p>Método: ${method.value||'—'}</p><table>${a.map(x=>`<tr><td>${x[0]} × ${x[1]}</td><td>${currency.value} ${(x[1]*x[2]).toFixed(2)}</td></tr>`).join('')}</table><p class="total">Total pago: ${currency.value} ${total.toFixed(2)}</p><button class="btn primary" onclick="print()">Imprimir / Guardar PDF</button>`;receipt.style.display='block';status.textContent=d.charged?'Recibo criado • 5 créditos usados.':'Recibo criado gratuitamente.';remaining=Math.max(0,remaining-1)}usage();</script></body></html>
