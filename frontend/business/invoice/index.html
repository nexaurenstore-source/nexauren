<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Invoice Maker — Nexauren Business</title><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/nexauren-redesign.css"><style>.wrap{max-width:900px;margin:45px auto;padding:20px}.card{border:1px solid #ddd;border-radius:18px;padding:24px;background:var(--bg,#fff)}h1{margin-bottom:8px}.muted{color:#667085}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:grid;gap:6px;font-weight:700;font-size:.9rem}input,textarea{padding:12px;border:1px solid #d8dde5;border-radius:10px;font:inherit}textarea{min-height:90px}.items{margin-top:18px}.item{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:8px;margin:8px 0}.btn{border:1px solid #ccd2da;border-radius:10px;padding:11px 15px;background:#fff;font-weight:800;cursor:pointer}.primary{background:#111827;color:#fff}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.status{margin:12px 0;padding:10px;border-radius:10px;background:#f5f7fa}.doc{display:none;margin-top:25px;padding:35px;border:1px solid #ddd;border-radius:12px}.doc table{width:100%;border-collapse:collapse}.doc td,.doc th{padding:9px;border-bottom:1px solid #ddd;text-align:left}.total{text-align:right;font-size:1.3rem;font-weight:900;margin-top:18px}@media(max-width:650px){.grid,.item{grid-template-columns:1fr}.wrap{margin:15px auto}.doc{padding:18px}}@media print{header,.form,.actions,.status{display:none!important}.wrap{margin:0;padding:0}.doc{display:block;border:0}}
</style></head><body><header id="site-header"></header><main class="wrap"><div class="card form"><h1>🧾 Invoice Maker</h1><p class="muted">Crie uma fatura profissional e pronta para imprimir ou guardar em PDF.</p><div id="status" class="status">A verificar a sua conta…</div><div class="grid"><label>Seu negócio<input id="biz" placeholder="Nome do negócio"></label><label>Cliente<input id="client" placeholder="Nome do cliente"></label><label>Data<input id="date" type="date"></label><label>Número<input id="number" placeholder="INV-001"></label><label>Moeda<input id="currency" value="USD" maxlength="5"></label><label>Vencimento<input id="due" type="date"></label></div><div class="items"><h3>Produtos / serviços</h3><div id="items"></div><button class="btn" onclick="addItem()">+ Adicionar item</button></div><label style="margin-top:15px">Notas<textarea id="notes" placeholder="Obrigado pela preferência."></textarea></label><div class="actions"><button class="btn primary" onclick="generate()">Gerar fatura</button><a class="btn" href="/billing/">Comprar créditos</a></div></div><section id="doc" class="doc"></section></main><footer id="site-footer"></footer><script src="/js/app.js" defer></script><script>
const TOOL='business-invoice';let used=0;document.getElementById('date').value=new Date().toISOString().slice(0,10);function addItem(){const d=document.createElement('div');d.className='item';d.innerHTML='<input placeholder="Descrição" class="desc"><input type="number" min="0" step="0.01" value="1" class="qty"><input type="number" min="0" step="0.01" placeholder="Preço" class="price"><button class="btn" onclick="this.parentElement.remove()">×</button>';document.getElementById('items').appendChild(d)}addItem();async function usage(){const r=await fetch('/api/business/tools/usage?tool='+TOOL,{credentials:'include'});if(r.status===401){location.href='/auth/';return}const d=await r.json();if(!r.ok){status.textContent=d.error||'Erro ao verificar conta.';return}used=d.free_generations_remaining;status.textContent=`${used} documento(s) grátis restante(s) hoje • depois 5 créditos por documento`}async function generate(){if(used===0){status.textContent='A autorizar documento…'}const r=await fetch('/api/business/tools/consume',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({tool:TOOL,reference:(number.value||'INV')+'-'+Date.now()})});const d=await r.json();if(r.status===401){location.href='/auth/';return}if(!r.ok){status.textContent=d.error||'Não foi possível gerar.';return}const rows=[...document.querySelectorAll('.item')].map(x=>({d:x.querySelector('.desc').value||'Item',q:+x.querySelector('.qty').value||0,p:+x.querySelector('.price').value||0}));const total=rows.reduce((s,x)=>s+x.q*x.p,0);doc.innerHTML=`<h1>${biz.value||'Invoice'}</h1><p>Fatura <b>${number.value||'INV-001'}</b> · ${date.value||''}</p><p>Cliente: <b>${client.value||'—'}</b></p><table><tr><th>Item</th><th>Qtd.</th><th>Preço</th><th>Total</th></tr>${rows.map(x=>`<tr><td>${x.d}</td><td>${x.q}</td><td>${currency.value} ${x.p.toFixed(2)}</td><td>${currency.value} ${(x.q*x.p).toFixed(2)}</td></tr>`).join('')}</table><div class="total">Total: ${currency.value} ${total.toFixed(2)}</div><p>${notes.value||''}</p><button class="btn primary" onclick="print()">Imprimir / Guardar PDF</button>`;doc.style.display='block';status.textContent=d.charged?'Documento criado • 5 créditos usados.':'Documento criado gratuitamente.';used=Math.max(0,used-1)}usage();
</script></body></html>
