<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quote Maker — Nexauren Business</title><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/nexauren-redesign.css"><style>.wrap{max-width:900px;margin:45px auto;padding:20px}.card{border:1px solid #ddd;border-radius:18px;padding:24px}.muted{color:#667085}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:grid;gap:6px;font-weight:700;font-size:.9rem}input,textarea{padding:12px;border:1px solid #d8dde5;border-radius:10px;font:inherit}textarea{min-height:80px}.item{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:8px;margin:8px 0}.btn{border:1px solid #ccd2da;border-radius:10px;padding:11px 15px;background:#fff;font-weight:800;cursor:pointer}.primary{background:#111827;color:#fff}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.status{margin:12px 0;padding:10px;border-radius:10px;background:#f5f7fa}.doc{display:none;margin-top:25px;padding:35px;border:1px solid #ddd;border-radius:12px}.doc table{width:100%;border-collapse:collapse}.doc td,.doc th{padding:9px;border-bottom:1px solid #ddd}.total{text-align:right;font-size:1.3rem;font-weight:900}@media(max-width:650px){.grid,.item{grid-template-columns:1fr}}@media print{header,.form,.actions,.status{display:none!important}.wrap{margin:0;padding:0}.doc{display:block;border:0}}</style></head><body><header id="site-header"></header><main class="wrap"><div class="card form"><h1>📋 Quote Maker</h1><p class="muted">Crie orçamentos claros para apresentar preços e serviços aos seus clientes.</p><div id="status" class="status">A verificar a sua conta…</div><div class="grid"><label>Seu negócio<input id="biz" placeholder="Nome do negócio"></label><label>Cliente<input id="client" placeholder="Nome do cliente"></label><label>Data<input id="date" type="date"></label><label>Validade<input id="valid" type="date"></label><label>Número<input id="number" placeholder="QT-001"></label><label>Moeda<input id="currency" value="USD"></label></div><h3>Itens</h3><div id="items"></div><button class="btn" onclick="addItem()">+ Adicionar item</button><label style="margin-top:15px">Observações<textarea id="notes" placeholder="Prazo, condições e informações adicionais."></textarea></label><div class="actions"><button class="btn primary" onclick="generate()">Gerar orçamento</button><a class="btn" href="/billing/">Comprar créditos</a></div></div><section id="doc" class="doc"></section></main><footer id="site-footer"></footer><script src="/js/app.js" defer></script><script>
const TOOL='business-quote';let remaining=0;date.value=new Date().toISOString().slice(0,10);function addItem(){let x=document.createElement('div');x.className='item';x.innerHTML='<input class="desc" placeholder="Serviço/produto"><input class="qty" type="number" value="1" min="0"><input class="price" type="number" step="0.01" placeholder="Preço"><button class="btn" onclick="this.parentElement.remove()">×</button>';items.appendChild(x)}addItem();async function usage(){let r=await fetch('/api/business/tools/usage?tool='+TOOL,{credentials:'include'});if(r.status===401)return location.href='/auth/';let d=await r.json();if(!r.ok)return status.textContent=d.error||'Erro';remaining=d.free_generations_remaining;status.textContent=`${remaining} orçamento(s) grátis restante(s) hoje • depois 5 créditos`}async function generate(){let r=await fetch('/api/business/tools/consume',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({tool:TOOL,reference:(number.value||'QT')+'-'+Date.now()})});let d=await r.json();if(r.status===401)return location.href='/auth/';if(!r.ok)return status.textContent=d.error||'Não foi possível gerar.';let a=[...document.querySelectorAll('.item')].map(x=>[x.querySelector('.desc').value||'Item',+x.querySelector('.qty').value||0,+x.querySelector('.price').value||0]);let total=a.reduce((s,x)=>s+x[1]*x[2],0);doc.innerHTML=`<h1>${biz.value||'Orçamento'}</h1><p><b>${number.value||'QT-001'}</b> · ${date.value}</p><p>Cliente: <b>${client.value||'—'}</b></p><table><tr><th>Item</th><th>Qtd.</th><th>Preço</th><th>Total</th></tr>${a.map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td>${currency.value} ${x[2].toFixed(2)}</td><td>${currency.value} ${(x[1]*x[2]).toFixed(2)}</td></tr>`).join('')}</table><p class="total">Total: ${currency.value} ${total.toFixed(2)}</p><p>${notes.value||''}</p><button class="btn primary" onclick="print()">Imprimir / Guardar PDF</button>`;doc.style.display='block';status.textContent=d.charged?'Orçamento criado • 5 créditos usados.':'Orçamento criado gratuitamente.';remaining=Math.max(0,remaining-1)}usage();</script></body></html>
