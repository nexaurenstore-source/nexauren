<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Expense Tracker — Nexauren Business</title><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/nexauren-redesign.css"><style>.wrap{max-width:900px;margin:45px auto;padding:20px}.card{border:1px solid #ddd;border-radius:18px;padding:24px}.muted{color:#667085}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:grid;gap:6px;font-weight:700;font-size:.9rem}input,select,textarea{padding:12px;border:1px solid #d8dde5;border-radius:10px;font:inherit}.row{display:grid;grid-template-columns:1.5fr 1fr 1fr auto;gap:8px;margin:8px 0}.btn{border:1px solid #ccd2da;border-radius:10px;padding:11px 15px;background:#fff;font-weight:800;cursor:pointer}.primary{background:#111827;color:#fff}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.status{margin:12px 0;padding:10px;background:#f5f7fa;border-radius:10px}.report{display:none;margin-top:25px;padding:24px;border:1px solid #ddd;border-radius:12px}.metric{font-size:2rem;font-weight:900}@media(max-width:650px){.grid,.row{grid-template-columns:1fr}}</style></head><body><header id="site-header"></header><main class="wrap"><div class="card"><h1>📊 Expense Tracker</h1><p class="muted">Registe despesas e obtenha um resumo rápido dos custos do seu negócio.</p><div id="status" class="status">A verificar a sua conta…</div><div class="grid"><label>Seu negócio<input id="biz" placeholder="Nome do negócio"></label><label>Período<input id="period" placeholder="Agosto 2026"></label></div><h3>Despesas</h3><div id="rows"></div><button class="btn" onclick="addRow()">+ Adicionar despesa</button><div class="actions"><button class="btn primary" onclick="generate()">Gerar relatório</button><a class="btn" href="/billing/">Comprar créditos</a></div></div><section id="report" class="report"></section></main><footer id="site-footer"></footer><script src="/js/app.js" defer></script><script>
const TOOL='business-expense';let remaining=0;function addRow(){let x=document.createElement('div');x.className='row';x.innerHTML='<input class="desc" placeholder="Despesa"><input class="cat" placeholder="Categoria"><input class="amount" type="number" min="0" step="0.01" placeholder="Valor"><button class="btn" onclick="this.parentElement.remove()">×</button>';rows.appendChild(x)}addRow();async function usage(){let r=await fetch('/api/business/tools/usage?tool='+TOOL,{credentials:'include'});if(r.status===401)return location.href='/auth/';let d=await r.json();if(!r.ok)return status.textContent=d.error||'Erro';remaining=d.free_generations_remaining;status.textContent=`${remaining} relatório(s) grátis restante(s) hoje • depois 5 créditos por relatório`}async function generate(){let r=await fetch('/api/business/tools/consume',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({tool:TOOL,reference:(period.value||'period')+'-'+Date.now()})});let d=await r.json();if(r.status===401)return location.href='/auth/';if(!r.ok)return status.textContent=d.error||'Não foi possível gerar.';let a=[...document.querySelectorAll('.row')].map(x=>({d:x.querySelector('.desc').value||'Despesa',c:x.querySelector('.cat').value||'Outros',v:+x.querySelector('.amount').value||0}));let total=a.reduce((s,x)=>s+x.v,0);let cats={};a.forEach(x=>cats[x.c]=(cats[x.c]||0)+x.v);report.innerHTML=`<h2>${biz.value||'Negócio'} — ${period.value||'Relatório'}</h2><p class="metric">${total.toFixed(2)}</p><p>Total de despesas</p><h3>Por categoria</h3><ul>${Object.entries(cats).map(([c,v])=>`<li><b>${c}</b>: ${v.toFixed(2)}</li>`).join('')}</ul><h3>Detalhes</h3><ul>${a.map(x=>`<li>${x.d} — ${x.c}: ${x.v.toFixed(2)}</li>`).join('')}</ul><button class="btn primary" onclick="print()">Imprimir / Guardar PDF</button>`;report.style.display='block';status.textContent=d.charged?'Relatório criado • 5 créditos usados.':'Relatório criado gratuitamente.';remaining=Math.max(0,remaining-1)}usage();</script></body></html>
