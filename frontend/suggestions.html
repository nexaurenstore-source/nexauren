<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Suggestions — Nexauren</title><meta name="description" content="Send an idea or suggestion to Nexauren."><link rel="stylesheet" href="/css/style.css"></head><body><div id="site-header"></div><main class="container page-content"><h1>Suggestions</h1><p>Have an idea for a new tool or feature? Send it to us.</p><form class="feedback-form" data-mail-form data-type="Suggestion"><label>Suggestion type<select name="problem" required><option value="">Select…</option><option>New tool</option><option>New feature</option><option>Design</option><option>Performance</option><option>Other</option></select></label><label>Title<input name="title" required maxlength="120" placeholder="Suggestion title"></label><label>Message<textarea name="message" required rows="8" placeholder="Tell us your idea…"></textarea></label><button class="button button-primary" type="submit">Send suggestion</button></form></main><div id="site-footer"></div><script src="/js/app.js" defer></script><script src="/js/feedback.js" defer></script></body></html>
