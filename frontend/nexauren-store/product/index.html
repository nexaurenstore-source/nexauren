<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product — Nexauren Marketplace</title><meta name="description" content="Nexauren Marketplace digital product"><link rel="stylesheet" href="/nexauren-store/store.css"><style>.product-page{padding:50px 0 80px}.product-detail{display:grid;grid-template-columns:minmax(280px,1fr) minmax(300px,1fr);gap:35px;align-items:start}.product-cover{min-height:420px;border:1px solid var(--line);border-radius:24px;background:#f7f5ff;display:grid;place-items:center;overflow:hidden;font-size:7rem}.product-cover img{width:100%;height:100%;object-fit:cover}.product-info{padding:10px 0}.product-info h1{font-size:clamp(2rem,5vw,4rem);margin:8px 0 15px}.product-description{color:var(--muted);line-height:1.7}.product-price{font-size:2rem;font-weight:900;margin:25px 0}.product-actions{display:flex;gap:10px;flex-wrap:wrap}.product-actions button,.product-actions a{border:0;border-radius:12px;padding:13px 18px;font-weight:800;cursor:pointer;text-decoration:none}.primary{background:#17131f;color:#fff}.secondary{background:#f0edff;color:#17131f}.detail-section{margin-top:45px;padding-top:30px;border-top:1px solid var(--line)}.feature-list{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:0;list-style:none}.feature-list li{padding:13px;border:1px solid var(--line);border-radius:12px}@media(max-width:750px){.product-detail{grid-template-columns:1fr}.product-cover{min-height:280px}.feature-list{grid-template-columns:1fr}}</style></head>
<body><header class="store-header"><div class="store-container header-inner"><a class="store-brand" href="/" aria-label="Nexauren"><span class="brand-mark">N</span><span>NEXAUREN <b>MARKETPLACE</b></span></a><div class="header-actions"><a class="account-btn" href="/nexauren-store/">Marketplace</a><a class="account-btn" href="/account/">My Account</a></div></div></header>
<main class="product-page"><div class="store-container"><div id="product">Loading product…</div></div></main>
<script>
const API='/api/store/';const root=document.querySelector('#product');const params=new URLSearchParams(location.search);const slug=params.get('slug');
const esc=v=>String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));
const money=(v,c='USD')=>Number(v)===0?'Free':new Intl.NumberFormat(undefined,{style:'currency',currency:c}).format(Number(v)||0);
async function load(){if(!slug){root.innerHTML='<h1>Product not found</h1><p><a href="/nexauren-store/">Back to Marketplace</a></p>';return}try{const r=await fetch(API+'products/'+encodeURIComponent(slug),{credentials:'include'});const d=await r.json();if(!r.ok)throw new Error(d.error||'Product not found');const p=d.product||{};document.title=(p.name||'Product')+' — Nexauren Marketplace';root.innerHTML=`<div class="product-detail"><div class="product-cover">${p.coverImageUrl?`<img src="${esc(p.coverImageUrl)}" alt="${esc(p.name)}">`:(p.icon||'📦')}</div><section class="product-info"><span class="kicker">${esc(p.category||'DIGITAL PRODUCT')}</span><h1>${esc(p.name)}</h1><p class="product-description">${esc(p.shortDescription||p.description||'')}</p><div class="product-price">${money(p.price,p.currency)}</div><div class="product-actions"><button class="primary" id="buy">${Number(p.price)===0?'Get product':'Buy now'}</button><button class="secondary" id="cart">Add to cart</button><a class="secondary" href="/nexauren-store/">← Back</a></div><p class="product-description">★ ${Number(p.rating||0).toFixed(1)} · ${esc(p.format||'Digital')} · One-time purchase</p></section></div><section class="detail-section"><h2>About this product</h2><p class="product-description">${esc(p.longDescription||p.description||'Product details will appear here.')}</p>${(p.features||[]).length?`<h3>Features</h3><ul class="feature-list">${p.features.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}${(p.included||[]).length?`<h3>What's included</h3><ul class="feature-list">${p.included.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}<h3>License & requirements</h3><p class="product-description">${esc(p.licenseText||p.licenseType||'Standard Nexauren Marketplace license')}${p.requirements?' · '+esc(p.requirements):''}</p></section><section class="detail-section"><h2>Reviews</h2><div id="reviews">${(d.reviews||[]).length?(d.reviews||[]).map(x=>`<article><strong>★ ${Number(x.rating||0)}/5 ${esc(x.title||'')}</strong><p>${esc(x.body||'')}</p></article>`).join(''):'<p class="product-description">No approved reviews yet.</p>'}</div></section>`;document.querySelector('#buy').onclick=()=>checkout(p.id);document.querySelector('#cart').onclick=()=>cart(p.id)}catch(e){root.innerHTML='<h1>Product unavailable</h1><p class="product-description">'+esc(e.message)+'</p><p><a href="/nexauren-store/">Back to Marketplace</a></p>'}}
async function checkout(id){try{const r=await fetch(API+'checkout',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({product_id:id})});const d=await r.json();if(r.status===401){location.href='/login/?next='+encodeURIComponent(location.pathname+location.search);return}if(!r.ok)throw new Error(d.error||'Checkout unavailable');if(d.free){alert('Product added to your Nexauren library.');return}if(d.checkout?.approval_url)location.href=d.checkout.approval_url;else throw new Error('PayPal approval link was not returned.')}catch(e){alert(e.message)}}
async function cart(id){try{const r=await fetch(API+'cart',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({product_id:id,quantity:1})});const d=await r.json();if(r.status===401){location.href='/login/?next='+encodeURIComponent(location.pathname+location.search);return}if(!r.ok)throw new Error(d.error||'Unable to add to cart');alert('Added to your Nexauren Marketplace cart.')}catch(e){alert(e.message)}}load();
</script></body></html>
