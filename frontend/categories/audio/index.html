<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Nexauren Audio Tools"
    >

    <title>Nexauren — Audio</title>


    <!-- =====================================================
         STYLES
         ===================================================== -->

    <link
        rel="stylesheet"
        href="/css/style.css"
    >

    <link
        rel="stylesheet"
        href="/css/dashboard.css"
    >

</head>


<body>

    <!-- =====================================================
         PAGE TRANSITION
         ===================================================== -->

    <div
        class="page-transition"
        aria-hidden="true"
    ></div>


    <!-- =====================================================
         HEADER
         ===================================================== -->

    <header>

        <nav>

            <a
                href="/"
                class="logo"
            >
                NEXAUREN
            </a>


            <div class="nav-links">

                <a href="/dashboard/">
                    Dashboard
                </a>

                <a href="/">
                    Home
                </a>

            </div>

        </nav>

    </header>


    <!-- =====================================================
         MAIN
         ===================================================== -->

    <main class="dashboard-page">


        <!-- =================================================
             CATEGORY HERO
             ================================================= -->

        <section class="dashboard-hero">

            <div class="dashboard-hero-content">

                <div class="status">
                    Category
                </div>


                <h1>
                    Audio
                </h1>


                <p>
                    Discover Nexauren tools
                    for working with audio.
                </p>

            </div>

        </section>


        <!-- =================================================
             TOOLS
             ================================================= -->

        <section
            class="dashboard-categories"
        >

            <div class="section-title">

                <h2>
                    Audio Tools
                </h2>


                <p>
                    Tools available in this category.
                </p>

            </div>


            <!--
                IMPORTANTE:

                O JavaScript vai preencher
                este elemento automaticamente
                usando /data/tools.json
            -->

            <div
                id="tools-grid"
                class="categories-grid"
            ></div>

        </section>

    </main>


    <!-- =====================================================
         FOOTER
         ===================================================== -->

    <footer>

        <p>
            © 2026 Nexauren.
            All rights reserved.
        </p>

    </footer>


    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script
        src="/js/app.js"
        defer
    ></script>


    <!--
        Motor automático das categorias.
        
        Ele:
        1. verifica a sessão
        2. identifica que estamos em /audio/
        3. lê /data/tools.json
        4. procura ferramentas da categoria Audio
        5. cria os cards automaticamente
    -->

    <script
        src="/js/category.js"
        defer
    ></script>

</body>

            </html>
