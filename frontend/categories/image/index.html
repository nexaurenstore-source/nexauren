<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Nexauren Image Tools"
    >

    <title>Nexauren — Images</title>

    <link
        rel="stylesheet"
        href="/css/style.css"
    >

    <link
        rel="stylesheet"
        href="/css/dashboard.css"
    >

</head>


<body>

    <div
        class="page-transition"
        aria-hidden="true"
    ></div>


    <header>

        <nav>

            <a
                href="/"
                class="logo"
            >
                NEXAUREN
            </a>


            <div class="nav-links">

                <a href="/dashboard/">
                    Dashboard
                </a>

                <a href="/">
                    Home
                </a>

            </div>

        </nav>

    </header>


    <main class="dashboard-page">

        <section class="dashboard-hero">

            <div class="dashboard-hero-content">

                <div class="status">
                    Category
                </div>

                <h1>
                    Images
                </h1>

                <p>
                    Discover Nexauren tools
                    for working with images.
                </p>

            </div>

        </section>


        <section class="dashboard-categories">

            <div class="section-title">

                <h2>
                    Image Tools
                </h2>

                <p>
                    Tools available in this category.
                </p>

            </div>


            <div
                id="tools-grid"
                class="categories-grid"
            >

                <div
                    class="card"
                    style="text-align:center;"
                >

                    <h3>
                        Loading tools...
                    </h3>

                    <p>
                        Nexauren is loading
                        the available tools.
                    </p>

                </div>

            </div>

        </section>

    </main>


    <footer>

        <p>
            © 2026 Nexauren.
            All rights reserved.
        </p>

    </footer>


    <script
        src="/js/app.js"
        defer
    ></script>


    <script
    src="/js/categories.js"
    defer
></script>

</body>

        </html>
