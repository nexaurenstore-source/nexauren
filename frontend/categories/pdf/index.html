<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Nexauren PDF Tools"
    >

    <title>Nexauren — PDF</title>


    <!-- =====================================================
         STYLES
         ===================================================== -->

    <link
        rel="stylesheet"
        href="/css/style.css"
    >

    <link
        rel="stylesheet"
        href="/css/dashboard.css"
    >

</head>


<body>

    <!-- =====================================================
         PAGE TRANSITION
         ===================================================== -->

    <div
        class="page-transition"
        aria-hidden="true"
    ></div>


    <!-- =====================================================
         HEADER
         ===================================================== -->

    <header>

        <nav>

            <a
                href="/"
                class="logo"
            >
                NEXAUREN
            </a>


            <div class="nav-links">

                <a href="/dashboard/">
                    Dashboard
                </a>

                <a href="/">
                    Home
                </a>

            </div>

        </nav>

    </header>


    <!-- =====================================================
         MAIN
         ===================================================== -->

    <main class="dashboard-page">


        <!-- =================================================
             CATEGORY HERO
             ================================================= -->

        <section class="dashboard-hero">

            <div
                class="dashboard-hero-content"
            >

                <div class="status">
                    Category
                </div>


                <h1>
                    PDF
                </h1>


                <p>
                    Discover Nexauren tools
                    for creating, editing and
                    processing PDF files.
                </p>

            </div>

        </section>


        <!-- =================================================
             TOOLS
             ================================================= -->

        <section
            class="dashboard-categories"
        >

            <div class="section-title">

                <h2>
                    PDF Tools
                </h2>


                <p>
                    Tools available in this category.
                </p>

            </div>


            <!--
                O category.js irá preencher
                esta área automaticamente
                através do tools.json.
            -->

            <div
                id="tools-grid"
                class="categories-grid"
            ></div>

        </section>

    </main>


    <!-- =====================================================
         FOOTER
         ===================================================== -->

    <footer>

        <p>
            © 2026 Nexauren.
            All rights reserved.
        </p>

    </footer>


    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script
        src="/js/app.js"
        defer
    ></script>


    <!--
        CATEGORY ENGINE

        Responsável por:

        • verificar a sessão
        • identificar a categoria PDF
        • carregar tools.json
        • encontrar ferramentas PDF
        • criar os cards automaticamente
    -->

    <script
    src="/js/app.js"
    defer
></script>

<script
    src="/js/categories.js"
    defer
></script>
</body>

    </html>
