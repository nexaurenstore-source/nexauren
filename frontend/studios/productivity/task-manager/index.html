<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Task Manager — Nexauren</title><meta name="description" content="Create, prioritize and complete tasks in your browser."><link rel="stylesheet" href="/studios/audio/studio.css"><style>.nx-workspace{display:grid;gap:18px}.nx-form{display:grid;grid-template-columns:1fr auto auto;gap:10px}.nx-input,.nx-select{padding:14px;border:1px solid #ddd;border-radius:12px;background:#fff}.nx-list{display:grid;gap:8px}.nx-task{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid #e5e5e5;border-radius:14px}.nx-task span{flex:1}.nx-done{text-decoration:line-through;opacity:.55}.nx-empty{padding:24px;text-align:center;opacity:.55}@media(max-width:650px){.nx-form{grid-template-columns:1fr}.nx-task{align-items:flex-start}}</style></head><body><main class="as-page"><div class="as-wrap"><a class="as-crumb" href="/studios/productivity/">← Productivity Studio</a><section class="as-hero"><div class="as-hero-copy"><span class="as-kicker">TASK MANAGER</span><h1>Get things done.</h1><p>Create tasks, set priorities and track completion in a calm workspace.</p></div></section><section class="as-section nx-workspace"><form id="f" class="nx-form"><input class="nx-input" id="t" required maxlength="200" placeholder="New task…"><select class="nx-select" id="p"><option>High</option><option selected>Normal</option><option>Low</option></select><button>Add task</button></form><div id="list" class="nx-list" aria-live="polite"></div></section></div></main><script>const f=document.querySelector('#f'),t=document.querySelector('#t'),p=document.querySelector('#p'),l=document.querySelector('#list');let tasks=JSON.parse(localStorage.nxTasks||'[]');function save(){localStorage.nxTasks=JSON.stringify(tasks);render()}function render(){if(!tasks.length){l.innerHTML='<div class="nx-empty">No tasks yet. Add your first one.</div>';return}l.innerHTML=tasks.map((x,i)=>`<div class="nx-task"><input type="checkbox" ${x.done?'checked':''} onchange="tasks[${i}].done=this.checked;save()"><span class="${x.done?'nx-done':''}">${escapeHtml(x.text)} <small>(${x.priority})</small></span><button type="button" onclick="tasks.splice(${i},1);save()">Delete</button></div>`).join('')}function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}f.onsubmit=e=>{e.preventDefault();tasks.push({text:t.value.trim(),priority:p.value,done:false});t.value='';save();t.focus()};render()</script></body></html>
