<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Task Manager — Nexauren</title><meta name="description" content="Create, prioritize and complete tasks in your browser."><link rel="stylesheet" href="/studios/audio/studio.css"><script src="/js/ads.js" defer></script><style>.pm{max-width:1000px;margin:auto}.task-form{display:flex;gap:10px;flex-wrap:wrap}.task-form input,.task-form select{padding:13px;border:1px solid rgba(127,127,127,.25);border-radius:12px;background:transparent;color:inherit;font:inherit}.task-form input{flex:1;min-width:220px}.task-form button,.task-actions button{padding:11px 14px;border-radius:12px;border:1px solid rgba(127,127,127,.25);font:inherit;font-weight:700;cursor:pointer}.task-row{display:flex;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid rgba(127,127,127,.2)}.task-row span{flex:1;min-width:0;overflow-wrap:anywhere}.task-row.done span{text-decoration:line-through;opacity:.6}.task-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.muted{opacity:.7}.empty{padding:28px;text-align:center;opacity:.65}.task-row button{padding:7px 10px;border-radius:9px;border:1px solid rgba(127,127,127,.25);background:transparent;color:inherit}.task-form input:focus-visible,.task-form select:focus-visible,button:focus-visible{outline:3px solid currentColor;outline-offset:2px}@media(max-width:600px){.task-form select,.task-form button{width:100%}.task-row{align-items:flex-start}}</style></head><body><main class="as-page"><div class="as-wrap pm"><a class="as-crumb" href="/tools/">← Tools</a><section class="as-hero"><div class="as-hero-copy"><span class="as-kicker">PRODUCTIVITY</span><h1>Get things done.</h1><p>Create tasks, set priorities and track completion.</p></div></section><section class="as-section"><form id="f" class="task-form"><input id="t" required maxlength="300" placeholder="New task…" aria-label="New task"><select id="p" aria-label="Task priority"><option>High</option><option selected>Normal</option><option>Low</option></select><button>Add task</button></form><div class="task-actions"><button type="button" id="clearDone">Clear completed</button><button type="button" id="clearAll">Clear all</button><span id="summary" class="muted" aria-live="polite"></span></div><div id="list" aria-live="polite"></div></section></div></main><script>const f=document.querySelector('#f'),t=document.querySelector('#t'),p=document.querySelector('#p'),l=document.querySelector('#list'),summary=document.querySelector('#summary');let tasks;try{tasks=JSON.parse(localStorage.nxTasks||'[]');if(!Array.isArray(tasks))tasks=[]}catch{tasks=[]}function save(){localStorage.nxTasks=JSON.stringify(tasks);render()}function render(){const done=tasks.filter(x=>x.done).length;summary.textContent=`${done}/${tasks.length} completed`;if(!tasks.length){l.innerHTML='<div class="empty">No tasks yet.</div>';return}l.innerHTML=tasks.map((x,n)=>`<div class="task-row ${x.done?'done':''}"><input type="checkbox" ${x.done?'checked':''} aria-label="Complete ${escapeHtml(x.text)}" data-i="${n}" class="toggle"><span>${escapeHtml(x.text)} <small>(${escapeHtml(x.priority)})</small></span><button type="button" data-del="${n}" aria-label="Delete ${escapeHtml(x.text)}">Delete</button></div>`).join('');l.querySelectorAll('.toggle').forEach(e=>e.onchange=()=>{tasks[+e.dataset.i].done=e.checked;save()});l.querySelectorAll('[data-del]').forEach(e=>e.onclick=()=>{tasks.splice(+e.dataset.del,1);save()})}function escapeHtml(v){return String(v).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[c]))}f.onsubmit=e=>{e.preventDefault();tasks.push({text:t.value.trim(),priority:p.value,done:false});t.value='';save();t.focus()};document.querySelector('#clearDone').onclick=()=>{tasks=tasks.filter(x=>!x.done);save()};document.querySelector('#clearAll').onclick=()=>{if(tasks.length&&!confirm('Clear all tasks?'))return;tasks=[];save()};render()</script></body></html>
