<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Task Manager — Nexauren</title><meta name="description" content="Create, prioritize and complete tasks in your browser."><link rel="stylesheet" href="/studios/audio/studio.css"><script src="/js/ads.js" defer></script>
</head><body><main class="as-page"><div class="as-wrap"><a class="as-crumb" href="/studios/productivity/">← Productivity Studio</a><section class="as-hero"><div class="as-hero-copy"><span class="as-kicker">TASK MANAGER</span><h1>Get things done.</h1><p>Create tasks, set priorities and track completion.</p></div></section><section class="as-section"><form id="f" style="display:flex;gap:10px;flex-wrap:wrap"><input id="t" required placeholder="New task…" style="flex:1;min-width:220px;padding:14px;border-radius:12px"><select id="p"><option>High</option><option selected>Normal</option><option>Low</option></select><button>Add task</button></form><div id="list" style="margin-top:18px"></div></section></div></main><script>const f=document.querySelector('#f'),t=document.querySelector('#t'),p=document.querySelector('#p'),l=document.querySelector('#list');let tasks=JSON.parse(localStorage.nxTasks||'[]');function save(){localStorage.nxTasks=JSON.stringify(tasks);render()}function render(){l.innerHTML=tasks.map((x,i)=>`<div style="display:flex;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid #ddd"><input type="checkbox" ${x.done?'checked':''} onchange="tasks[${i}].done=this.checked;save()"><span style="flex:1;text-decoration:${x.done?'line-through':'none'}">${x.text} <small>(${x.priority})</small></span><button onclick="tasks.splice(${i},1);save()">Delete</button></div>`).join('')}f.onsubmit=e=>{e.preventDefault();tasks.push({text:t.value,priority:p.value,done:false});t.value='';save()};render()</script></body></html>
