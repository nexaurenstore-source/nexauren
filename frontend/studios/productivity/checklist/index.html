<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checklist — Nexauren</title><meta name="description" content="Build simple reusable checklists and complete items in your browser."><link rel="stylesheet" href="/studios/audio/studio.css"><script src="/js/ads.js" defer></script><style>.check{max-width:900px;margin:auto}.form{display:flex;gap:10px;flex-wrap:wrap}.form input{flex:1;min-width:220px;padding:14px;border:1px solid rgba(127,127,127,.25);border-radius:12px;background:transparent;color:inherit;font:inherit}.form button,.tools button,.row button{padding:10px 13px;border:1px solid rgba(127,127,127,.25);border-radius:11px;background:transparent;color:inherit;font:inherit;font-weight:700;cursor:pointer}.tools{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.progress{margin:16px 0 8px}.bar{height:8px;border-radius:99px;background:rgba(127,127,127,.15);overflow:hidden}.fill{height:100%;width:0;background:currentColor;transition:width .2s}.row{display:flex;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid rgba(127,127,127,.2)}.row span{flex:1;overflow-wrap:anywhere}.row.done span{text-decoration:line-through;opacity:.6}.empty{text-align:center;padding:28px;opacity:.65}.form input:focus-visible,button:focus-visible{outline:3px solid currentColor;outline-offset:2px}@media(max-width:600px){.form button{width:100%}.row{align-items:flex-start}}</style></head><body><main class="as-page"><div class="as-wrap check"><a class="as-crumb" href="/tools/">← Tools</a><section class="as-hero"><div class="as-hero-copy"><span class="as-kicker">PRODUCTIVITY</span><h1>Check it off.</h1><p>Build a checklist, track progress and keep completed items out of your head.</p></div></section><section class="as-section"><form id="f" class="form"><input id="i" required maxlength="300" placeholder="Add checklist item…" aria-label="Checklist item"><button>Add</button></form><div class="progress"><strong id="summary" aria-live="polite">0/0 completed</strong><div class="bar" aria-hidden="true"><div id="fill" class="fill"></div></div></div><div class="tools"><button type="button" id="clearDone">Clear completed</button><button type="button" id="clearAll">Clear all</button></div><div id="l" aria-live="polite"></div></section></div></main><script>const f=document.querySelector('#f'),i=document.querySelector('#i'),l=document.querySelector('#l'),summary=document.querySelector('#summary'),fill=document.querySelector('#fill');let a;try{a=JSON.parse(localStorage.nxChecklist||'[]');if(!Array.isArray(a))a=[]}catch{a=[]}function save(){localStorage.nxChecklist=JSON.stringify(a);render()}function esc(v){return String(v).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[c]))}function render(){const done=a.filter(x=>x.done).length,pct=a.length?Math.round(done/a.length*100):0;summary.textContent=`${done}/${a.length} completed`;fill.style.width=pct+'%';if(!a.length){l.innerHTML='<div class="empty">No checklist items yet.</div>';return}l.innerHTML=a.map((x,n)=>`<div class="row ${x.done?'done':''}"><input type="checkbox" ${x.done?'checked':''} data-i="${n}" aria-label="Complete ${esc(x.text)}"><span>${esc(x.text)}</span><button type="button" data-del="${n}" aria-label="Delete ${esc(x.text)}">Delete</button></div>`).join('');l.querySelectorAll('input').forEach(e=>e.onchange=()=>{a[+e.dataset.i].done=e.checked;save()});l.querySelectorAll('[data-del]').forEach(e=>e.onclick=()=>{a.splice(+e.dataset.del,1);save()})}f.onsubmit=e=>{e.preventDefault();a.push({text:i.value.trim(),done:false});i.value='';save();i.focus()};document.querySelector('#clearDone').onclick=()=>{a=a.filter(x=>!x.done);save()};document.querySelector('#clearAll').onclick=()=>{if(a.length&&!confirm('Clear all checklist items?'))return;a=[];save()};render()</script></body></html>
