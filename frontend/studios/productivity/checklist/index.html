<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checklist — Nexauren</title><meta name="description" content="Build simple reusable checklists and complete items in your browser."><link rel="stylesheet" href="/studios/audio/studio.css"><script src="/js/ads.js" defer></script>
</head><body><main class="as-page"><div class="as-wrap"><a class="as-crumb" href="/studios/productivity/">← Productivity Studio</a><section class="as-hero"><div class="as-hero-copy"><span class="as-kicker">CHECKLIST</span><h1>Check it off.</h1><p>Build a checklist, track progress and keep completed items out of your head.</p></div></section><section class="as-section"><form id="f" style="display:flex;gap:10px"><input id="i" required placeholder="Add checklist item…" style="flex:1;padding:14px;border-radius:12px"><button>Add</button></form><div id="l" style="margin-top:18px"></div></section></div></main><script>const f=document.querySelector('#f'),i=document.querySelector('#i'),l=document.querySelector('#l');let a=JSON.parse(localStorage.nxChecklist||'[]');function save(){localStorage.nxChecklist=JSON.stringify(a);render()}function render(){l.innerHTML=a.map((x,n)=>`<div style="display:flex;gap:12px;padding:14px 0;border-bottom:1px solid #ddd"><input type="checkbox" ${x.done?'checked':''} onchange="a[${n}].done=this.checked;save()"><span style="flex:1;text-decoration:${x.done?'line-through':'none'}">${x.text}</span><button onclick="a.splice(${n},1);save()">Delete</button></div>`).join('')}f.onsubmit=e=>{e.preventDefault();a.push({text:i.value,done:false});i.value='';save()};render()</script></body></html>
