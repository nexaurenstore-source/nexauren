<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Planner — Nexauren</title><meta name="description" content="Turn goals and priorities into a practical daily plan."><link rel="stylesheet" href="/studios/audio/studio.css"><script src="/js/ads.js" defer></script>
</head><body><main class="as-page"><div class="as-wrap"><a class="as-crumb" href="/studios/productivity/">← Productivity Studio</a><section class="as-hero"><div class="as-hero-copy"><span class="as-kicker">PLANNER</span><h1>Plan your day.</h1><p>Set a date, define priorities and keep a simple plan at hand.</p></div></section><section class="as-section"><input id="d" type="date" style="padding:12px;border-radius:12px"><textarea id="p" rows="16" placeholder="Today's priorities and plan…" style="width:100%;box-sizing:border-box;margin-top:14px;padding:18px;border-radius:16px"></textarea><p>Saved automatically for the selected date.</p></section></div></main><script>const d=document.querySelector('#d'),p=document.querySelector('#p');d.value=new Date().toISOString().slice(0,10);function key(){return'nxPlan-'+d.value}function load(){p.value=localStorage[key()]||''}d.onchange=load;p.oninput=()=>localStorage[key()]=p.value;load()</script></body></html>
