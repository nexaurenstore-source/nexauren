<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Planner — Nexauren</title><meta name="description" content="Turn goals and priorities into a practical daily plan."><link rel="stylesheet" href="/studios/audio/studio.css"><script src="/js/ads.js" defer></script><style>.planner{max-width:900px;margin:auto}.date{padding:12px;border:1px solid rgba(127,127,127,.25);border-radius:12px;background:transparent;color:inherit;font:inherit}.plan{width:100%;box-sizing:border-box;margin-top:14px;padding:18px;border:1px solid rgba(127,127,127,.25);border-radius:16px;background:transparent;color:inherit;font:inherit;line-height:1.6;resize:vertical;min-height:360px}.tools{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}.tools button{padding:10px 14px;border:1px solid rgba(127,127,127,.25);border-radius:11px;background:transparent;color:inherit;font:inherit;font-weight:700;cursor:pointer}.meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;opacity:.7;margin-top:9px}.date:focus-visible,.plan:focus-visible,button:focus-visible{outline:3px solid currentColor;outline-offset:2px}</style></head><body><main class="as-page"><div class="as-wrap planner"><a class="as-crumb" href="/tools/">← Tools</a><section class="as-hero"><div class="as-hero-copy"><span class="as-kicker">PRODUCTIVITY</span><h1>Plan your day.</h1><p>Set a date, define priorities and keep a simple plan at hand.</p></div></section><section class="as-section"><label for="d">Plan date</label><br><input id="d" class="date" type="date" aria-label="Plan date"><textarea id="p" class="plan" maxlength="20000" placeholder="Today's priorities and plan…" aria-label="Daily plan"></textarea><div class="meta"><span id="count">0 characters</span><span id="saved" aria-live="polite">Saved automatically.</span></div><div class="tools"><button type="button" id="today">Today</button><button type="button" id="copy">Copy</button><button type="button" id="download">Download .txt</button><button type="button" id="clear">Clear day</button></div></section></div></main><script>const d=document.querySelector('#d'),p=document.querySelector('#p'),count=document.querySelector('#count'),saved=document.querySelector('#saved');const today=()=>new Date().toISOString().slice(0,10);d.value=today();function key(){return'nxPlan-'+d.value}function load(){p.value=localStorage[key()]||'';count.textContent=p.value.length.toLocaleString()+' characters';saved.textContent='Saved automatically.'}function save(){localStorage[key()]=p.value;count.textContent=p.value.length.toLocaleString()+' characters';saved.textContent='Saved locally.'}d.onchange=load;p.oninput=save;document.querySelector('#today').onclick=()=>{d.value=today();load()};document.querySelector('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(p.value);saved.textContent='Copied.'}catch{saved.textContent='Copy unavailable.'}};document.querySelector('#download').onclick=()=>{const url=URL.createObjectURL(new Blob([p.value],{type:'text/plain;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='nexauren-plan-'+d.value+'.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);saved.textContent='Downloaded.'};document.querySelector('#clear').onclick=()=>{if(p.value&&!confirm('Clear this day?'))return;p.value='';save();saved.textContent='Day cleared.'};load()</script></body></html>
