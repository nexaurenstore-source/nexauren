<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Focus Timer — Nexauren</title><meta name="description" content="Work in focused sessions with a simple browser timer."><link rel="stylesheet" href="/studios/audio/studio.css"><script src="/js/ads.js" defer></script><style>.timer{max-width:800px;margin:auto;text-align:center}.timer input{width:100px;box-sizing:border-box;padding:12px;border:1px solid rgba(127,127,127,.25);border-radius:12px;background:transparent;color:inherit;font:inherit}.clock{font-size:clamp(4rem,15vw,9rem);font-weight:700;margin:20px 0;font-variant-numeric:tabular-nums}.timer button{padding:11px 16px;border:1px solid rgba(127,127,127,.25);border-radius:12px;background:transparent;color:inherit;font:inherit;font-weight:700;cursor:pointer;margin:4px}.timer button:focus-visible,.timer input:focus-visible{outline:3px solid currentColor;outline-offset:2px}.hint{opacity:.7}</style></head><body><main class="as-page"><div class="as-wrap timer"><a class="as-crumb" href="/tools/">← Tools</a><section class="as-hero"><div class="as-hero-copy"><span class="as-kicker">PRODUCTIVITY</span><h1>Focus deeply.</h1><p>Use a simple countdown to protect a focused work session.</p></div></section><section class="as-section"><label for="m">Minutes</label><br><input id="m" type="number" min="1" max="180" value="25" aria-label="Timer minutes"><div id="clock" class="clock" role="timer" aria-live="polite">25:00</div><div><button id="start" type="button">Start</button><button id="pause" type="button">Pause</button><button id="reset" type="button">Reset</button></div><p id="status" class="hint" aria-live="polite">Ready</p></section></div></main><script>let total=1500,timer=null;const c=document.querySelector('#clock'),m=document.querySelector('#m'),status=document.querySelector('#status');function draw(){c.textContent=String(Math.floor(total/60)).padStart(2,'0')+':'+String(total%60).padStart(2,'0')}function stop(){if(timer){clearInterval(timer);timer=null}}function start(){if(timer||total<=0)return;status.textContent='Focus session running.';timer=setInterval(()=>{if(total>0){total--;draw()}else{stop();status.textContent='Session complete.';if('Notification'in window&&Notification.permission==='granted')new Notification('Focus session complete');}},1000)}document.querySelector('#start').onclick=start;document.querySelector('#pause').onclick=()=>{stop();status.textContent='Paused.'};document.querySelector('#reset').onclick=()=>{stop();total=Math.max(1,Math.min(180,+m.value||25))*60;draw();status.textContent='Ready'};m.onchange=()=>{stop();total=Math.max(1,Math.min(180,+m.value||25))*60;draw();status.textContent='Ready'};draw()</script></body></html>
