<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Focus Timer — Nexauren</title><meta name="description" content="Work in focused sessions with a simple browser timer."><link rel="stylesheet" href="/studios/audio/studio.css"></head><body><main class="as-page"><div class="as-wrap"><a class="as-crumb" href="/studios/productivity/">← Productivity Studio</a><section class="as-hero"><div class="as-hero-copy"><span class="as-kicker">FOCUS TIMER</span><h1>Focus deeply.</h1><p>Use a simple countdown to protect a focused work session.</p></div></section><section class="as-section" style="text-align:center"><input id="m" type="number" min="1" max="180" value="25" style="width:90px;padding:12px"><div id="clock" style="font-size:clamp(4rem,15vw,9rem);font-weight:700;margin:20px 0">25:00</div><button id="start">Start</button> <button id="reset">Reset</button></section></div></main><script>let total=1500,timer=null;const c=document.querySelector('#clock'),m=document.querySelector('#m');function draw(){c.textContent=String(Math.floor(total/60)).padStart(2,'0')+':'+String(total%60).padStart(2,'0')}document.querySelector('#start').onclick=()=>{if(timer)return;timer=setInterval(()=>{if(total>0){total--;draw()}else{clearInterval(timer);timer=null}},1000)};document.querySelector('#reset').onclick=()=>{clearInterval(timer);timer=null;total=(+m.value||25)*60;draw()};m.onchange=()=>{clearInterval(timer);timer=null;total=(+m.value||25)*60;draw()};draw()</script></body></html>
