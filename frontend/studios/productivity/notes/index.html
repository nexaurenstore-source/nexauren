<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notes — Nexauren</title><meta name="description" content="Capture ideas and keep notes organized in your browser."><link rel="stylesheet" href="/studios/audio/studio.css"><script src="/js/ads.js" defer></script><style>.notes{max-width:1000px;margin:auto}.note-title,.note-body{width:100%;box-sizing:border-box;padding:14px;border:1px solid rgba(127,127,127,.25);border-radius:14px;background:transparent;color:inherit;font:inherit}.note-body{margin-top:12px;min-height:420px;resize:vertical;line-height:1.6}.note-tools{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}.note-tools button{padding:10px 14px;border:1px solid rgba(127,127,127,.25);border-radius:11px;background:transparent;color:inherit;font:inherit;font-weight:700;cursor:pointer}.note-meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:10px;opacity:.7}.note-title:focus-visible,.note-body:focus-visible,button:focus-visible{outline:3px solid currentColor;outline-offset:2px}</style></head><body><main class="as-page"><div class="as-wrap notes"><a class="as-crumb" href="/tools/">← Tools</a><section class="as-hero"><div class="as-hero-copy"><span class="as-kicker">PRODUCTIVITY</span><h1>Capture ideas.</h1><p>A private writing space with autosave in your browser.</p></div></section><section class="as-section"><input class="note-title" id="title" maxlength="200" placeholder="Note title" aria-label="Note title"><textarea class="note-body" id="body" placeholder="Start writing…" aria-label="Note body"></textarea><div class="note-meta"><span id="count" aria-live="polite">0 characters</span><span id="s">Autosaved locally.</span></div><div class="note-tools"><button type="button" id="copy">Copy</button><button type="button" id="download">Download .txt</button><button type="button" id="clear">Clear note</button></div></section></div></main><script>const a=document.querySelector('#title'),b=document.querySelector('#body'),s=document.querySelector('#s'),count=document.querySelector('#count');a.value=localStorage.nxNoteTitle||'';b.value=localStorage.nxNoteBody||'';function update(){count.textContent=b.value.length.toLocaleString()+' characters'}function save(){localStorage.nxNoteTitle=a.value;localStorage.nxNoteBody=b.value;s.textContent='Saved locally.';update()}a.oninput=b.oninput=save;document.querySelector('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(b.value);s.textContent='Copied.'}catch{s.textContent='Copy unavailable.'}};document.querySelector('#download').onclick=()=>{const blob=new Blob([b.value],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=(a.value.trim()||'nexauren-note')+'.txt';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);s.textContent='Downloaded.'};document.querySelector('#clear').onclick=()=>{if((a.value||b.value)&&!confirm('Clear this note?'))return;a.value='';b.value='';save();s.textContent='Note cleared.'};update()</script></body></html>
