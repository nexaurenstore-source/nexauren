<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notes — Nexauren</title><meta name="description" content="Capture ideas and keep notes organized in your browser."><link rel="stylesheet" href="/studios/audio/studio.css"><script src="/js/ads.js" defer></script>
</head><body><main class="as-page"><div class="as-wrap"><a class="as-crumb" href="/studios/productivity/">← Productivity Studio</a><section class="as-hero"><div class="as-hero-copy"><span class="as-kicker">NOTES</span><h1>Capture ideas.</h1><p>A simple private writing space with autosave in your browser.</p></div></section><section class="as-section"><input id="title" placeholder="Note title" style="width:100%;box-sizing:border-box;padding:14px;border-radius:12px"><textarea id="body" rows="18" placeholder="Start writing…" style="width:100%;box-sizing:border-box;margin-top:12px;padding:18px;border-radius:16px"></textarea><p id="s">Autosaved locally.</p></section></div></main><script>const a=document.querySelector('#title'),b=document.querySelector('#body');a.value=localStorage.nxNoteTitle||'';b.value=localStorage.nxNoteBody||'';function save(){localStorage.nxNoteTitle=a.value;localStorage.nxNoteBody=b.value}a.oninput=b.oninput=save</script></body></html>
