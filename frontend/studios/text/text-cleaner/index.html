<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Text Cleaner — Nexauren</title><meta name="description" content="Clean whitespace, invisible characters, duplicate lines and common text noise locally."><link rel="stylesheet" href="/studios/audio/studio.css"><link rel="stylesheet" href="/studios/text/text.css"><script src="/js/ads.js" defer></script>
</head>
<body><main class="as-page"><div class="as-wrap tx-shell"><a class="as-crumb" href="/tools/">← Tools</a><section class="as-hero"><div class="as-hero-copy"><span class="as-kicker">TEXT CLEANER</span><h1>Clean text.</h1><p>Remove unwanted whitespace, invisible characters and repeated noise without leaving your browser.</p></div></section><section class="as-section"><div class="tx-panel"><label class="tx-label" for="i"><span>Input</span><span id="meta">0 characters</span></label><textarea class="tx-input" id="i" aria-label="Text to clean" placeholder="Paste text…"></textarea><div class="tx-actions"><button type="button" class="tx-btn" onclick="clean()">Clean text</button><button type="button" class="tx-btn tx-btn-secondary" onclick="clean('aggressive')">Deep clean</button><button type="button" class="tx-btn tx-btn-secondary" onclick="copyIt()">Copy</button><button type="button" class="tx-btn tx-btn-secondary" onclick="downloadText()">Download .txt</button><button type="button" class="tx-btn tx-btn-secondary" onclick="resetIt()">Reset</button></div><p class="tx-status" id="s" role="status" aria-live="polite"></p><div class="tx-result" id="preview" aria-live="polite">Your cleaned text will appear here.</div></div></section></div></main><script>const i=document.querySelector('#i'),p=document.querySelector('#preview'),s=document.querySelector('#s'),meta=document.querySelector('#meta');let cleaned='';function update(){meta.textContent=i.value.length.toLocaleString()+' characters';p.textContent=cleaned||'Run Clean text to preview the result.'}function makeClean(mode){let v=i.value.replace(/[\u200B-\u200D\uFEFF]/g,'').replace(/\u00A0/g,' ').replace(/[ \t]+/g,' ').replace(/[ \t]+$/gm,'').replace(/^\s+|\s+$/gm,'').replace(/\n{3,}/g,'\n\n').trim();if(mode==='aggressive'){const seen=new Set();v=v.split('\n').filter(line=>{const k=line.trim();if(!k||seen.has(k))return false;seen.add(k);return true}).join('\n')}return v}function clean(mode){cleaned=makeClean(mode);i.value=cleaned;update();s.textContent=mode==='aggressive'?'Deep clean complete.':'Text cleaned locally.'}async function copyIt(){try{await navigator.clipboard.writeText(cleaned||i.value);s.textContent='Copied.'}catch(e){s.textContent='Copy is unavailable in this browser.'}}function downloadText(){const url=URL.createObjectURL(new Blob([cleaned||i.value],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='nexauren-cleaned.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);s.textContent='Downloaded.'}function resetIt(){i.value='';cleaned='';update();s.textContent='Reset.'}i.addEventListener('input',()=>{cleaned='';update()});update()</script></body></html>
