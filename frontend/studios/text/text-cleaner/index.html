<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Text Cleaner — Nexauren</title><meta name="description" content="Clean spaces, blank lines and common text noise locally."><link rel="stylesheet" href="/studios/audio/studio.css"></head><body><main class="as-page"><div class="as-wrap"><a class="as-crumb" href="/studios/text/">← Text Studio</a><section class="as-hero"><div class="as-hero-copy"><span class="as-kicker">TEXT CLEANER</span><h1>Clean text.</h1><p>Remove unwanted whitespace, blank lines and invisible noise from pasted content.</p></div></section><section class="as-section"><textarea id="i" rows="14" style="width:100%;box-sizing:border-box;padding:18px;border-radius:16px" placeholder="Paste text…"></textarea><div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px"><button onclick="clean()">Clean text</button><button onclick="copyIt()">Copy</button></div><p id="s"></p></section></div></main><script>const i=document.querySelector('#i');function clean(){i.value=i.value.replace(/\u00a0/g,' ').replace(/[ \t]+/g,' ').replace(/^\s+|\s+$/gm,'').replace(/\n{3,}/g,'\n\n').trim()}async function copyIt(){await navigator.clipboard.writeText(i.value);document.querySelector('#s').textContent='Copied.'}</script></body></html>
