<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Text Converter — Nexauren</title><meta name="description" content="Transform text with case, URL and Base64 conversion locally."><link rel="stylesheet" href="/studios/audio/studio.css"></head><body><main class="as-page"><div class="as-wrap"><a class="as-crumb" href="/studios/text/">← Text Studio</a><section class="as-hero"><div class="as-hero-copy"><span class="as-kicker">TEXT CONVERTER</span><h1>Transform text.</h1><p>Convert case, URL encoding and Base64 directly in your browser.</p></div></section><section class="as-section"><textarea id="i" rows="14" style="width:100%;box-sizing:border-box;padding:18px;border-radius:16px" placeholder="Enter text…"></textarea><div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px"><button onclick="run('upper')">UPPERCASE</button><button onclick="run('lower')">lowercase</button><button onclick="run('url')">URL encode</button><button onclick="run('url-d')">URL decode</button><button onclick="run('b64')">Base64 encode</button><button onclick="run('b64-d')">Base64 decode</button><button onclick="copyIt()">Copy</button></div><p id="s"></p></section></div></main><script>const i=document.querySelector('#i');function run(x){try{if(x==='upper')i.value=i.value.toUpperCase();else if(x==='lower')i.value=i.value.toLowerCase();else if(x==='url')i.value=encodeURIComponent(i.value);else if(x==='url-d')i.value=decodeURIComponent(i.value);else if(x==='b64')i.value=btoa(unescape(encodeURIComponent(i.value)));else if(x==='b64-d')i.value=decodeURIComponent(escape(atob(i.value)))}catch(e){document.querySelector('#s').textContent='Unable to convert this input.'}}async function copyIt(){await navigator.clipboard.writeText(i.value);document.querySelector('#s').textContent='Copied.'}</script></body></html>
