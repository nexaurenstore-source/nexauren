<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Text Converter — Nexauren</title><meta name="description" content="Transform text with case, URL, Base64, slug and HTML conversion locally."><link rel="stylesheet" href="/studios/audio/studio.css"><link rel="stylesheet" href="/studios/text/text.css"><script src="/js/ads.js" defer></script>
</head>
<body><main class="as-page"><div class="as-wrap tx-shell"><a class="as-crumb" href="/tools/">← Tools</a><section class="as-hero"><div class="as-hero-copy"><span class="as-kicker">TEXT CONVERTER</span><h1>Transform text.</h1><p>Convert text between common formats, encodings and naming styles directly in your browser.</p></div></section><section class="as-section"><div class="tx-panel"><label class="tx-label" for="i"><span>Text</span><span id="status">Ready</span></label><textarea class="tx-input" id="i" aria-label="Text to convert" placeholder="Enter text…"></textarea><div class="tx-actions"><button type="button" class="tx-btn" onclick="run('upper')">UPPERCASE</button><button type="button" class="tx-btn" onclick="run('lower')">lowercase</button><button type="button" class="tx-btn" onclick="run('title')">Title Case</button><button type="button" class="tx-btn tx-btn-secondary" onclick="run('url')">URL encode</button><button type="button" class="tx-btn tx-btn-secondary" onclick="run('url-d')">URL decode</button><button type="button" class="tx-btn tx-btn-secondary" onclick="run('b64')">Base64 encode</button><button type="button" class="tx-btn tx-btn-secondary" onclick="run('b64-d')">Base64 decode</button><button type="button" class="tx-btn tx-btn-secondary" onclick="run('slug')">Slug</button><button type="button" class="tx-btn tx-btn-secondary" onclick="run('html')">HTML escape</button><button type="button" class="tx-btn tx-btn-secondary" onclick="run('html-d')">HTML unescape</button><button type="button" class="tx-btn tx-btn-secondary" onclick="copyIt()">Copy</button><button type="button" class="tx-btn tx-btn-secondary" onclick="downloadText()">Download .txt</button><button type="button" class="tx-btn tx-btn-secondary" onclick="clearIt()">Clear</button></div><p class="tx-status" id="s" role="status" aria-live="polite"></p></div></section></div></main><script>const i=document.querySelector('#i'),s=document.querySelector('#s');const bytes=new TextEncoder(),decoder=new TextDecoder();function toB64(v){let bin='';for(const b of bytes.encode(v))bin+=String.fromCharCode(b);return btoa(bin)}function fromB64(v){const bin=atob(v),data=Uint8Array.from(bin,c=>c.charCodeAt(0));return decoder.decode(data)}function run(x){try{let v=i.value;if(x==='upper')v=v.toUpperCase();else if(x==='lower')v=v.toLowerCase();else if(x==='title')v=v.toLowerCase().replace(/\b([a-zÀ-ÿ])/gi,c=>c.toUpperCase());else if(x==='url')v=encodeURIComponent(v);else if(x==='url-d')v=decodeURIComponent(v);else if(x==='b64')v=toB64(v);else if(x==='b64-d')v=fromB64(v);else if(x==='slug')v=v.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');else if(x==='html')v=v.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');else if(x==='html-d'){const t=document.createElement('textarea');t.innerHTML=v;v=t.value}i.value=v;s.textContent='Converted locally.'}catch(e){s.textContent='Unable to convert this input. Check the selected format.'}}async function copyIt(){try{await navigator.clipboard.writeText(i.value);s.textContent='Copied.'}catch(e){s.textContent='Copy is unavailable in this browser.'}}function downloadText(){const url=URL.createObjectURL(new Blob([i.value],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='nexauren-converted.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);s.textContent='Downloaded.'}function clearIt(){i.value='';s.textContent='Cleared.'}</script></body></html>
