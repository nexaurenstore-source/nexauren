<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Text Diff — Nexauren</title><meta name="description" content="Compare two text versions and identify changes locally."><link rel="stylesheet" href="/studios/audio/studio.css"></head><body><main class="as-page"><div class="as-wrap"><a class="as-crumb" href="/studios/text/">← Text Studio</a><section class="as-hero"><div class="as-hero-copy"><span class="as-kicker">TEXT DIFF</span><h1>Compare text.</h1><p>Compare two versions line by line and see additions, removals and unchanged lines.</p></div></section><section class="as-section"><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px"><textarea id="a" rows="14" placeholder="Original text…" style="padding:18px;border-radius:16px"></textarea><textarea id="b" rows="14" placeholder="New text…" style="padding:18px;border-radius:16px"></textarea></div><button onclick="diff()" style="margin-top:14px">Compare</button><pre id="o" style="white-space:pre-wrap;margin-top:18px"></pre></section></div></main><script>function diff(){const a=document.querySelector('#a').value.split('\n'),b=document.querySelector('#b').value.split('\n'),n=Math.max(a.length,b.length);let out=[];for(let x=0;x<n;x++){if(a[x]===b[x])out.push('  '+(a[x]??''));else{if(a[x]!==undefined)out.push('- '+a[x]);if(b[x]!==undefined)out.push('+ '+b[x])}}document.querySelector('#o').textContent=out.join('\n')}</script></body></html>
