<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Text Diff — Nexauren</title><meta name="description" content="Compare two text versions with line changes and practical comparison controls locally."><link rel="stylesheet" href="/studios/audio/studio.css"><link rel="stylesheet" href="/studios/text/text.css"><script src="/js/ads.js" defer></script>
</head>
<body><main class="as-page"><div class="as-wrap tx-shell"><a class="as-crumb" href="/tools/">← Tools</a><section class="as-hero"><div class="as-hero-copy"><span class="as-kicker">TEXT DIFF</span><h1>Compare text.</h1><p>Compare versions line by line, inspect changes and copy the result without uploading your content.</p></div></section><section class="as-section"><div class="tx-panel"><div class="tx-grid"><div><label class="tx-label" for="a">Original</label><textarea class="tx-input" id="a" aria-label="Original text" placeholder="Original text…"></textarea></div><div><label class="tx-label" for="b">New version</label><textarea class="tx-input" id="b" aria-label="New version text" placeholder="New text…"></textarea></div></div><div class="tx-tools"><label class="tx-check"><input type="checkbox" id="ignoreSpace"> Ignore whitespace</label><label class="tx-check"><input type="checkbox" id="ignoreCase"> Ignore case</label></div><div class="tx-actions"><button type="button" class="tx-btn" onclick="diff()">Compare</button><button type="button" class="tx-btn tx-btn-secondary" onclick="copyResult()">Copy result</button><button type="button" class="tx-btn tx-btn-secondary" onclick="downloadResult()">Download result</button><button type="button" class="tx-btn tx-btn-secondary" onclick="swapText()">Swap</button><button type="button" class="tx-btn tx-btn-secondary" onclick="resetIt()">Reset</button></div><p class="tx-status" id="s" role="status" aria-live="polite"></p><pre class="tx-result tx-highlight" id="o">Your comparison will appear here.</pre></div></section></div></main><script>const A=document.querySelector('#a'),B=document.querySelector('#b'),O=document.querySelector('#o'),S=document.querySelector('#s');function key(v){if(document.querySelector('#ignoreSpace').checked)v=v.replace(/\s+/g,' ');if(document.querySelector('#ignoreCase').checked)v=v.toLowerCase();return v}function esc(v){return v.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function diff(){const a=A.value.split('\n'),b=B.value.split('\n'),n=Math.max(a.length,b.length);let out=[],add=0,remove=0,changed=0;for(let x=0;x<n;x++){const av=a[x],bv=b[x];if(av!==undefined&&bv!==undefined&&key(av)===key(bv))out.push('  '+esc(av));else{if(av!==undefined){out.push('<span class="tx-diff-removed">− '+esc(av)+'</span>');remove++}if(bv!==undefined){out.push('<span class="tx-diff-added">+ '+esc(bv)+'</span>');add++}if(av!==undefined&&bv!==undefined)changed++}}O.innerHTML=out.join('\n')||'No content to compare.';S.textContent=`${add} added · ${remove} removed · ${changed} changed line(s)`}async function copyResult(){try{await navigator.clipboard.writeText(O.innerText);S.textContent='Comparison copied.'}catch(e){S.textContent='Copy is unavailable in this browser.'}}function downloadResult(){const url=URL.createObjectURL(new Blob([O.innerText],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='nexauren-text-diff.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);S.textContent='Comparison downloaded.'}function swapText(){const v=A.value;A.value=B.value;B.value=v;diff();S.textContent='Texts swapped and compared.'}function resetIt(){A.value='';B.value='';O.textContent='Your comparison will appear here.';S.textContent='Reset.'}</script></body></html>
