<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Text Formatter — Nexauren</title><meta name="description" content="Format, normalize and transform text locally in your browser."><link rel="stylesheet" href="/studios/audio/studio.css"><link rel="stylesheet" href="/studios/text/text.css"><script src="/js/ads.js" defer></script>
</head>
<body><main class="as-page"><div class="as-wrap tx-shell"><a class="as-crumb" href="/studios/text/">← Text Studio</a><section class="as-hero"><div class="as-hero-copy"><span class="as-kicker">TEXT FORMATTER</span><h1>Format text.</h1><p>Turn messy text into clean, consistent content with practical one-click transformations.</p></div></section><section class="as-section"><div class="tx-panel"><label class="tx-label" for="input"><span>Text</span><span id="count">0 characters</span></label><textarea class="tx-input" id="input" placeholder="Paste or type text…"></textarea><div class="tx-actions"><button class="tx-btn" onclick="fmt('upper')">UPPERCASE</button><button class="tx-btn" onclick="fmt('lower')">lowercase</button><button class="tx-btn" onclick="fmt('title')">Title Case</button><button class="tx-btn" onclick="fmt('sentence')">Sentence case</button><button class="tx-btn tx-btn-secondary" onclick="fmt('trim')">Normalize spaces</button><button class="tx-btn tx-btn-secondary" onclick="fmt('lines')">Trim lines</button><button class="tx-btn tx-btn-secondary" onclick="fmt('sort')">Sort lines</button><button class="tx-btn tx-btn-secondary" onclick="fmt('unique')">Remove duplicates</button><button class="tx-btn tx-btn-secondary" onclick="copyText()">Copy</button><button class="tx-btn tx-btn-secondary" onclick="downloadText()">Download .txt</button></div><p class="tx-status" id="status" aria-live="polite"></p></div></section></div></main><script>const i=document.querySelector('#input'),count=document.querySelector('#count'),status=document.querySelector('#status');function update(){count.textContent=i.value.length.toLocaleString()+' characters'}function fmt(x){let v=i.value;if(x==='upper')v=v.toUpperCase();if(x==='lower')v=v.toLowerCase();if(x==='title')v=v.toLowerCase().replace(/\b([a-zÀ-ÿ])/gi,c=>c.toUpperCase());if(x==='sentence')v=v.toLowerCase().replace(/(^|[.!?]\s+)([a-zà-ÿ])/g,(m,a,c)=>a+c.toUpperCase());if(x==='trim')v=v.replace(/[ \t]+/g,' ').replace(/\n{3,}/g,'\n\n').trim();if(x==='lines')v=v.split('\n').map(x=>x.trim()).join('\n');if(x==='sort')v=v.split('\n').sort((a,b)=>a.localeCompare(b,undefined,{sensitivity:'base'})).join('\n');if(x==='unique'){const seen=new Set();v=v.split('\n').filter(line=>{const k=line.trim();if(!k||seen.has(k))return false;seen.add(k);return true}).join('\n')}i.value=v;update();status.textContent='Formatted locally.'}async function copyText(){await navigator.clipboard.writeText(i.value);status.textContent='Copied.'}function downloadText(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([i.value],{type:'text/plain;charset=utf-8'}));a.download='nexauren-formatted.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);status.textContent='Downloaded.'}i.addEventListener('input',update);update()</script></body></html>
