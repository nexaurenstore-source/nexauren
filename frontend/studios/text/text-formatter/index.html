<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Text Formatter — Nexauren</title><meta name="description" content="Format text with case, whitespace and line controls locally in your browser."><link rel="stylesheet" href="/studios/audio/studio.css"></head><body><main class="as-page"><div class="as-wrap"><a class="as-crumb" href="/studios/text/">← Text Studio</a><section class="as-hero"><div class="as-hero-copy"><span class="as-kicker">TEXT FORMATTER</span><h1>Format text.</h1><p>Clean presentation, change case and normalize whitespace instantly.</p></div></section><section class="as-section"><textarea id="input" rows="14" placeholder="Paste or type text…" style="width:100%;box-sizing:border-box;padding:18px;border-radius:16px"></textarea><div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px"><button onclick="fmt('upper')">UPPERCASE</button><button onclick="fmt('lower')">lowercase</button><button onclick="fmt('title')">Title Case</button><button onclick="fmt('trim')">Normalize spaces</button><button onclick="fmt('lines')">Trim lines</button><button onclick="copyText()">Copy</button></div><p id="status"></p></section></div></main><script>const i=document.querySelector('#input');function fmt(x){let v=i.value;if(x==='upper')v=v.toUpperCase();if(x==='lower')v=v.toLowerCase();if(x==='title')v=v.toLowerCase().replace(/\b\w/g,c=>c.toUpperCase());if(x==='trim')v=v.replace(/[ \t]+/g,' ').replace(/\n{3,}/g,'\n\n').trim();if(x==='lines')v=v.split('\n').map(x=>x.trim()).join('\n');i.value=v}async function copyText(){await navigator.clipboard.writeText(i.value);document.querySelector('#status').textContent='Copied.'}</script></body></html>
