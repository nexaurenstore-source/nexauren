<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Text Counter — Nexauren</title><meta name="description" content="Count characters, words, lines, sentences, paragraphs and reading time locally."><link rel="stylesheet" href="/studios/audio/studio.css"><link rel="stylesheet" href="/studios/text/text.css"><script src="/js/ads.js" defer></script>
</head>
<body><main class="as-page"><div class="as-wrap tx-shell"><a class="as-crumb" href="/tools/">← Tools</a><section class="as-hero"><div class="as-hero-copy"><span class="as-kicker">TEXT COUNTER</span><h1>Measure text.</h1><p>Understand your content at a glance with live writing and readability statistics.</p></div></section><section class="as-section"><div class="tx-panel"><label class="tx-label" for="i"><span>Text</span><span id="status">Live</span></label><textarea class="tx-input" id="i" aria-label="Text to analyze" placeholder="Type or paste text…"></textarea><div class="tx-stats" id="stats" aria-live="polite"></div><div class="tx-actions"><button type="button" class="tx-btn tx-btn-secondary" onclick="copyReport()">Copy report</button><button type="button" class="tx-btn tx-btn-secondary" onclick="downloadReport()">Download report</button><button type="button" class="tx-btn tx-btn-secondary" onclick="clearText()">Reset</button></div></div></section></div></main><script>const i=document.querySelector('#i'),s=document.querySelector('#stats'),status=document.querySelector('#status');function getStats(){const v=i.value,words=v.trim()?v.trim().split(/\s+/).length:0,lines=v?v.split(/\n/).length:0,sent=(v.match(/[.!?]+(?=\s|$)/g)||[]).length,paras=v.trim()?v.trim().split(/\n\s*\n/).length:0,charsNoSpace=v.replace(/\s/g,'').length,reading=words?Math.max(1,Math.ceil(words/200)):0;return [['Characters',v.length],['No spaces',charsNoSpace],['Words',words],['Lines',lines],['Sentences',sent],['Paragraphs',paras],['Reading time',reading+' min']]}function update(){const items=getStats();s.innerHTML=items.map(x=>`<div class="tx-stat"><strong>${x[1]}</strong><small>${x[0]}</small></div>`).join('');status.textContent=(i.value.trim()?items[2][1].toLocaleString()+' words':'Live')}async function copyReport(){try{await navigator.clipboard.writeText(getStats().map(x=>x[0]+': '+x[1]).join('\n'));status.textContent='Report copied.'}catch(e){status.textContent='Copy is unavailable in this browser.'}}function downloadReport(){const url=URL.createObjectURL(new Blob([getStats().map(x=>x[0]+': '+x[1]).join('\n')],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='nexauren-text-report.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);status.textContent='Report downloaded.'}function clearText(){i.value='';update();status.textContent='Reset.'}i.addEventListener('input',update);update()</script></body></html>
