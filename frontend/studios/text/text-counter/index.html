<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Text Counter — Nexauren</title><meta name="description" content="Count words, characters, lines and paragraphs instantly."><link rel="stylesheet" href="/studios/audio/studio.css"></head><body><main class="as-page"><div class="as-wrap"><a class="as-crumb" href="/studios/text/">← Text Studio</a><section class="as-hero"><div class="as-hero-copy"><span class="as-kicker">TEXT COUNTER</span><h1>Measure text.</h1><p>Live statistics for words, characters, lines, sentences and paragraphs.</p></div></section><section class="as-section"><textarea id="i" rows="14" style="width:100%;box-sizing:border-box;padding:18px;border-radius:16px" placeholder="Type or paste text…"></textarea><div id="stats" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-top:16px"></div></section></div></main><script>const i=document.querySelector('#i'),s=document.querySelector('#stats');function update(){const v=i.value,words=v.trim()?v.trim().split(/\s+/).length:0,lines=v?v.split(/\n/).length:0,sent=(v.match(/[.!?]+(?=\s|$)/g)||[]).length,paras=v.trim()?(v.trim().split(/\n\s*\n/).length):0;s.innerHTML=[['Characters',v.length],['Characters no spaces',v.replace(/\s/g,'').length],['Words',words],['Lines',lines],['Sentences',sent],['Paragraphs',paras]].map(x=>`<div style="padding:18px;border:1px solid currentColor;border-radius:16px"><strong style="font-size:1.6rem">${x[1]}</strong><br><small>${x[0]}</small></div>`).join('')}i.addEventListener('input',update);update()</script></body></html>
