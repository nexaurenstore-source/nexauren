<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Image Editor — Nexauren</title><link rel="stylesheet" href="../image-tool.css"></head><body><main><a class="crumb" href="/studios/image/">← Image Studio</a><section class="hero"><span class="kicker">Image Experience</span><h1>Image Editor.</h1><p>Adjust brightness, contrast, saturation, grayscale and rotation, then export a polished image locally.</p></section><section class="workspace"><div class="drop"><label class="pick" for="file">Choose image</label><input id="file" type="file" accept="image/*"></div><img id="preview" class="preview" hidden><div class="controls"><div class="control"><label for="brightness">Brightness: <span id="bv">100</span>%</label><input id="brightness" type="range" min="50" max="150" value="100"></div><div class="control"><label for="contrast">Contrast: <span id="cv">100</span>%</label><input id="contrast" type="range" min="50" max="150" value="100"></div><div class="control"><label for="saturation">Saturation: <span id="sv">100</span>%</label><input id="saturation" type="range" min="0" max="200" value="100"></div><div class="control"><label for="rotation">Rotation</label><select id="rotation"><option value="0">0°</option><option value="90">90°</option><option value="180">180°</option><option value="270">270°</option></select></div><div class="control"><label><input id="gray" type="checkbox"> Grayscale</label></div></div><div class="actions"><button class="btn primary" id="run">Export edited image</button><button class="btn secondary" id="reset">Reset</button></div><p class="status" id="status">Choose an image to begin.</p><div class="note">Adjustments are rendered through the browser Canvas API; your source file stays local.</div></section></main><script src="../image-tool.js"></script><script>NexaurenImage.setup({run:async({img,download,$,status})=>{const r=+$('rotation').value,swap=r%180!==0,w=swap?img.naturalHeight:img.naturalWidth,h=swap?img.naturalWidth:img.naturalHeight,c=NexaurenImage.canvas(w,h),x=c.getContext('2d');x.filter=`brightness(${$('brightness').value}%) contrast(${$('contrast').value}%) saturate(${$('saturation').value}%) grayscale(${$('gray').checked?100:0}%)`;x.translate(w/2,h/2);x.rotate(r*Math.PI/180);x.drawImage(img,-img.naturalWidth/2,-img.naturalHeight/2);const b=await NexaurenImage.render(c,'image/png',1);download(b,'nexauren-edited.png');status.textContent=`Done · ${w} × ${h}px · ${(b.size/1024).toFixed(1)} KB`}});['brightness','contrast','saturation'].forEach((id,i)=>$(id).oninput=e=>$([ 'bv','cv','sv'][i]).textContent=e.target.value)</script></body></html>
