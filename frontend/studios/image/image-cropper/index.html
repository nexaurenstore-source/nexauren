<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Image Cropper — Nexauren</title><link rel="stylesheet" href="../image-tool.css"></head><body><main><a class="crumb" href="/studios/image/">← Image Studio</a><section class="hero"><span class="kicker">Image Experience</span><h1>Image Cropper.</h1><p>Crop an image precisely using pixel coordinates and export the result as PNG.</p></section><section class="workspace"><div class="drop"><label class="pick" for="file">Choose image</label><input id="file" type="file" accept="image/*"></div><img id="preview" class="preview" hidden><div class="controls"><div class="control"><label for="x">X</label><input id="x" type="number" min="0" value="0"></div><div class="control"><label for="y">Y</label><input id="y" type="number" min="0" value="0"></div><div class="control"><label for="width">Width</label><input id="width" type="number" min="1" placeholder="Auto"></div><div class="control"><label for="height">Height</label><input id="height" type="number" min="1" placeholder="Auto"></div></div><div class="actions"><button class="btn primary" id="run">Crop image</button><button class="btn secondary" id="reset">Reset</button></div><p class="status" id="status">Choose an image to begin.</p></section></main><script src="../image-tool.js"></script><script>NexaurenImage.setup({run:async({img,download,$,status})=>{const sx=Math.max(0,+$('x').value||0),sy=Math.max(0,+$('y').value||0),w=Math.min(img.naturalWidth-sx,+$('width').value||img.naturalWidth-sx),h=Math.min(img.naturalHeight-sy,+$('height').value||img.naturalHeight-sy);if(w<1||h<1)throw Error('Crop area is outside the image.');const c=NexaurenImage.canvas(w,h),x=c.getContext('2d');x.drawImage(img,sx,sy,w,h,0,0,w,h);download(await NexaurenImage.render(c,'image/png',1),'nexauren-cropped.png');status.textContent=`Done · ${w} × ${h}px`}})</script></body></html>
