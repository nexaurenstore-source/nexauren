<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Image Resizer — Nexauren</title><link rel="stylesheet" href="../image-tool.css"></head><body><main><a class="crumb" href="/studios/image/">← Image Studio</a><section class="hero"><span class="kicker">Image Experience</span><h1>Image Resizer.</h1><p>Set exact dimensions or scale an image by percentage while keeping the workflow simple.</p></section><section class="workspace"><div class="drop"><label class="pick" for="file">Choose image</label><input id="file" type="file" accept="image/*"></div><img id="preview" class="preview" hidden><div class="controls"><div class="control"><label for="width">Width (px)</label><input id="width" type="number" min="1" placeholder="Auto"></div><div class="control"><label for="height">Height (px)</label><input id="height" type="number" min="1" placeholder="Auto"></div><div class="control"><label for="scale">Scale</label><select id="scale"><option value="1">100%</option><option value="0.75">75%</option><option value="0.5">50%</option><option value="0.25">25%</option></select></div></div><div class="actions"><button class="btn primary" id="run">Resize image</button><button class="btn secondary" id="reset">Reset</button></div><p class="status" id="status">Choose an image to begin.</p></section></main><script src="../image-tool.js"></script><script>NexaurenImage.setup({run:async({img,download,$,status})=>{const s=+$('scale').value,w=+$('width').value||Math.round(img.naturalWidth*s),h=+$('height').value||Math.round(img.naturalHeight*s),c=NexaurenImage.canvas(w,h),x=c.getContext('2d');x.drawImage(img,0,0,w,h);const b=await NexaurenImage.render(c,'image/png',1);download(b,'nexauren-resized.png');status.textContent=`Done · ${w} × ${h}px`}})</script></body></html>
