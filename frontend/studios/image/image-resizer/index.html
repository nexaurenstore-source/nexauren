<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Image Resizer — Nexauren</title><link rel="stylesheet" href="../image-tool.css"></head><body><main><a class="crumb" href="/studios/image/">← Image Studio</a><section class="hero"><span class="kicker">Image Experience</span><h1>Image Resizer.</h1><p>Resize precisely with locked proportions, preset scales and a live dimension workflow.</p></section><section class="workspace"><div class="drop"><label class="pick" for="file">Choose image</label><input id="file" type="file" accept="image/*"></div><img id="preview" class="preview" hidden><div class="controls"><div class="control"><label for="width">Width (px)</label><input id="width" type="number" min="1" placeholder="Original"></div><div class="control"><label for="height">Height (px)</label><input id="height" type="number" min="1" placeholder="Original"></div><div class="control"><label for="scale">Scale preset</label><select id="scale"><option value="1">100%</option><option value="0.75">75%</option><option value="0.5">50%</option><option value="0.25">25%</option></select></div><div class="control"><label><input id="lock" type="checkbox" checked> Keep aspect ratio</label></div></div><div class="actions"><button class="btn primary" id="run">Resize image</button><button class="btn secondary" id="reset">Reset</button></div><p class="status" id="status">Choose an image to begin.</p><div class="note">If only one dimension is supplied, the other is calculated automatically when aspect ratio is locked.</div></section></main><script src="../image-tool.js"></script><script>NexaurenImage.setup({run:async({img,download,$,status})=>{let w=+$('width').value||0,h=+$('height').value||0,s=+$('scale').value||1;if($('lock').checked){if(w&&!h)h=Math.round(w*img.naturalHeight/img.naturalWidth);else if(h&&!w)w=Math.round(h*img.naturalWidth/img.naturalHeight);else if(!w&&!h){w=Math.round(img.naturalWidth*s);h=Math.round(img.naturalHeight*s)}}else{w=w||Math.round(img.naturalWidth*s);h=h||Math.round(img.naturalHeight*s)}if(w<1||h<1)throw Error('Enter valid dimensions.');const c=NexaurenImage.canvas(w,h),x=c.getContext('2d');x.drawImage(img,0,0,w,h);const b=await NexaurenImage.render(c,'image/png',1);download(b,'nexauren-resized.png');status.textContent=`Done · ${w} × ${h}px · ${(b.size/1024).toFixed(1)} KB`}})</script></body></html>
