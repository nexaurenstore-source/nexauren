<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Image Converter — Nexauren</title><link rel="stylesheet" href="../image-tool.css"></head><body><main><a class="crumb" href="/studios/image/">← Image Studio</a><section class="hero"><span class="kicker">Image Experience</span><h1>Image Converter.</h1><p>Convert images between PNG, JPEG and WebP locally, with format, quality and optional size controls.</p></section><section class="workspace"><div class="drop"><label class="pick" for="file">Choose image</label><input id="file" type="file" accept="image/*"></div><img id="preview" class="preview" hidden><div class="controls"><div class="control"><label for="format">Output format</label><select id="format"><option value="image/webp">WebP</option><option value="image/jpeg">JPEG</option><option value="image/png">PNG</option></select></div><div class="control"><label for="quality">Quality: <span id="qv">90</span>%</label><input id="quality" type="range" min="40" max="100" step="5" value="90"></div><div class="control"><label for="maxWidth">Max width (optional)</label><input id="maxWidth" type="number" min="1" placeholder="Original"></div><div class="control"><label for="maxHeight">Max height (optional)</label><input id="maxHeight" type="number" min="1" placeholder="Original"></div></div><div class="actions"><button class="btn primary" id="run">Convert image</button><button class="btn secondary" id="reset">Reset</button></div><p class="status" id="status">Choose an image to begin.</p><div class="note">Processing is performed locally in your browser. JPEG output uses a white background when the source has transparency.</div></section></main><script src="../image-tool.js"></script><script>NexaurenImage.setup({run:async({img,download,$,status})=>{const mw=+$('maxWidth').value||img.naturalWidth,mh=+$('maxHeight').value||img.naturalHeight,scale=Math.min(1,mw/img.naturalWidth,mh/img.naturalHeight),w=Math.max(1,Math.round(img.naturalWidth*scale)),h=Math.max(1,Math.round(img.naturalHeight*scale)),c=NexaurenImage.canvas(w,h),x=c.getContext('2d'),type=$('format').value;x.fillStyle='#fff';if(type==='image/jpeg')x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);const b=await NexaurenImage.render(c,type,+$('quality').value/100);download(b,`nexauren-converted.${type.split('/')[1].replace('jpeg','jpg')}`);status.textContent=`Done · ${w} × ${h}px · ${(b.size/1024).toFixed(1)} KB`}});$('quality').oninput=e=>$('qv').textContent=e.target.value</script></body></html>
