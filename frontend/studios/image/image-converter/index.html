<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Image Converter — Nexauren</title><link rel="stylesheet" href="../image-tool.css"></head><body><main><a class="crumb" href="/studios/image/">← Image Studio</a><section class="hero"><span class="kicker">Image Experience</span><h1>Image Converter.</h1><p>Convert images between PNG, JPEG and WebP locally with a live preview.</p></section><section class="workspace"><div class="drop"><label class="pick" for="file">Choose image</label><input id="file" type="file" accept="image/*"></div><img id="preview" class="preview" hidden><div class="controls"><div class="control"><label for="format">Output format</label><select id="format"><option value="image/webp">WebP</option><option value="image/jpeg">JPEG</option><option value="image/png">PNG</option></select></div><div class="control"><label for="quality">Quality</label><input id="quality" type="range" min="0.5" max="1" step="0.05" value="0.9"></div></div><div class="actions"><button class="btn primary" id="run">Convert image</button><button class="btn secondary" id="reset">Reset</button></div><p class="status" id="status">Choose an image to begin.</p><div class="note">Processing is performed locally in your browser.</div></section></main><script src="../image-tool.js"></script><script>NexaurenImage.setup({run:async({img,download,$,status})=>{const c=NexaurenImage.canvas(img.naturalWidth,img.naturalHeight),x=c.getContext('2d');x.drawImage(img,0,0);const type=$('format').value,b=await NexaurenImage.render(c,type,+$('quality').value);download(b,`nexauren-image.${type.split('/')[1].replace('jpeg','jpg')}`);status.textContent=`Done · ${(b.size/1024).toFixed(1)} KB`}})</script></body></html>
