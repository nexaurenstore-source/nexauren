<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Image Compressor — Nexauren</title><link rel="stylesheet" href="../image-tool.css"></head><body><main><a class="crumb" href="/studios/image/">← Image Studio</a><section class="hero"><span class="kicker">Image Experience</span><h1>Image Compressor.</h1><p>Reduce image size with adjustable quality, output format and a clear before-and-after result.</p></section><section class="workspace"><div class="drop"><label class="pick" for="file">Choose image</label><input id="file" type="file" accept="image/*"></div><img id="preview" class="preview" hidden><div class="controls"><div class="control"><label for="quality">Quality: <span id="qv">80</span>%</label><input id="quality" type="range" min="20" max="100" value="80"></div><div class="control"><label for="format">Output</label><select id="format"><option value="image/webp">WebP</option><option value="image/jpeg">JPEG</option></select></div></div><div class="actions"><button class="btn primary" id="run">Compress image</button><button class="btn secondary" id="reset">Reset</button></div><p class="status" id="status">Choose an image to begin.</p><div class="note">Compression is local. The result reports original size, output size and estimated reduction.</div></section></main><script src="../image-tool.js"></script><script>NexaurenImage.setup({run:async({img,download,$,status,file})=>{const c=NexaurenImage.canvas(img.naturalWidth,img.naturalHeight),x=c.getContext('2d'),type=$('format').value;x.fillStyle='#fff';if(type==='image/jpeg')x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0);const b=await NexaurenImage.render(c,type,+$('quality').value/100),reduction=Math.max(0,100-b.size/file.size*100);download(b,`nexauren-compressed.${type==='image/jpeg'?'jpg':'webp'}`);status.textContent=`${(file.size/1024).toFixed(1)} KB → ${(b.size/1024).toFixed(1)} KB · ${reduction.toFixed(0)}% smaller`}});$('quality').oninput=e=>$('qv').textContent=e.target.value</script></body></html>
