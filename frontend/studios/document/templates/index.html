<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Document Templates — Nexauren</title><meta name="description" content="Start faster with professional templates for books, business documents, letters, reports, resumes, academic work and more."><link rel="canonical" href="https://nexaurenstory.com/studios/document/templates/"><link rel="stylesheet" href="/css/style.css"><script src="/js/ads.js" defer></script><style>:root{--bg:#f3f5f9;--ink:#172033;--muted:#667085;--line:#dfe4ec;--accent:#4f46e5}body{margin:0;background:var(--bg);color:var(--ink)}.tpl-wrap{max-width:1180px;margin:auto;padding:34px 22px 90px}.tpl-back{color:var(--muted);text-decoration:none;font-size:14px}.tpl-hero{padding:58px 0 42px}.tpl-kicker{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}h1{font-size:clamp(48px,8vw,82px);letter-spacing:-.055em;line-height:.95;margin:14px 0 20px} .tpl-hero p{max-width:720px;color:var(--muted);font-size:19px;line-height:1.6;margin:0}.tpl-tools{display:flex;gap:8px;flex-wrap:wrap;margin:28px 0}.tpl-filter{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;cursor:pointer;color:var(--ink)}.tpl-filter.active{background:var(--accent);border-color:var(--accent);color:#fff}.tpl-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.tpl-card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 12px 35px rgba(30,40,65,.05);display:flex;flex-direction:column;min-height:190px}.tpl-icon{width:46px;height:46px;border-radius:14px;background:#eef0ff;display:grid;place-items:center;color:var(--accent);font-size:21px}.tpl-card h2{font-size:22px;margin:18px 0 7px}.tpl-card p{color:var(--muted);line-height:1.5;margin:0 0 18px}.tpl-card button{margin-top:auto;border:0;border-radius:10px;padding:10px 14px;background:#172033;color:#fff;cursor:pointer;font-weight:700}.tpl-card button:hover{background:var(--accent)}.ad-space{height:112px;background:#fff}@media(max-width:700px){.tpl-wrap{padding:24px 18px 60px}.tpl-hero{padding:44px 0 30px}.tpl-hero p{font-size:17px}.ad-space{height:92px}}</style></head><body><div class="ad-space" aria-hidden="true"></div><main class="tpl-wrap"><a class="tpl-back" href="/studios/document/">← Document Studio</a><header class="tpl-hero"><span class="tpl-kicker">Document Studio</span><h1>Start with a template.</h1><p>Professional starting points for authors, entrepreneurs, students, teams and everyday writing. Choose one, customize everything, then export your finished document as PDF.</p></header><div class="tpl-tools" id="filters"></div><section class="tpl-grid" id="grid" aria-label="Document templates"></section></main><script>const templates=[
{id:'book',cat:'Authors',icon:'▤',name:'Book Manuscript',desc:'A clean manuscript structure for novels, nonfiction and long-form books.',html:'<h1>Book Title</h1><p><em>Author Name</em></p><h2>Chapter One</h2><p>Begin your story here. Use headings, paragraphs, quotations and images to shape your manuscript.</p><h2>Chapter Two</h2><p>Continue your manuscript with your own voice and structure.</p>'},
{id:'business-plan',cat:'Business',icon:'◆',name:'Business Plan',desc:'Executive summary, market, strategy, operations and financial sections.',html:'<h1>Business Plan</h1><p><strong>Company:</strong> Your Company</p><h2>Executive Summary</h2><p>Describe the business, opportunity and goals.</p><h2>Market & Strategy</h2><p>Define your customers, positioning and growth strategy.</p><h2>Operations</h2><p>Explain how the business will operate.</p><h2>Financial Overview</h2><p>Summarize revenue, costs and projections.</p>'},
{id:'letter',cat:'Letters',icon:'✉',name:'Professional Letter',desc:'A polished structure for formal, personal or business correspondence.',html:'<h1>Letter Title</h1><p>Date: __________________</p><p>Dear __________________,</p><p>Write your message here. Keep your paragraphs clear, purposeful and easy to read.</p><p>Sincerely,<br>Your Name</p>'},
{id:'resume',cat:'Career',icon:'◈',name:'Resume / CV',desc:'A focused CV layout for experience, education, skills and achievements.',html:'<h1>Your Name</h1><p>Professional title · email · phone · location</p><h2>Profile</h2><p>Write a concise professional summary.</p><h2>Experience</h2><h3>Job Title — Company</h3><p>Describe responsibilities and measurable achievements.</p><h2>Education</h2><p>Degree — Institution</p><h2>Skills</h2><p>Skill · Skill · Skill · Skill</p>'},
{id:'report',cat:'Work',icon:'▥',name:'Professional Report',desc:'Structured report with findings, analysis, recommendations and conclusion.',html:'<h1>Professional Report</h1><p>Prepared by: Your Name · Date</p><h2>Executive Summary</h2><p>Summarize the most important findings.</p><h2>Background</h2><p>Provide context and objectives.</p><h2>Findings</h2><p>Present evidence, data and observations.</p><h2>Recommendations</h2><p>List practical next steps.</p><h2>Conclusion</h2><p>Close with the main takeaway.</p>'},
{id:'academic',cat:'Academic',icon:'A',name:'Academic Paper',desc:'Title, abstract, sections, references and academic writing structure.',html:'<h1>Research Paper Title</h1><p><strong>Author Name</strong><br>Institution · Date</p><h2>Abstract</h2><p>Summarize the research question, method and key result.</p><h2>Introduction</h2><p>Introduce the topic and research question.</p><h2>Methodology</h2><p>Describe the method.</p><h2>Results</h2><p>Present the results.</p><h2>Conclusion</h2><p>Discuss implications and future work.</p><h2>References</h2><p>Author. Title. Publication.</p>'},
{id:'proposal',cat:'Business',icon:'✦',name:'Project Proposal',desc:'A persuasive proposal for clients, partners, projects and funding.',html:'<h1>Project Proposal</h1><p>Prepared for: Client / Organization</p><h2>Overview</h2><p>Describe the proposed project and its value.</p><h2>Objectives</h2><ul><li>Objective one</li><li>Objective two</li><li>Objective three</li></ul><h2>Scope & Deliverables</h2><p>Describe what will be delivered.</p><h2>Timeline & Budget</h2><p>Outline milestones and estimated costs.</p>'},
{id:'meeting',cat:'Work',icon:'✓',name:'Meeting Notes',desc:'Agenda, decisions, action items, owners and follow-ups.',html:'<h1>Meeting Notes</h1><p><strong>Date:</strong> ______ · <strong>Attendees:</strong> ______</p><h2>Agenda</h2><ol><li>Topic one</li><li>Topic two</li></ol><h2>Discussion</h2><p>Record the important points.</p><h2>Decisions</h2><p>Document decisions made.</p><h2>Action Items</h2><ul><li>Action — Owner — Due date</li></ul>'},
{id:'essay',cat:'Academic',icon:'✎',name:'Essay',desc:'A flexible essay structure for school, university and general writing.',html:'<h1>Essay Title</h1><p><strong>Author:</strong> Your Name</p><h2>Introduction</h2><p>Introduce the topic and thesis.</p><h2>Argument One</h2><p>Develop your first argument with evidence.</p><h2>Argument Two</h2><p>Develop your second argument.</p><h2>Conclusion</h2><p>Summarize the argument and final insight.</p>'},
{id:'invoice',cat:'Business',icon:'▣',name:'Business Invoice',desc:'Simple invoice document with client details, items, totals and notes.',html:'<h1>INVOICE</h1><p><strong>Your Business</strong><br>Address · Email · Phone</p><h2>Bill To</h2><p>Client Name<br>Client Address</p><table class="dc-table"><tbody><tr><td>Item</td><td>Qty</td><td>Price</td><td>Total</td></tr><tr><td>Service</td><td>1</td><td>€0.00</td><td>€0.00</td></tr></tbody></table><h2>Total: €0.00</h2><p>Payment terms and notes.</p>'},
{id:'screenplay',cat:'Authors',icon:'▤',name:'Screenplay',desc:'A clean starting structure for scenes, dialogue and screenplay drafts.',html:'<h1>SCREENPLAY TITLE</h1><p><em>Written by Your Name</em></p><h2>FADE IN:</h2><p><strong>INT. LOCATION — DAY</strong></p><p>Describe the scene and action here.</p><p><strong>CHARACTER</strong><br>Dialogue begins here.</p>'},
{id:'newsletter',cat:'Publishing',icon:'✦',name:'Newsletter',desc:'A readable structure for newsletters, announcements and editorial updates.',html:'<h1>Newsletter Title</h1><p><em>Issue · Date</em></p><h2>Lead Story</h2><p>Write your main update here.</p><h2>What’s New</h2><ul><li>Update one</li><li>Update two</li></ul><h2>Next Steps</h2><p>Tell readers what comes next.</p>'}
];
const grid=document.getElementById('grid'),filters=document.getElementById('filters');const cats=['All',...new Set(templates.map(t=>t.cat))];let active='All';function renderFilters(){filters.innerHTML=cats.map(c=>`<button class="tpl-filter ${c===active?'active':''}" data-cat="${c}">${c}</button>`).join('');filters.querySelectorAll('button').forEach(b=>b.onclick=()=>{active=b.dataset.cat;renderFilters();render();});}function render(){grid.innerHTML=templates.filter(t=>active==='All'||t.cat===active).map(t=>`<article class="tpl-card"><div class="tpl-icon">${t.icon}</div><h2>${t.name}</h2><p>${t.desc}</p><button data-id="${t.id}">Use template →</button></article>`).join('');grid.querySelectorAll('button').forEach(b=>b.onclick=()=>{const t=templates.find(x=>x.id===b.dataset.id);localStorage.setItem('nexauren-document-creator-v2',JSON.stringify([{html:t.html,header:'',footer:'',margin:'normal'}]));location.href='/studios/document/document-creator/';});}renderFilters();render();</script></body></html>
