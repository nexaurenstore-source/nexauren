<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDF Compressor — Nexauren</title><style>body{font-family:system-ui;margin:0;background:linear-gradient(135deg,#111827,#312e81);color:white;min-height:100vh}main{max-width:760px;margin:auto;padding:48px 20px}.box{padding:28px;border:1px solid #ffffff33;border-radius:20px;background:#ffffff12}select,input{padding:12px;margin:12px 0;width:100%;box-sizing:border-box}button{padding:13px 18px;border:0;border-radius:12px}</style></head><body><main><div class="box"><h1>🗜️ PDF Compressor</h1><p>Choose a PDF and compression profile.</p><input id="file" type="file" accept="application/pdf"><select id="quality"><option>Balanced</option><option>Maximum reduction</option><option>High quality</option></select><p id="status">Choose a PDF to begin.</p><button onclick="file.value='';status.textContent='Choose a PDF to begin.'">Reset</button></div></main><script>file.onchange=()=>status.textContent=file.files[0]?`${file.files[0].name} ready for compression.`:'Choose a PDF to begin.'</script></body></html>
