<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDF Converter — Nexauren</title><style>body{font-family:system-ui;margin:0;background:linear-gradient(135deg,#0f172a,#1e1b4b);color:white;min-height:100vh}main{max-width:760px;margin:auto;padding:48px 20px}.box{padding:28px;border:1px solid #ffffff33;border-radius:20px;background:#ffffff12}input{margin:20px 0;padding:14px;width:100%;box-sizing:border-box;border-radius:12px;border:1px solid #ffffff33;background:#ffffff12;color:white}button{padding:13px 18px;border:0;border-radius:12px;cursor:pointer}.status{margin-top:16px;color:#cbd5e1}</style></head><body><main><div class="box"><h1>🔄 PDF Converter</h1><p>Prepare a file for a PDF conversion workflow.</p><input id="file" type="file" accept=".doc,.docx,.txt,.jpg,.jpeg,.png,.webp"><button id="reset">Reset</button><p class="status" id="status">Choose a file to begin.</p></div></main><script>const f=document.querySelector('#file'),s=document.querySelector('#status');f.onchange=()=>{s.textContent=f.files[0]?`${f.files[0].name} ready for conversion.`:'Choose a file to begin.'};document.querySelector('#reset').onclick=()=>{f.value='';s.textContent='Choose a file to begin.'}</script></body></html>
