<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDF Splitter — Nexauren</title><meta name="description" content="Extract selected pages from a PDF locally in your browser."><link rel="stylesheet" href="../pdf-tool.css"></head><body><main><a class="crumb" href="/studios/pdf/">← PDF Studio</a><section class="hero"><span class="kicker">PDF Experience</span><h1>PDF Splitter.</h1><p>Extract the pages you need into a new PDF using ranges or individual page numbers.</p></section><section class="workspace"><div class="drop"><label class="pick" for="file">Choose PDF</label><input id="file" type="file" accept="application/pdf"></div><div class="controls"><div class="control"><label for="range">Pages to extract</label><input id="range" placeholder="1-3, 5, 8-10" inputmode="text"></div></div><div id="fileList" class="file-list"></div><div class="actions"><button class="btn primary" id="run">Extract pages</button><button class="btn secondary" id="reset">Reset</button></div><p class="status" id="status">Choose a PDF to begin.</p><div class="note">Example: <strong>1-3, 5</strong> extracts pages 1, 2, 3 and 5. Processing stays in your browser.</div></section></main><script src="../pdf-tool.js"></script><script>NexaurenPDF.setup({empty:'Choose a PDF to begin.',run:async(fs,{range,download})=>{const {PDFDocument}=await NexaurenPDF.loadLib();const src=await PDFDocument.load(await fs[0].arrayBuffer());const ids=NexaurenPDF.parseRange(range.value,src.getPageCount());if(!ids.length)throw new Error('Enter the pages you want to extract.');const out=await PDFDocument.create();(await out.copyPages(src,ids)).forEach(p=>out.addPage(p));download(await out.save({useObjectStreams:true}),'nexauren-split.pdf') }})</script></body></html>
