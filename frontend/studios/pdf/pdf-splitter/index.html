<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDF Splitter — Nexauren</title><style>body{font-family:system-ui;margin:0;background:linear-gradient(135deg,#111827,#312e81);color:white;min-height:100vh}main{max-width:760px;margin:auto;padding:48px 20px}.box{padding:28px;border:1px solid #ffffff33;border-radius:20px;background:#ffffff12}input{padding:12px;margin:12px 0;width:100%;box-sizing:border-box}button{padding:13px 18px;border:0;border-radius:12px}</style></head><body><main><div class="box"><h1>✂️ PDF Splitter</h1><p>Select a PDF and define the pages to extract.</p><input id="file" type="file" accept="application/pdf"><input id="range" placeholder="Pages, e.g. 1-3, 5"><p id="status">Choose a PDF to begin.</p><button onclick="file.value='';range.value='';status.textContent='Choose a PDF to begin.'">Reset</button></div></main><script>file.onchange=()=>status.textContent=file.files[0]?`${file.files[0].name} ready.`:'Choose a PDF to begin.'</script></body></html>
