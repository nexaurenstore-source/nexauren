<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDF Merger — Nexauren</title><style>body{font-family:system-ui;margin:0;background:linear-gradient(135deg,#111827,#312e81);color:white;min-height:100vh}main{max-width:760px;margin:auto;padding:48px 20px}.box{padding:28px;border:1px solid #ffffff33;border-radius:20px;background:#ffffff12}input{margin:20px 0;width:100%;box-sizing:border-box}button{padding:13px 18px;border:0;border-radius:12px}</style></head><body><main><div class="box"><h1>🔗 PDF Merger</h1><p>Select PDFs and keep their order for a merge workflow.</p><input id="files" type="file" accept="application/pdf" multiple><p id="status">No files selected.</p><button onclick="files.value='';status.textContent='No files selected.'">Reset</button></div></main><script>files.onchange=()=>status.textContent=files.files.length?`${files.files.length} PDF file(s) selected.`:'No files selected.'</script></body></html>
