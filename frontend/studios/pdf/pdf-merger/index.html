<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDF Merger — Nexauren</title><meta name="description" content="Merge PDF files locally and keep their selected order."><link rel="stylesheet" href="../pdf-tool.css"><script src="/js/ads.js" defer></script>
</head><body><main><a class="crumb" href="/studios/pdf/">← PDF Studio</a><section class="hero"><span class="kicker">PDF Experience</span><h1>PDF Merger.</h1><p>Combine multiple PDF files into one document while preserving the order you choose.</p></section><section class="workspace"><div class="drop"><label class="pick" for="files">Choose PDFs</label><input id="files" type="file" accept="application/pdf" multiple></div><div id="fileList" class="file-list"></div><div class="actions"><button class="btn primary" id="run">Merge PDFs</button><button class="btn secondary" id="reset">Reset</button></div><p class="status" id="status">No files selected.</p><div id="result" class="nx-result"><div class="nx-result-head"><div><span class="kicker">Result</span><h2>PDF ready.</h2><p id="resultMeta"></p></div><button class="btn primary" id="downloadResult">Download PDF</button></div><div id="resultPreview" class="nx-result-preview"></div></div><div class="note">All merging is performed locally in your browser.</div></section></main><div id="processOverlay" class="nx-process-overlay" aria-live="polite"><div class="nx-process-card"><div class="nx-mascot"><i class="nx-mascot-aura"></i><div class="nx-mascot-head"><b class="nx-eye left"></b><b class="nx-eye right"></b><b class="nx-mouth"></b></div><div class="nx-mascot-body">N</div></div><strong>Nexauren is processing</strong><span>Your files stay in your browser.</span><div class="nx-progress"><i></i></div></div></div><script src="../pdf-tool.js"></script><script>NexaurenPDF.setup({empty:'Select at least two PDFs.',run:async fs=>{if(fs.length<2)throw new Error('Select at least two PDFs.');const {PDFDocument}=await NexaurenPDF.loadLib();const out=await PDFDocument.create();for(const f of fs){const src=await PDFDocument.load(await f.arrayBuffer());const pages=await out.copyPages(src,src.getPageIndices());pages.forEach(p=>out.addPage(p))}const b=await out.save({useObjectStreams:true});return{bytes:b,name:'nexauren-merged.pdf',meta:`${fs.length} PDFs combined successfully.`}}})</script></body></html>
