<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDF Merger — Nexauren</title><meta name="description" content="Merge PDF files locally and keep their selected order."><link rel="stylesheet" href="../pdf-tool.css"></head><body><main><a class="crumb" href="/studios/pdf/">← PDF Studio</a><section class="hero"><span class="kicker">PDF Experience</span><h1>PDF Merger.</h1><p>Combine multiple PDF files into one document while preserving the order you choose.</p></section><section class="workspace"><div class="drop"><label class="pick" for="files">Choose PDFs</label><input id="files" type="file" accept="application/pdf" multiple></div><div id="fileList" class="file-list"></div><div class="actions"><button class="btn primary" id="run">Merge PDFs</button><button class="btn secondary" id="reset">Reset</button></div><p class="status" id="status">No files selected.</p><div class="note">All merging is performed locally in your browser.</div></section></main><script src="../pdf-tool.js"></script><script>NexaurenPDF.setup({empty:'Select at least two PDFs.',run:async(fs,{download})=>{if(fs.length<2)throw new Error('Select at least two PDFs.');const {PDFDocument}=await NexaurenPDF.loadLib();const out=await PDFDocument.create();for(const f of fs){const src=await PDFDocument.load(await f.arrayBuffer());const pages=await out.copyPages(src,src.getPageIndices());pages.forEach(p=>out.addPage(p))}download(await out.save({useObjectStreams:true}),'nexauren-merged.pdf') }})</script></body></html>
