<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDF Editor — Nexauren</title><style>body{font-family:system-ui;margin:0;background:linear-gradient(135deg,#111827,#312e81);color:white;min-height:100vh}main{max-width:760px;margin:auto;padding:48px 20px}.box{padding:28px;border:1px solid #ffffff33;border-radius:20px;background:#ffffff12}input,textarea{padding:12px;margin:12px 0;width:100%;box-sizing:border-box;border-radius:10px;border:1px solid #ffffff33;background:#ffffff10;color:white}button{padding:13px 18px;border:0;border-radius:12px}</style></head><body><main><div class="box"><h1>📝 PDF Editor</h1><p>Load a PDF and prepare basic editing or annotation actions.</p><input id="file" type="file" accept="application/pdf"><textarea id="note" rows="4" placeholder="Optional note or annotation text"></textarea><p id="status">Choose a PDF to begin.</p><button onclick="file.value='';note.value='';status.textContent='Choose a PDF to begin.'">Reset</button></div></main><script>file.onchange=()=>status.textContent=file.files[0]?`${file.files[0].name} ready for editing.`:'Choose a PDF to begin.'</script></body></html>
