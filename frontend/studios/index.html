ut)return;input.addEventListener('input',()=>{const term=input.value.toLowerCase().trim();document.querySelectorAll('.nx-studio-card').forEach(card=>{card.hidden=!!term&&!card.textContent.toLowerCase().includes(term)})})});</script></body></html>
