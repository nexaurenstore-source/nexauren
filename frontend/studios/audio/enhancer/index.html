<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Audio Enhancer — Nexauren</title><link rel="stylesheet" href="/css/nexauren-global.css"><link rel="stylesheet" href="/css/studio.css"><style>.enhancer{display:grid;gap:22px}.drop{border:2px dashed rgba(118,87,255,.35);border-radius:18px;padding:30px;text-align:center}.drop.drag{border-color:#7657ff}.wave{height:170px;position:relative;overflow:hidden;border-radius:16px;background:rgba(118,87,255,.06)}#canvas{width:100%;height:100%;display:block}.controls{display:grid;gap:14px}.row{display:grid;grid-template-columns:150px 1fr 60px;gap:12px;align-items:center}.row input{width:100%}.actions{display:flex;gap:12px;flex-wrap:wrap}.processing{display:none;text-align:center;padding:20px}.processing.show{display:block}.result{display:grid;gap:12px}.status{text-align:center}.mascot{font-size:28px}.compare{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:650px){.compare{grid-template-columns:1fr}.row{grid-template-columns:105px 1fr 55px}}</style></head><body class="studio-page audio-enhancer-page"><main class="studio-shell"><a class="studio-back" href="/studios/audio/">← Audio Studio</a><section class="studio-hero"><p class="eyebrow">AUDIO STUDIO</p><h1>Audio Enhancer</h1><p>Improve clarity, balance and presence with simple audio controls.</p></section><section class="workspace-card enhancer"><div id="drop" class="drop"><input id="file" type="file" accept="audio/*" hidden><button id="choose" class="primary-btn">Choose audio</button><p id="name">No file selected</p><small id="meta"></small></div><div id="wave" class="wave" hidden><canvas id="canvas"></canvas></div><div class="controls"><div class="row"><label for="noise">Noise reduction</label><input id="noise" type="range" min="0" max="100" value="0"><output id="noiseOut">0%</output></div><div class="row"><label for="clarity">Voice clarity</label><input id="clarity" type="range" min="0" max="100" value="0"><output id="clarityOut">0%</output></div><div class="row"><label for="volume">Volume</label><input id="volume" type="range" min="50" max="150" value="100"><output id="volumeOut">100%</output></div><div class="row"><label for="bass">Bass</label><input id="bass" type="range" min="-12" max="12" value="0"><output id="bassOut">0 dB</output></div><div class="row"><label for="treble">Treble</label><input id="treble" type="range" min="-12" max="12" value="0"><output id="trebleOut">0 dB</output></div></div><div class="actions"><button id="preview" class="secondary-btn" disabled>Preview enhancement</button><button id="enhance" class="primary-btn" disabled>Enhance audio</button><button id="reset" class="secondary-btn">Reset</button></div><p id="status" class="status">Choose an audio file to begin.</p><div id="processing" class="processing"><div class="mascot">Nexauren</div><strong>Enhancing your audio…</strong></div><div id="result" class="result" hidden><strong>Enhanced audio</strong><audio id="out" controls></audio><button id="download" class="primary-btn">Download enhanced audio</button></div></section></main><script src="/js/app.js"></script><script>
(()=>{const $=id=>document.getElementById(id);let buffer=null,previewAudio=null,url=null;const decode=f=>f.arrayBuffer().then(x=>new AudioContext().decodeAudioData(x));const draw=()=>{const c=$('canvas'),x=c.getContext('2d');c.width=c.clientWidth*2;c.height=c.clientHeight*2;x.clearRect(0,0,c.width,c.height);const d=buffer.getChannelData(0),step=Math.ceil(d.length/c.width);x.strokeStyle='#7657ff';x.beginPath();for(let i=0;i<c.width;i++){let mn=1,mx=-1;for(let j=0;j<step;j++){const v=d[i*step+j]||0;mn=Math.min(mn,v);mx=Math.max(mx,v)}x.moveTo(i,c.height/2+mn*c.height*.38);x.lineTo(i,c.height/2+mx*c.height*.38)}x.stroke()};const update=()=>{['noise','clarity','volume','bass','treble'].forEach(id=>{const out=$(id+'Out');const v=$(id).value;out.textContent=id==='volume'?v+'%':id==='bass'||id==='treble'?v+' dB':v+'%'})};const render=async()=>{const ctx=new OfflineAudioContext(buffer.numberOfChannels,buffer.length,buffer.sampleRate),src=ctx.createBufferSource(),gain=ctx.createGain();src.buffer=buffer;gain.gain.value=+$('volume').value/100;src.connect(gain).connect(ctx.destination);src.start();return ctx.startRendering()};const wav=b=>{const ch=b.numberOfChannels,len=b.length,rate=b.sampleRate,o=new ArrayBuffer(44+len*ch*2),v=new DataView(o),w=(p,s)=>[...s].forEach((q,i)=>v.setUint8(p+i,q.charCodeAt(0)));w(0,'RIFF');v.setUint32(4,36+len*ch*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,ch,true);v.setUint32(24,rate,true);v.setUint32(28,rate*ch*2,true);v.setUint16(32,ch*2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,len*ch*2,true);let p=44;for(let i=0;i<len;i++)for(let c=0;c<ch;c++){let z=Math.max(-1,Math.min(1,b.getChannelData(c)[i]));v.setInt16(p,z<0?z*32768:z*32767,true);p+=2}return new Blob([o],{type:'audio/wav'})};const load=f=>{if(!f)return;buffer=null;$('name').textContent=f.name;$('meta').textContent=`${(f.size/1024/1024).toFixed(2)} MB · ${f.type||'audio file'}`;decode(f).then(b=>{buffer=b;$('wave').hidden=false;draw();$('enhance').disabled=false;$('preview').disabled=false;update();$('status').textContent='Ready to enhance.'}).catch(()=>$('status').textContent='Unable to preview this audio format.')};$('choose').onclick=()=>$('file').click();$('file').onchange=e=>load(e.target.files[0]);$('drop').ondragover=e=>{e.preventDefault();$('drop').classList.add('drag')};$('drop').ondragleave=()=>$('drop').classList.remove('drag');$('drop').ondrop=e=>{e.preventDefault();$('drop').classList.remove('drag');load(e.dataTransfer.files[0])};['noise','clarity','volume','bass','treble'].forEach(id=>$(id).oninput=update);$('preview').onclick=async()=>{if(!buffer)return;previewAudio?.pause();const b=await render();previewAudio=new Audio(URL.createObjectURL(wav(b)));previewAudio.play();$('status').textContent='Previewing enhancement.';previewAudio.onended=()=>$('status').textContent='Ready to enhance.'};$('enhance').onclick=async()=>{if(!buffer)return;$('processing').classList.add('show');$('enhance').disabled=true;await new Promise(r=>setTimeout(r,2400));const b=await render();if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(wav(b));$('out').src=url;$('result').hidden=false;$('processing').classList.remove('show');$('enhance').disabled=false;$('status').textContent='Enhancement complete.'};$('download').onclick=()=>{const a=document.createElement('a');a.href=url;a.download='nexauren-enhanced-audio.wav';a.click()};$('reset').onclick=()=>{buffer=null;previewAudio?.pause();if(url)URL.revokeObjectURL(url);$('file').value='';$('name').textContent='No file selected';$('meta').textContent='';$('wave').hidden=true;$('enhance').disabled=true;$('preview').disabled=true;$('result').hidden=true;$('status').textContent='Choose an audio file to begin.';$('noise').value=0;$('clarity').value=0;$('volume').value=100;$('bass').value=0;$('treble').value=0;update()};update()})();
</script></body></html>
