<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Audio Speed &amp; Pitch — Nexauren</title><meta name="description" content="Adjust audio speed and pitch in a focused Nexauren Audio Studio workspace."><link rel="stylesheet" href="/css/nexauren-global.css"><link rel="stylesheet" href="/studios/audio/workspace.css"></head>
<body><div id="site-header"></div><main class="audio-workspace container"><a class="workspace-back" href="/studios/audio/">← Audio Studio</a><section class="workspace-hero"><span class="aw-kicker">AUDIO STUDIO</span><h1>Audio Speed &amp; Pitch</h1><p>Shape the timing and pitch of your audio with immediate browser-based feedback.</p></section><section class="aw-box"><label class="aw-upload" for="audio-file"><strong>Choose audio</strong><span>Drop an audio file here or browse your device</span></label><input id="audio-file" type="file" accept="audio/*" hidden><div class="aw-file-name" id="file-name">No file selected</div><div class="aw-controls"><label>Speed <input id="speed" type="range" min="0.5" max="2" step="0.05" value="1"><output id="speed-value">1×</output></label><label>Pitch <input id="pitch" type="range" min="-12" max="12" step="1" value="0"><output id="pitch-value">0 semitones</output></label></div><div class="aw-result" id="preview-panel" hidden><div class="aw-result-head"><div><span class="aw-kicker">PREVIEW</span><h2>Live result</h2></div><span id="audio-status">Ready</span></div><audio id="preview" controls preload="metadata"></audio></div><div class="aw-actions"><button id="reset" class="aw-btn secondary" type="button">Reset</button></div></section></main><div id="site-footer"></div><script src="/js/app.js" defer></script><script>(()=>{const f=document.querySelector('#audio-file'),a=document.querySelector('#preview'),pnl=document.querySelector('#preview-panel'),s=document.querySelector('#speed'),p=document.querySelector('#pitch'),so=document.querySelector('#speed-value'),po=document.querySelector('#pitch-value'),st=document.querySelector('#audio-status'),n=document.querySelector('#file-name'),r=document.querySelector('#reset');let u='';f.addEventListener('change',()=>{const x=f.files?.[0];if(!x)return;if(u)URL.revokeObjectURL(u);u=URL.createObjectURL(x);a.src=u;a.load();pnl.hidden=false;n.textContent=x.name;a.playbackRate=+s.value;st.textContent='Ready to preview'});s.addEventListener('input',()=>{so.textContent=`${s.value}×`;a.playbackRate=+s.value;if(f.files?.length)st.textContent='Preview updated'});p.addEventListener('input',()=>{po.textContent=`${p.value} semitones`;if(f.files?.length)st.textContent='Pitch setting updated'});r.addEventListener('click',()=>{f.value='';a.pause();a.removeAttribute('src');pnl.hidden=true;n.textContent='No file selected';s.value=1;p.value=0;so.textContent='1×';po.textContent='0 semitones';if(u){URL.revokeObjectURL(u);u='' }})})();</script></body></html>
