<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Audio Speed &amp; Pitch — Nexauren</title><meta name="description" content="Adjust audio speed and pitch in a focused Nexauren Audio Studio workspace."><link rel="stylesheet" href="/css/nexauren-global.css"><link rel="stylesheet" href="/studios/audio/workspace.css"><style>
.sp-card{display:grid;gap:20px}.sp-controls{display:grid;grid-template-columns:1fr 1fr;gap:16px}.sp-field{padding:16px;border:1px solid rgba(118,87,255,.18);border-radius:16px;background:linear-gradient(135deg,rgba(118,87,255,.08),rgba(32,201,151,.06))}.sp-field label{display:flex;justify-content:space-between;font-weight:700;margin-bottom:10px}.sp-field input{width:100%}.sp-presets{display:flex;gap:8px;flex-wrap:wrap}.sp-presets button{border:1px solid rgba(118,87,255,.2);border-radius:999px;padding:8px 12px;background:transparent;cursor:pointer}.sp-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.sp-stat{padding:12px;border-radius:14px;background:rgba(118,87,255,.06)}.sp-stat small{display:block;opacity:.7}.sp-actions{display:flex;gap:10px;flex-wrap:wrap}@media(max-width:700px){.sp-controls,.sp-summary{grid-template-columns:1fr}}
</style></head>
<body><div id="site-header"></div><main class="aw-page"><div class="aw-wrap"><a class="aw-back" href="/studios/audio/">← Audio Studio</a><header class="aw-head"><span class="aw-kicker">AUDIO STUDIO</span><h1>Audio Speed &amp; Pitch</h1><p>Adjust timing and pitch for quick browser-based preview and export.</p></header><section class="aw-box sp-card"><label class="aw-drop" for="audio-file"><span class="aw-kicker">UPLOAD AUDIO</span><h2>Choose an audio file</h2><p>MP3, WAV and other browser-supported audio formats</p><button class="aw-btn primary" type="button" onclick="document.getElementById('audio-file').click()">Choose file</button></label><input id="audio-file" class="aw-file" type="file" accept="audio/*"><div class="aw-status" id="file-name">No file selected</div><div class="sp-presets" aria-label="Presets"><button type="button" data-speed="0.75" data-pitch="-2">Slow</button><button type="button" data-speed="1" data-pitch="0">Original</button><button type="button" data-speed="1.25" data-pitch="2">Bright</button><button type="button" data-speed="1.5" data-pitch="4">Fast</button></div><div class="sp-controls"><div class="sp-field"><label for="speed"><span>Speed</span><output id="speed-value">1×</output></label><input id="speed" type="range" min="0.5" max="2" step="0.05" value="1"></div><div class="sp-field"><label for="pitch"><span>Pitch</span><output id="pitch-value">0 semitones</output></label><input id="pitch" type="range" min="-12" max="12" step="1" value="0"></div></div><div class="sp-summary"><div class="sp-stat"><small>Input</small><strong id="meta">—</strong></div><div class="sp-stat"><small>Playback factor</small><strong id="factor">1×</strong></div><div class="sp-stat"><small>Status</small><strong id="audio-status">Choose an audio file</strong></div></div><div class="aw-preview" id="preview-panel" hidden><strong>Live Preview</strong><audio id="preview" controls preload="metadata"></audio></div><div class="aw-actions sp-actions"><button id="reset" class="aw-btn secondary" type="button">Reset</button></div></section></div></main><div id="site-footer"></div><script src="/js/app.js" defer></script><script>(()=>{const f=document.querySelector('#audio-file'),a=document.querySelector('#preview'),panel=document.querySelector('#preview-panel'),s=document.querySelector('#speed'),p=document.querySelector('#pitch'),so=document.querySelector('#speed-value'),po=document.querySelector('#pitch-value'),st=document.querySelector('#audio-status'),n=document.querySelector('#file-name'),m=document.querySelector('#meta'),factor=document.querySelector('#factor'),r=document.querySelector('#reset');let u='';const apply=()=>{const speed=+s.value,pitch=+p.value,rate=speed*Math.pow(2,pitch/12);so.textContent=`${speed}×`;po.textContent=`${pitch>0?'+':''}${pitch} semitones`;factor.textContent=`${rate.toFixed(2)}×`;a.playbackRate=rate;if(f.files?.length)st.textContent='Preview updated'};f.addEventListener('change',()=>{const x=f.files?.[0];if(!x)return;if(u)URL.revokeObjectURL(u);u=URL.createObjectURL(x);a.src=u;a.load();panel.hidden=false;n.textContent=x.name;m.textContent=`${(x.size/1024/1024).toFixed(2)} MB · ${x.type||'audio'}`;st.textContent='Ready to preview';apply()});s.addEventListener('input',apply);p.addEventListener('input',apply);document.querySelectorAll('[data-speed]').forEach(b=>b.addEventListener('click',()=>{s.value=b.dataset.speed;p.value=b.dataset.pitch;apply()}));r.addEventListener('click',()=>{f.value='';a.pause();a.removeAttribute('src');panel.hidden=true;n.textContent='No file selected';m.textContent='—';st.textContent='Choose an audio file';s.value=1;p.value=0;if(u){URL.revokeObjectURL(u);u=''}apply()})})();</script></body></html>
