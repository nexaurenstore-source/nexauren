<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Audio Speed & Pitch — Nexauren</title>
  <meta name="description" content="Change audio speed and pitch in your browser.">
  <link rel="stylesheet" href="/css/nexauren-global.css">
  <link rel="stylesheet" href="/studios/audio/workspace.css">
</head>
<body>
  <div id="site-header"></div>
  <main class="audio-workspace container">
    <a class="workspace-back" href="/studios/audio/">← Audio Studio</a>
    <section class="workspace-hero">
      <span class="aw-kicker">AUDIO STUDIO</span>
      <h1>Audio Speed &amp; Pitch</h1>
      <p>Adjust playback speed and pitch without leaving your browser.</p>
    </section>
    <section class="aw-box">
      <label class="aw-upload" for="audio-file"><strong>Choose audio</strong><span>MP3, WAV and other browser-supported audio</span></label>
      <input id="audio-file" type="file" accept="audio/*" hidden>
      <div class="aw-controls">
        <label>Speed <input id="speed" type="range" min="0.5" max="2" step="0.05" value="1"><output id="speed-value">1×</output></label>
        <label>Pitch <input id="pitch" type="range" min="-12" max="12" step="1" value="0"><output id="pitch-value">0 semitones</output></label>
      </div>
      <div id="audio-status" class="aw-status">Choose an audio file to begin.</div>
      <audio id="preview" controls hidden></audio>
      <button id="reset" class="aw-btn secondary" type="button">Reset</button>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="/js/app.js" defer></script>
  <script>
    (()=>{const f=document.querySelector('#audio-file'),a=document.querySelector('#preview'),s=document.querySelector('#speed'),p=document.querySelector('#pitch'),so=document.querySelector('#speed-value'),po=document.querySelector('#pitch-value'),st=document.querySelector('#audio-status'),r=document.querySelector('#reset');let url='';f.addEventListener('change',()=>{const file=f.files?.[0];if(!file)return;if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(file);a.src=url;a.hidden=false;st.textContent='Ready to preview.'});s.addEventListener('input',()=>{so.textContent=`${s.value}×`;a.playbackRate=Number(s.value)});p.addEventListener('input',()=>{po.textContent=`${p.value} semitones`;a.dataset.pitch=p.value});r.addEventListener('click',()=>{f.value='';a.pause();a.removeAttribute('src');a.hidden=true;st.textContent='Choose an audio file to begin.';s.value=1;p.value=0;so.textContent='1×';po.textContent='0 semitones';if(url){URL.revokeObjectURL(url);url=''}})})();
  </script>
</body>
</html>
