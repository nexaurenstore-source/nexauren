<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Audio Speed &amp; Pitch — Nexauren</title><meta name="description" content="Adjust audio speed and pitch in a focused Nexauren Audio Studio workspace."><link rel="stylesheet" href="/css/nexauren-global.css"><link rel="stylesheet" href="/studios/audio/workspace.css"></head>
<body><div id="site-header"></div><main class="aw-page"><div class="aw-wrap"><a class="aw-back" href="/studios/audio/">← Audio Studio</a><header class="aw-head"><span class="aw-kicker">AUDIO STUDIO</span><h1>Audio Speed &amp; Pitch</h1><p>Adjust the timing and pitch of your audio with a focused, browser-based workspace.</p></header><section class="aw-box"><label class="aw-drop" for="audio-file"><span class="aw-kicker">UPLOAD AUDIO</span><h2>Choose an audio file</h2><p>MP3, WAV and other browser-supported audio formats</p><button class="aw-btn primary" type="button" onclick="document.getElementById('audio-file').click()">Choose file</button></label><input id="audio-file" class="aw-file" type="file" accept="audio/*"><div class="aw-status" id="file-name">No file selected</div><div class="aw-controls"><div class="aw-field"><label for="speed"><span>Speed</span><output id="speed-value">1×</output></label><input id="speed" type="range" min="0.5" max="2" step="0.05" value="1"></div><div class="aw-field"><label for="pitch"><span>Pitch</span><output id="pitch-value">0 semitones</output></label><input id="pitch" type="range" min="-12" max="12" step="1" value="0"></div></div><div class="aw-preview" id="preview-panel" hidden><strong>Live Preview</strong><audio id="preview" controls preload="metadata"></audio></div><div class="aw-status" id="audio-status">Choose an audio file to begin.</div><div class="aw-actions"><button id="reset" class="aw-btn secondary" type="button">Reset</button></div></section></div></main><div id="site-footer"></div><script src="/js/app.js" defer></script><script>(()=>{const f=document.querySelector('#audio-file'),a=document.querySelector('#preview'),panel=document.querySelector('#preview-panel'),s=document.querySelector('#speed'),p=document.querySelector('#pitch'),so=document.querySelector('#speed-value'),po=document.querySelector('#pitch-value'),st=document.querySelector('#audio-status'),n=document.querySelector('#file-name'),r=document.querySelector('#reset');let u='';f.addEventListener('change',()=>{const x=f.files?.[0];if(!x)return;if(u)URL.revokeObjectURL(u);u=URL.createObjectURL(x);a.src=u;a.load();panel.hidden=false;n.textContent=x.name;st.textContent='Ready to preview';a.playbackRate=+s.value});s.addEventListener('input',()=>{so.textContent=`${s.value}×`;a.playbackRate=+s.value;if(f.files?.length)st.textContent='Preview updated'});p.addEventListener('input',()=>{po.textContent=`${p.value} semitones`;if(f.files?.length)st.textContent='Pitch setting updated'});r.addEventListener('click',()=>{f.value='';a.pause();a.removeAttribute('src');panel.hidden=true;n.textContent='No file selected';st.textContent='Choose an audio file to begin.';s.value=1;p.value=0;so.textContent='1×';po.textContent='0 semitones';if(u){URL.revokeObjectURL(u);u=''}})})();</script></body></html>
