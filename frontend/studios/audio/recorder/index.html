<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Audio Recorder — Nexauren</title>
<link rel="stylesheet" href="/css/nexauren-global.css">
<link rel="stylesheet" href="/css/studio.css">
</head>
<body class="studio-page audio-recorder-page">
<main class="studio-shell">
  <a class="studio-back" href="/studios/audio/">← Audio Studio</a>
  <section class="studio-hero">
    <p class="eyebrow">AUDIO STUDIO</p>
    <h1>Audio Recorder</h1>
    <p>Record clear audio directly from your microphone.</p>
  </section>
  <section class="workspace-card">
    <div class="recorder-display">
      <div id="recordDot" class="record-dot"></div>
      <div id="timer" class="record-timer">00:00</div>
      <p id="status">Ready to record.</p>
    </div>
    <div class="recorder-actions">
      <button id="recordBtn" class="primary-btn">Start recording</button>
      <button id="resetBtn" class="secondary-btn" disabled>Reset</button>
    </div>
    <audio id="preview" controls hidden></audio>
    <div id="result" hidden>
      <button id="downloadBtn" class="primary-btn">Download recording</button>
    </div>
  </section>
</main>
<script src="/js/app.js"></script>
<script>
(() => {
  const recordBtn=document.getElementById('recordBtn'), resetBtn=document.getElementById('resetBtn'), preview=document.getElementById('preview'), result=document.getElementById('result'), downloadBtn=document.getElementById('downloadBtn'), timer=document.getElementById('timer'), status=document.getElementById('status'), dot=document.getElementById('recordDot');
  let recorder=null, chunks=[], stream=null, startedAt=0, timerId=null, url=null;
  const fmt=n=>{const s=Math.floor(n/1000),m=Math.floor(s/60);return `${String(m).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`};
  const tick=()=>timer.textContent=fmt(Date.now()-startedAt);
  const reset=()=>{if(recorder?.state==='recording') recorder.stop(); if(stream) stream.getTracks().forEach(t=>t.stop()); if(timerId) clearInterval(timerId); if(url) URL.revokeObjectURL(url); recorder=null;stream=null;chunks=[];url=null;timer.textContent='00:00';preview.hidden=true;preview.removeAttribute('src');result.hidden=true;recordBtn.disabled=false;recordBtn.textContent='Start recording';resetBtn.disabled=true;dot.classList.remove('recording');status.textContent='Ready to record.'};
  recordBtn.addEventListener('click',async()=>{if(recorder?.state==='recording'){recorder.stop();return}try{stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=()=>{stream.getTracks().forEach(t=>t.stop());stream=null;clearInterval(timerId);url=URL.createObjectURL(new Blob(chunks,{type:recorder.mimeType||'audio/webm'}));preview.src=url;preview.hidden=false;result.hidden=false;recordBtn.disabled=false;recordBtn.textContent='Start recording';resetBtn.disabled=false;dot.classList.remove('recording');status.textContent='Recording ready to preview.'};startedAt=Date.now();timerId=setInterval(tick,250);tick();dot.classList.add('recording');status.textContent='Recording…';recordBtn.textContent='Stop recording';resetBtn.disabled=false;recorder.start()}catch{status.textContent='Microphone access was not available.'}});
  resetBtn.addEventListener('click',reset);
  downloadBtn.addEventListener('click',()=>{if(!url)return;const a=document.createElement('a');a.href=url;a.download='nexauren-recording.webm';a.click()});
})();
</script>
</body>
</html>
