<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Audio Editor — Nexauren</title>
<link rel="stylesheet" href="/css/nexauren-global.css"><link rel="stylesheet" href="/css/studio.css">
<style>
.editor-workspace{display:grid;gap:22px}.editor-drop{border:2px dashed rgba(118,87,255,.35);border-radius:18px;padding:30px;text-align:center}.editor-drop.drag{border-color:#7657ff}.wave-wrap{position:relative;height:180px;border-radius:16px;overflow:hidden;background:rgba(118,87,255,.06)}#waveCanvas{width:100%;height:100%;display:block}.selection{position:absolute;top:0;bottom:0;background:rgba(118,87,255,.18);border-left:2px solid #7657ff;border-right:2px solid #7657ff;pointer-events:none}.controls{display:grid;gap:14px}.control-row{display:grid;grid-template-columns:110px 1fr 65px;gap:12px;align-items:center}.control-row input{width:100%}.actions{display:flex;gap:12px;flex-wrap:wrap}.editor-status{text-align:center}.processing{display:none;text-align:center;padding:22px}.processing.show{display:block}.mascot{font-size:44px;margin-bottom:8px}.result.show{display:block}
</style>
</head>
<body class="studio-page audio-editor-page">
<main class="studio-shell">
<a class="studio-back" href="/studios/audio/">← Audio Studio</a>
<section class="studio-hero"><p class="eyebrow">AUDIO STUDIO</p><h1>Audio Editor</h1><p>Edit your audio with simple controls and preview the result.</p></section>
<section class="workspace-card editor-workspace">
<div id="drop" class="editor-drop"><input id="audioFile" type="file" accept="audio/*" hidden><button id="chooseBtn" class="primary-btn">Choose audio</button><p id="fileName">No file selected</p><small id="fileMeta"></small></div>
<div id="wave" class="wave-wrap" hidden><canvas id="waveCanvas"></canvas><div id="selection" class="selection"></div></div>
<div class="controls">
<div class="control-row"><label for="start">Start</label><input id="start" type="range" min="0" max="100" value="0"><output id="startOut">0:00</output></div>
<div class="control-row"><label for="end">End</label><input id="end" type="range" min="0" max="100" value="100"><output id="endOut">0:00</output></div>
<div class="control-row"><label for="volume">Volume</label><input id="volume" type="range" min="0" max="200" value="100"><output id="volumeOut">100%</output></div>
<div class="control-row"><label for="fadeIn">Fade in</label><input id="fadeIn" type="range" min="0" max="10" step="0.1" value="0"><output id="fadeInOut">0s</output></div>
<div class="control-row"><label for="fadeOut">Fade out</label><input id="fadeOut" type="range" min="0" max="10" step="0.1" value="0"><output id="fadeOutOut">0s</output></div>
</div>
<div class="actions"><button id="previewBtn" class="secondary-btn" disabled>Preview edit</button><button id="processBtn" class="primary-btn" disabled>Process audio</button><button id="resetBtn" class="secondary-btn">Reset</button></div>
<p id="status" class="editor-status">Choose an audio file to begin.</p>
<div id="processing" class="processing"><div class="mascot">Nexauren</div><strong>Processing your audio…</strong></div>
<div id="result" class="result" hidden><audio id="resultAudio" controls></audio><br><button id="downloadBtn" class="primary-btn">Download edited audio</button></div>
</section></main>
<script src="/js/app.js"></script><script>
(()=>{const $=id=>document.getElementById(id);let file=null,buffer=null,preview=null,url=null;const fmt=s=>{s=Math.max(0,s||0);return `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`};const decode=f=>f.arrayBuffer().then(x=>new AudioContext().decodeAudioData(x));const wave=()=>{if(!buffer)return;const c=$('waveCanvas'),x=c.getContext('2d');c.width=c.clientWidth*2;c.height=c.clientHeight*2;x.clearRect(0,0,c.width,c.height);const d=buffer.getChannelData(0),step=Math.ceil(d.length/c.width);x.strokeStyle='#7657ff';x.beginPath();for(let i=0;i<c.width;i++){let mn=1,mx=-1;for(let j=0;j<step;j++){let v=d[i*step+j]||0;mn=Math.min(mn,v);mx=Math.max(mx,v)}x.moveTo(i,c.height/2+mn*c.height*.38);x.lineTo(i,c.height/2+mx*c.height*.38)}x.stroke();};const update=()=>{if(!buffer)return;let s=+$('start').value,e=+$('end').value;if(s>e){if(document.activeElement===$('start'))e=s;else s=e;$('start').value=s;$('end').value=e}let a=buffer.duration*s/100,b=buffer.duration*e/100;$('selection').style.left=s+'%';$('selection').style.width=Math.max(0,e-s)+'%';$('startOut').textContent=fmt(a);$('endOut').textContent=fmt(b);$('volumeOut').textContent=$('volume').value+'%';$('fadeInOut').textContent=$('fadeIn').value+'s';$('fadeOutOut').textContent=$('fadeOut').value+'s';$('previewBtn').disabled=!(b>a)};const wav=(b,start,end,vol,fi,fo)=>{const rate=b.sampleRate,from=Math.floor(start*rate),to=Math.floor(end*rate),len=to-from,ch=b.numberOfChannels,out=new ArrayBuffer(44+len*ch*2),v=new DataView(out),w=(o,s)=>[...s].forEach((q,i)=>v.setUint8(o+i,q.charCodeAt(0)));w(0,'RIFF');v.setUint32(4,36+len*ch*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,ch,true);v.setUint32(24,rate,true);v.setUint32(28,rate*ch*2,true);v.setUint16(32,ch*2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,len*ch*2,true);let p=44;for(let i=0;i<len;i++){let t=i/rate,y=Math.max(0,Math.min(1,t/fi||1,(end-start-t)/fo||1));for(let c=0;c<ch;c++){let z=b.getChannelData(c)[from+i]*vol*y;z=Math.max(-1,Math.min(1,z));v.setInt16(p,z<0?z*32768:z*32767,true);p+=2}}return new Blob([out],{type:'audio/wav'})};const load=f=>{file=f;$('fileName').textContent=f.name;$('fileMeta').textContent=`${(f.size/1024/1024).toFixed(2)} MB · ${f.type||'audio file'}`;decode(f).then(b=>{buffer=b;$('wave').hidden=false;wave();$('processBtn').disabled=false;update();$('status').textContent='Ready to edit.'}).catch(()=>$('status').textContent='Unable to preview this audio format.')};$('chooseBtn').onclick=()=>$('audioFile').click();$('audioFile').onchange=e=>load(e.target.files[0]);$('drop').ondragover=e=>{e.preventDefault();$('drop').classList.add('drag')};$('drop').ondragleave=()=>$('drop').classList.remove('drag');$('drop').ondrop=e=>{e.preventDefault();$('drop').classList.remove('drag');load(e.dataTransfer.files[0])};['start','end','volume','fadeIn','fadeOut'].forEach(id=>$(id).oninput=update);$('previewBtn').onclick=()=>{if(!buffer)return;let s=buffer.duration*+$('start').value/100,e=buffer.duration*+$('end').value/100;preview?.pause();preview=new Audio(URL.createObjectURL(wav(buffer,s,e,+$('volume').value/100,+$('fadeIn').value,+$('fadeOut').value)));preview.play();$('status').textContent='Previewing edit.';preview.onended=()=>$('status').textContent='Ready to process.'};$('processBtn').onclick=async()=>{if(!buffer)return;$('processing').classList.add('show');$('processBtn').disabled=true;await new Promise(r=>setTimeout(r,2400));let s=buffer.duration*+$('start').value/100,e=buffer.duration*+$('end').value/100;let blob=wav(buffer,s,e,+$('volume').value/100,+$('fadeIn').value,+$('fadeOut').value);url=URL.createObjectURL(blob);$('resultAudio').src=url;$('downloadBtn').onclick=()=>{let a=document.createElement('a');a.href=url;a.download='nexauren-edited-audio.wav';a.click()};$('result').hidden=false;$('processing').classList.remove('show');$('processBtn').disabled=false;$('status').textContent='Processing complete.'};$('resetBtn').onclick=()=>{file=null;buffer=null;preview?.pause();if(url)URL.revokeObjectURL(url);$('audioFile').value='';$('fileName').textContent='No file selected';$('fileMeta').textContent='';$('wave').hidden=true;$('processBtn').disabled=true;$('previewBtn').disabled=true;$('result').hidden=true;$('status').textContent='Choose an audio file to begin.';$('start').value=0;$('end').value=100;$('volume').value=100;$('fadeIn').value=0;$('fadeOut').value=0;update()}})();
</script></body></html>
