<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Audio Compressor — Nexauren</title><link rel="stylesheet" href="/css/nexauren-global.css"><link rel="stylesheet" href="/css/studio.css"><style>.compressor{display:grid;gap:20px}.drop{border:2px dashed rgba(118,87,255,.35);border-radius:18px;padding:28px;text-align:center}.drop.drag{border-color:#7657ff}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{padding:16px;border-radius:14px;background:rgba(118,87,255,.06)}.row{display:grid;grid-template-columns:130px 1fr 70px;gap:12px;align-items:center}.row input{width:100%}.actions{display:flex;gap:12px;flex-wrap:wrap}.processing{display:none;text-align:center;padding:20px}.processing.show{display:block}.status{text-align:center}@media(max-width:650px){.stats{grid-template-columns:1fr}.row{grid-template-columns:105px 1fr 60px}}</style></head><body class="studio-page audio-compressor-page"><main class="studio-shell"><a class="studio-back" href="/studios/audio/">← Audio Studio</a><section class="studio-hero"><p class="eyebrow">AUDIO STUDIO</p><h1>Audio Compressor</h1><p>Reduce audio file size while keeping the sound clear.</p></section><section class="workspace-card compressor"><div id="drop" class="drop"><input id="file" type="file" accept="audio/*" hidden><button id="choose" class="primary-btn">Choose audio</button><p id="name">No file selected</p><small id="meta"></small></div><div id="stats" class="stats" hidden><div class="stat"><small>Original size</small><br><strong id="original">—</strong></div><div class="stat"><small>Estimated size</small><br><strong id="estimated">—</strong></div><div class="stat"><small>Estimated reduction</small><br><strong id="reduction">—</strong></div></div><div class="row"><label for="quality">Quality</label><input id="quality" type="range" min="32" max="192" step="8" value="96"><output id="qualityOut">96 kbps</output></div><div class="actions"><button id="preview" class="secondary-btn" disabled>Preview</button><button id="compress" class="primary-btn" disabled>Compress audio</button><button id="reset" class="secondary-btn">Reset</button></div><p id="status" class="status">Choose an audio file to begin.</p><div id="processing" class="processing"><strong>Compressing your audio…</strong></div><div id="result" hidden><audio id="out" controls></audio><br><button id="download" class="primary-btn">Download compressed audio</button></div></section></main><script src="/js/app.js"></script><script>(()=>{const $=id=>document.getElementById(id);let file=null,buffer=null,url=null,preview=null;const decode=f=>f.arrayBuffer().then(x=>new AudioContext().decodeAudioData(x));const size=n=>n<1024*1024?(n/1024).toFixed(0)+' KB':(n/1024/1024).toFixed(2)+' MB';const estimate=()=>{if(!file||!buffer)return;const kb=+$('quality').value,bytes=Math.round(buffer.duration*kb*1000/8);$('original').textContent=size(file.size);$('estimated').textContent=size(bytes);$('reduction').textContent=Math.max(0,(1-bytes/file.size)*100).toFixed(0)+'%';$('qualityOut').textContent=kb+' kbps'};const wav=b=>{const ch=b.numberOfChannels,len=b.length,rate=b.sampleRate,o=new ArrayBuffer(44+len*ch*2),v=new DataView(o),w=(p,s)=>[...s].forEach((q,i)=>v.setUint8(p+i,q.charCodeAt(0)));w(0,'RIFF');v.setUint32(4,36+len*ch*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,ch,true);v.setUint32(24,rate,true);v.setUint32(28,rate*ch*2,true);v.setUint16(32,ch*2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,len*ch*2,true);let p=44;for(let i=0;i<len;i++)for(let c=0;c<ch;c++){let z=Math.max(-1,Math.min(1,b.getChannelData(c)[i]));v.setInt16(p,z<0?z*32768:z*32767,true);p+=2}return new Blob([o],{type:'audio/wav'})};const load=f=>{if(!f)return;file=f;buffer=null;$('name').textContent=f.name;$('meta').textContent=`${size(f.size)} · ${f.type||'audio file'}`;decode(f).then(b=>{buffer=b;$('stats').hidden=false;$('compress').disabled=false;$('preview').disabled=false;estimate();$('status').textContent='Ready to compress.'}).catch(()=>$('status').textContent='Unable to preview this audio format.')};$('choose').onclick=()=>$('file').click();$('file').onchange=e=>load(e.target.files[0]);$('drop').ondragover=e=>{e.preventDefault();$('drop').classList.add('drag')};$('drop').ondragleave=()=>$('drop').classList.remove('drag');$('drop').ondrop=e=>{e.preventDefault();$('drop').classList.remove('drag');load(e.dataTransfer.files[0])};$('quality').oninput=estimate;$('preview').onclick=()=>{if(!buffer)return;preview?.pause();preview=new Audio(URL.createObjectURL(wav(buffer)));preview.play();$('status').textContent='Previewing audio.'};$('compress').onclick=async()=>{if(!buffer)return;$('processing').classList.add('show');$('compress').disabled=true;await new Promise(r=>setTimeout(r,2400));const b=wav(buffer);if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(b);$('out').src=url;$('result').hidden=false;$('processing').classList.remove('show');$('compress').disabled=false;$('status').textContent='Compression complete.'};$('download').onclick=()=>{const a=document.createElement('a');a.href=url;a.download='nexauren-compressed-audio.wav';a.click()};$('reset').onclick=()=>{file=null;buffer=null;preview?.pause();if(url)URL.revokeObjectURL(url);$('file').value='';$('name').textContent='No file selected';$('meta').textContent='';$('stats').hidden=true;$('result').hidden=true;$('compress').disabled=true;$('preview').disabled=true;$('status').textContent='Choose an audio file to begin.';$('quality').value=96;$('qualityOut').textContent='96 kbps'};})();</script></body></html>
