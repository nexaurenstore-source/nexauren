<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Audio Trimmer — Nexauren</title><link rel="stylesheet" href="/css/nexauren-global.css"><link rel="stylesheet" href="/css/studio.css"><style>.trimmer{display:grid;gap:20px}.drop{border:2px dashed rgba(118,87,255,.35);border-radius:18px;padding:28px;text-align:center}.drop.drag{border-color:#7657ff}.wave{height:190px;border-radius:16px;background:rgba(118,87,255,.06);overflow:hidden}.wave canvas{width:100%;height:100%;display:block}.range{display:grid;gap:12px}.row{display:grid;grid-template-columns:120px 1fr 70px;gap:12px;align-items:center}.row input{width:100%}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{padding:15px;border-radius:14px;background:rgba(118,87,255,.06)}.actions{display:flex;gap:12px;flex-wrap:wrap}.processing{display:none;text-align:center;padding:20px}.processing.show{display:block}.status{text-align:center}@media(max-width:650px){.stats{grid-template-columns:1fr}.row{grid-template-columns:100px 1fr 60px}}</style></head><body class="studio-page audio-trimmer-page"><main class="studio-shell"><a class="studio-back" href="/studios/audio/">← Audio Studio</a><section class="studio-hero"><p class="eyebrow">AUDIO STUDIO</p><h1>Audio Trimmer</h1><p>Quickly remove unwanted audio from the beginning or end of your recording.</p></section><section class="workspace-card trimmer"><div id="drop" class="drop"><input id="file" type="file" accept="audio/*" hidden><button id="choose" class="primary-btn">Choose audio</button><p id="name">No file selected</p><small id="meta"></small></div><div id="wave" class="wave" hidden><canvas id="canvas"></canvas></div><div id="ranges" class="range" hidden><div class="row"><label for="start">Trim start</label><input id="start" type="range" min="0" max="0" step="0.01" value="0"><output id="startOut">0:00</output></div><div class="row"><label for="end">Trim end</label><input id="end" type="range" min="0" max="0" step="0.01" value="0"><output id="endOut">0:00</output></div></div><div id="stats" class="stats" hidden><div class="stat"><small>Original duration</small><br><strong id="original">—</strong></div><div class="stat"><small>Trimmed duration</small><br><strong id="trimmed">—</strong></div><div class="stat"><small>Removed</small><br><strong id="removed">—</strong></div></div><div class="actions"><button id="preview" class="secondary-btn" disabled>Preview selection</button><button id="trim" class="primary-btn" disabled>Trim audio</button><button id="reset" class="secondary-btn">Reset</button></div><p id="status" class="status">Choose an audio file to begin.</p><div id="processing" class="processing"><strong>Trimming your audio…</strong></div><div id="result" hidden><strong>Trimmed audio</strong><audio id="out" controls></audio><br><button id="download" class="primary-btn">Download trimmed audio</button></div></section></main><script src="/js/app.js"></script><script>(()=>{const $=id=>document.getElementById(id);let buffer=null,url=null,preview=null;const fmt=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;const decode=f=>f.arrayBuffer().then(x=>new AudioContext().decodeAudioData(x));const draw=()=>{const c=$('canvas'),x=c.getContext('2d');c.width=c.clientWidth*2;c.height=c.clientHeight*2;const d=buffer.getChannelData(0),step=Math.max(1,Math.floor(d.length/c.width));x.beginPath();for(let i=0;i<c.width;i++){let v=0;for(let j=0;j<step;j++)v=Math.max(v,Math.abs(d[i*step+j]||0));i?x.lineTo(i,c.height/2-v*c.height*.4):x.moveTo(i,c.height/2-v*c.height*.4);x.lineTo(i,c.height/2+v*c.height*.4)}x.stroke()};const update=()=>{if(!buffer)return;let s=+$('start').value,e=+$('end').value;if(e<=s)e=Math.min(buffer.duration,s+.01);$('startOut').textContent=fmt(s);$('endOut').textContent=fmt(e);$('original').textContent=fmt(buffer.duration);$('trimmed').textContent=fmt(e-s);$('removed').textContent=fmt(buffer.duration-(e-s));$('trim').disabled=e<=s};const wav=b=>{const ch=b.numberOfChannels,len=b.length,rate=b.sampleRate,o=new ArrayBuffer(44+len*ch*2),v=new DataView(o),w=(p,s)=>[...s].forEach((q,i)=>v.setUint8(p+i,q.charCodeAt(0)));w(0,'RIFF');v.setUint32(4,36+len*ch*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,ch,true);v.setUint32(24,rate,true);v.setUint32(28,rate*ch*2,true);v.setUint16(32,ch*2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,len*ch*2,true);let p=44;for(let i=0;i<len;i++)for(let c=0;c<ch;c++){let z=Math.max(-1,Math.min(1,b.getChannelData(c)[i]));v.setInt16(p,z<0?z*32768:z*32767,true);p+=2}return new Blob([o],{type:'audio/wav'})};const selection=async()=>{const s=+$('start').value,e=+$('end').value,rate=buffer.sampleRate,frames=Math.max(1,Math.floor((e-s)*rate)),ctx=new OfflineAudioContext(buffer.numberOfChannels,frames,rate),src=ctx.createBufferSource();src.buffer=buffer;src.connect(ctx.destination);src.start(0,s,e);return ctx.startRendering()};const load=f=>{if(!f)return;buffer=null;$('name').textContent=f.name;$('meta').textContent=`${(f.size/1024/1024).toFixed(2)} MB · ${f.type||'audio file'}`;decode(f).then(b=>{buffer=b;$('wave').hidden=false;$('ranges').hidden=false;$('stats').hidden=false;$('start').max=b.duration;$('end').max=b.duration;$('end').value=b.duration;draw();update();$('preview').disabled=false;$('status').textContent='Ready to trim.'}).catch(()=>$('status').textContent='Unable to preview this audio format.')};$('choose').onclick=()=>$('file').click();$('file').onchange=e=>load(e.target.files[0]);$('drop').ondragover=e=>{e.preventDefault();$('drop').classList.add('drag')};$('drop').ondragleave=()=>$('drop').classList.remove('drag');$('drop').ondrop=e=>{e.preventDefault();$('drop').classList.remove('drag');load(e.dataTransfer.files[0])};$('start').oninput=update;$('end').oninput=update;$('preview').onclick=async()=>{if(!buffer)return;preview?.pause();const b=await selection();preview=new Audio(URL.createObjectURL(wav(b)));preview.play();$('status').textContent='Previewing selection.';preview.onended=()=>$('status').textContent='Ready to trim.'};$('trim').onclick=async()=>{if(!buffer)return;$('processing').classList.add('show');$('trim').disabled=true;await new Promise(r=>setTimeout(r,2400));const b=await selection();if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(wav(b));$('out').src=url;$('result').hidden=false;$('processing').classList.remove('show');update();$('status').textContent='Trim complete.'};$('download').onclick=()=>{const a=document.createElement('a');a.href=url;a.download='nexauren-trimmed-audio.wav';a.click()};$('reset').onclick=()=>{buffer=null;preview?.pause();if(url)URL.revokeObjectURL(url);$('file').value='';$('name').textContent='No file selected';$('meta').textContent='';$('wave').hidden=true;$('ranges').hidden=true;$('stats').hidden=true;$('result').hidden=true;$('preview').disabled=true;$('trim').disabled=true;$('status').textContent='Choose an audio file to begin.'};})();</script></body></html>
