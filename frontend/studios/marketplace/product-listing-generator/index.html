<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product Listing Generator — Nexauren</title><meta name="description" content="Build a structured marketplace product listing in your browser."><link rel="stylesheet" href="/studios/audio/studio.css"></head><body><main class="as-page"><div class="as-wrap"><a class="as-crumb" href="/studios/marketplace/">← Marketplace Studio</a><section class="as-hero"><div class="as-hero-copy"><span class="as-kicker">PRODUCT LISTING GENERATOR</span><h1>Structure your listing.</h1><p>Turn product details into a clean title, feature list and listing draft.</p></div></section><section class="as-section"><label>Product name<input id="name" placeholder="Product name" style="width:100%;box-sizing:border-box;padding:12px;margin:6px 0 12px"></label><label>Key features<textarea id="features" placeholder="One feature per line" rows="6" style="width:100%;box-sizing:border-box;padding:12px"></textarea></label><button id="make" style="margin-top:12px">Generate listing</button><pre id="out" style="white-space:pre-wrap;margin-top:18px"></pre></section></div></main><script>const n=document.querySelector('#name'),f=document.querySelector('#features'),o=document.querySelector('#out');document.querySelector('#make').onclick=()=>{const name=n.value.trim()||'Product';const items=f.value.split(/\n+/).map(x=>x.trim()).filter(Boolean);o.textContent=name+'\n\n'+items.map(x=>'• '+x).join('\n')};</script></body></html>
