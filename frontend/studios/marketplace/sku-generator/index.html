<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SKU Generator — Nexauren</title><meta name="description" content="Generate consistent SKU codes from product and variant information."><link rel="stylesheet" href="/studios/audio/studio.css"><script src="/js/ads.js" defer></script>
</head><body><main class="as-page"><div class="as-wrap"><a class="as-crumb" href="/studios/marketplace/">← Marketplace Studio</a><section class="as-hero"><div class="as-hero-copy"><span class="as-kicker">SKU GENERATOR</span><h1>Create consistent SKUs.</h1><p>Build compact, readable SKU codes from product, variant and sequence details.</p></div></section><section class="as-section"><div style="display:grid;gap:10px;max-width:520px"><input id="b" placeholder="Brand / product code"><input id="v" placeholder="Variant"><input id="n" type="number" min="1" value="1" placeholder="Sequence"><button id="make">Generate SKU</button></div><div id="out" style="margin-top:18px;font-size:1.5rem;font-weight:700"></div></section></div></main><script>const $=id=>document.querySelector(id);$('#make').onclick=()=>{const clean=x=>(x.value||'').toUpperCase().replace(/[^A-Z0-9]+/g,'-').replace(/^-|-$/g,'');const b=clean($('#b'))||'PRODUCT',v=clean($('#v'))||'STD',n=String(+$('#n').value||1).padStart(3,'0');$('#out').textContent=b+'-'+v+'-'+n};</script></body></html>
