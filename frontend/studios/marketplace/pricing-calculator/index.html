<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pricing Calculator — Nexauren</title><meta name="description" content="Estimate marketplace pricing from cost, fees, shipping and target margin."><link rel="stylesheet" href="/studios/audio/studio.css"><script src="/js/ads.js" defer></script>
</head><body><main class="as-page"><div class="as-wrap"><a class="as-crumb" href="/studios/marketplace/">← Marketplace Studio</a><section class="as-hero"><div class="as-hero-copy"><span class="as-kicker">PRICING CALCULATOR</span><h1>Price with confidence.</h1><p>Estimate a selling price from costs, marketplace fees and your target margin.</p></div></section><section class="as-section"><div style="display:grid;gap:10px;max-width:520px"><input id="c" type="number" min="0" step="0.01" placeholder="Product cost"><input id="s" type="number" min="0" step="0.01" placeholder="Shipping cost"><input id="f" type="number" min="0" max="100" step="0.1" value="15" placeholder="Marketplace fee %"><input id="m" type="number" min="0" max="99" step="0.1" value="20" placeholder="Target margin %"><button id="calc">Calculate price</button></div><div id="out" style="margin-top:18px;font-size:1.3rem"></div></section></div></main><script>const $=id=>document.querySelector(id);$('#calc').onclick=()=>{const c=+$('#c').value||0,s=+$('#s').value||0,f=(+$('#f').value||0)/100,m=(+$('#m').value||0)/100;const base=c+s;const price=base/(1-f-m);$('#out').textContent=price>0?'Suggested price: '+price.toFixed(2):'Enter your costs and target margin.'};</script></body></html>
