<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product Description Generator — Nexauren</title><meta name="description" content="Create a polished product description draft from concise product details."><link rel="stylesheet" href="/studios/audio/studio.css"><script src="/js/ads.js" defer></script>
</head><body><main class="as-page"><div class="as-wrap"><a class="as-crumb" href="/studios/marketplace/">← Marketplace Studio</a><section class="as-hero"><div class="as-hero-copy"><span class="as-kicker">PRODUCT DESCRIPTION GENERATOR</span><h1>Write clearer descriptions.</h1><p>Turn product facts into a readable, benefit-focused description draft.</p></div></section><section class="as-section"><input id="p" placeholder="Product name" style="width:100%;box-sizing:border-box;padding:12px;margin-bottom:10px"><textarea id="d" placeholder="Describe the product, audience and main benefits" rows="8" style="width:100%;box-sizing:border-box;padding:12px"></textarea><button id="make" style="margin-top:12px">Generate description</button><p id="out" style="white-space:pre-wrap;margin-top:18px"></p></section></div></main><script>const p=document.querySelector('#p'),d=document.querySelector('#d'),o=document.querySelector('#out');document.querySelector('#make').onclick=()=>{const name=p.value.trim()||'This product';const text=d.value.trim()||'A practical choice designed to make everyday use simpler.';o.textContent=name+' — '+text+'\n\nDesigned for customers who value practical features, clear results and an easy experience.'};</script></body></html>
