<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Marketplace Image & Listing Optimizer — Nexauren</title><meta name="description" content="Check marketplace listing basics such as title length, bullets and image readiness."><link rel="stylesheet" href="/studios/audio/studio.css"></head><body><main class="as-page"><div class="as-wrap"><a class="as-crumb" href="/studios/marketplace/">← Marketplace Studio</a><section class="as-hero"><div class="as-hero-copy"><span class="as-kicker">MARKETPLACE OPTIMIZER</span><h1>Polish your listing.</h1><p>Review the fundamentals that make a product listing clearer and easier to scan.</p></div></section><section class="as-section"><input id="t" placeholder="Listing title" style="width:100%;box-sizing:border-box;padding:12px;margin-bottom:10px"><textarea id="b" placeholder="One bullet per line" rows="7" style="width:100%;box-sizing:border-box;padding:12px"></textarea><button id="check" style="margin-top:12px">Check listing</button><div id="out" style="margin-top:18px"></div></section></div></main><script>const t=document.querySelector('#t'),b=document.querySelector('#b'),o=document.querySelector('#out');document.querySelector('#check').onclick=()=>{const bullets=b.value.split(/\n+/).map(x=>x.trim()).filter(Boolean);const checks=[['Title',t.value.trim().length>=20&&t.value.trim().length<=120],['Features',bullets.length>=3],['Image readiness','Add at least one clear product image before publishing']];o.innerHTML=checks.map(x=>`<div style="margin:8px 0">${typeof x[1]==='boolean'?(x[1]?'✓':'•'):''} ${x[0]}${typeof x[1]==='string'?': '+x[1]:''}</div>`).join('')};</script></body></html>
