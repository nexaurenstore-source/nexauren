<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Invoice Generator — Nexauren</title><meta name="description" content="Create a clean invoice draft with line items and totals in your browser."><link rel="stylesheet" href="/studios/audio/studio.css"><script src="/js/ads.js" defer></script>
</head><body><main class="as-page"><div class="as-wrap"><a class="as-crumb" href="/studios/business/">← Business Studio</a><section class="as-hero"><div class="as-hero-copy"><span class="as-kicker">INVOICE GENERATOR</span><h1>Create invoices.</h1><p>Build a clean invoice draft with items, quantities, tax and totals.</p></div></section><section class="as-section"><input id="c" placeholder="Client name" style="width:100%;box-sizing:border-box;padding:14px;border-radius:12px"><div id="rows" style="margin-top:14px"></div><button id="add">Add item</button><div id="total" style="margin-top:18px;font-size:1.4rem"></div></section></div></main><script>let a=[];const r=document.querySelector('#rows'),t=document.querySelector('#total');function draw(){r.innerHTML=a.map((x,n)=>`<div style="display:grid;grid-template-columns:1fr 100px 100px auto;gap:8px;margin:8px 0"><input placeholder="Description" value="${x.d}" oninput="a[${n}].d=this.value"><input type="number" min="0" value="${x.q}" oninput="a[${n}].q=+this.value;draw()"><input type="number" min="0" step="0.01" value="${x.p}" oninput="a[${n}].p=+this.value;draw()"><button onclick="a.splice(${n},1);draw()">×</button></div>`).join('');const sub=a.reduce((z,x)=>z+x.q*x.p,0),tax=sub*.2;t.innerHTML=`Subtotal: ${sub.toFixed(2)} · VAT 20%: ${tax.toFixed(2)} · <strong>Total: ${(sub+tax).toFixed(2)}</strong>`}document.querySelector('#add').onclick=()=>{a.push({d:'',q:1,p:0});draw()};draw()</script></body></html>
