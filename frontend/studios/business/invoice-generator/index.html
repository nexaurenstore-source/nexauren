<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Invoice Generator — Nexauren</title><meta name="description" content="Create a clean invoice draft with line items and totals in your browser."><link rel="stylesheet" href="/studios/audio/studio.css"><script src="/js/ads.js" defer></script><style>.biz-form{display:grid;gap:12px}.biz-field{display:grid;gap:6px}.biz-field input{width:100%;box-sizing:border-box;padding:13px;border-radius:12px;border:1px solid #e5e0ef}.biz-row{display:grid;grid-template-columns:minmax(0,1fr) 100px 120px auto;gap:8px;margin:10px 0}.biz-row input{width:100%;box-sizing:border-box;padding:11px;border-radius:10px;border:1px solid #e5e0ef}.biz-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.biz-actions button,.biz-row button{min-height:42px}.biz-total{margin-top:18px;padding:18px;border-radius:16px;background:#f6f2ff;line-height:1.8}.biz-muted{color:#665f78}@media(max-width:620px){.biz-row{grid-template-columns:1fr 1fr}.biz-row input:first-child{grid-column:1/-1}.biz-row button{grid-column:1/-1}.biz-actions>*{flex:1 1 140px}}@media print{.as-crumb,.as-hero,.biz-actions,.biz-add,.biz-remove{display:none!important}.as-page{padding:0;background:#fff}.as-section{margin-top:0}}</style></head><body><main class="as-page"><div class="as-wrap"><a class="as-crumb" href="/tools/">← Tools</a><section class="as-hero"><div class="as-hero-copy"><span class="as-kicker">BUSINESS</span><h1>Create invoices.</h1><p>Build a clean invoice draft with items, quantities, tax and totals.</p></div></section><section class="as-section"><div class="biz-form"><label class="biz-field">Client name<input id="client" autocomplete="name" placeholder="Client name"></label><label class="biz-field">VAT / tax rate (%)<input id="tax" type="number" min="0" max="100" step="0.1" value="20"></label></div><div id="rows" style="margin-top:14px"></div><div class="biz-actions"><button class="biz-add" id="add" type="button">Add item</button><button id="clear" type="button">Clear</button><button id="print" type="button">Print / Save PDF</button></div><div id="total" class="biz-total" role="status" aria-live="polite"></div></section></div></main><script>let items=[];const rows=document.querySelector('#rows'),total=document.querySelector('#total'),client=document.querySelector('#client'),tax=document.querySelector('#tax');function safe(v){return String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}function draw(){rows.innerHTML=items.map((x,n)=>`<div class="biz-row"><input aria-label="Item ${n+1} description" placeholder="Description" value="${safe(x.d)}" data-field="d" data-index="${n}"><input aria-label="Item ${n+1} quantity" type="number" min="0" step="1" value="${x.q}" data-field="q" data-index="${n}"><input aria-label="Item ${n+1} price" type="number" min="0" step="0.01" value="${x.p}" data-field="p" data-index="${n}"><button class="biz-remove" type="button" data-remove="${n}" aria-label="Remove item ${n+1}">×</button></div>`).join('');const sub=items.reduce((z,x)=>z+(Math.max(0,+x.q||0)*Math.max(0,+x.p||0)),0),rate=Math.min(100,Math.max(0,+tax.value||0)),vat=sub*rate/100;total.innerHTML=`<div>Client: <strong>${safe(client.value)||'—'}</strong></div><div>Subtotal: <strong>${sub.toFixed(2)}</strong></div><div>VAT / tax (${rate.toFixed(1)}%): <strong>${vat.toFixed(2)}</strong></div><div>Total: <strong>${(sub+vat).toFixed(2)}</strong></div>`}document.querySelector('#add').onclick=()=>{items.push({d:'',q:1,p:0});draw()};document.querySelector('#clear').onclick=()=>{items=[];client.value='';tax.value=20;draw()};document.querySelector('#print').onclick=()=>window.print();rows.addEventListener('input',e=>{const i=e.target.dataset.index,f=e.target.dataset.field;if(i!==undefined){items[i][f]=f==='d'?e.target.value:Math.max(0,+e.target.value||0);draw()}});rows.addEventListener('click',e=>{const i=e.target.dataset.remove;if(i!==undefined){items.splice(+i,1);draw()}});client.oninput=draw;tax.oninput=draw;draw()</script><script src="/js/business-i18n.js"></script></body></html>
