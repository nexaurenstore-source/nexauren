<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Business Calculator — Nexauren</title><meta name="description" content="Calculate revenue, costs, margin, profit and break-even with a simple business calculator."><link rel="stylesheet" href="/studios/audio/studio.css"><script src="/js/ads.js" defer></script><style>.calc-grid{display:grid;gap:12px;max-width:520px}.calc-grid label{display:grid;gap:6px}.calc-grid input{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid #e5e0ef}.calc-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.calc-actions button{min-height:42px}.calc-output{margin-top:20px;padding:18px;border-radius:16px;background:#f6f2ff;line-height:1.9}@media(max-width:520px){.calc-actions>*{flex:1 1 140px}}@media print{.as-crumb,.as-hero,.calc-actions{display:none!important}.as-page{padding:0;background:#fff}}</style></head><body><main class="as-page"><div class="as-wrap"><a class="as-crumb" href="/tools/">← Tools</a><section class="as-hero"><div class="as-hero-copy"><span class="as-kicker">BUSINESS</span><h1>Know your numbers.</h1><p>Estimate revenue, costs, profit, margin and break-even from practical inputs.</p></div></section><section class="as-section"><div class="calc-grid"><label>Units sold<input id="u" type="number" value="100" min="0" step="1"></label><label>Price per unit<input id="p" type="number" value="20" min="0" step="0.01"></label><label>Cost per unit<input id="c" type="number" value="8" min="0" step="0.01"></label><label>Fixed costs<input id="f" type="number" value="500" min="0" step="0.01"></label></div><div class="calc-actions"><button id="reset" type="button">Reset</button><button id="copy" type="button">Copy results</button><button id="print" type="button">Print / Save PDF</button></div><div id="o" class="calc-output" role="status" aria-live="polite"></div></section></div></main><script>const ids=['u','p','c','f'],defaults={u:100,p:20,c:8,f:500},out=document.querySelector('#o');function money(v){return v.toFixed(2)}function calc(){const [u,p,c,f]=ids.map(x=>Math.max(0,+document.querySelector('#'+x).value||0)),rev=u*p,variable=u*c,profit=rev-variable-f,margin=rev?profit/rev*100:0,unitContribution=p-c,breakEvenUnits=unitContribution>0?Math.ceil(f/unitContribution):null,breakEvenRevenue=breakEvenUnits===null?null:breakEvenUnits*p,markup=c?((p-c)/c*100):null;out.innerHTML=`<div>Revenue: <strong>${money(rev)}</strong></div><div>Variable costs: <strong>${money(variable)}</strong></div><div>Profit: <strong>${money(profit)}</strong></div><div>Margin: <strong>${margin.toFixed(1)}%</strong></div><div>Markup: <strong>${markup===null?'—':markup.toFixed(1)+'%'}</strong></div><div>Break-even: <strong>${breakEvenUnits===null?'—':breakEvenUnits+' units'}</strong>${breakEvenRevenue===null?'':' · '+money(breakEvenRevenue)+' revenue'}</div>`;return {rev,variable,profit,margin,markup,breakEvenUnits,breakEvenRevenue}}ids.forEach(x=>document.querySelector('#'+x).addEventListener('input',calc));document.querySelector('#reset').onclick=()=>{ids.forEach(x=>document.querySelector('#'+x).value=defaults[x]);calc()};document.querySelector('#copy').onclick=async()=>{const r=calc(),text=`Revenue: ${money(r.rev)}\nVariable costs: ${money(r.variable)}\nProfit: ${money(r.profit)}\nMargin: ${r.margin.toFixed(1)}%\nMarkup: ${r.markup===null?'—':r.markup.toFixed(1)+'%'}\nBreak-even: ${r.breakEvenUnits===null?'—':r.breakEvenUnits+' units'}${r.breakEvenRevenue===null?'':' / '+money(r.breakEvenRevenue)}`;try{await navigator.clipboard.writeText(text);document.querySelector('#copy').textContent='Copied'}catch(e){document.querySelector('#copy').textContent='Copy failed'}setTimeout(()=>document.querySelector('#copy').textContent='Copy results',1400)};document.querySelector('#print').onclick=()=>window.print();calc()</script></body></html>
