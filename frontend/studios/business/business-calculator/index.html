<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Business Calculator — Nexauren</title><meta name="description" content="Calculate revenue, costs, margin and profit with a simple business calculator."><link rel="stylesheet" href="/studios/audio/studio.css"></head><body><main class="as-page"><div class="as-wrap"><a class="as-crumb" href="/studios/business/">← Business Studio</a><section class="as-hero"><div class="as-hero-copy"><span class="as-kicker">BUSINESS CALCULATOR</span><h1>Know your numbers.</h1><p>Estimate revenue, costs, profit and margin from a few practical inputs.</p></div></section><section class="as-section"><div style="display:grid;gap:12px;max-width:520px"><label>Units sold<input id="u" type="number" value="100" min="0" style="width:100%;box-sizing:border-box;padding:12px"></label><label>Price per unit<input id="p" type="number" value="20" min="0" step="0.01" style="width:100%;box-sizing:border-box;padding:12px"></label><label>Cost per unit<input id="c" type="number" value="8" min="0" step="0.01" style="width:100%;box-sizing:border-box;padding:12px"></label><label>Fixed costs<input id="f" type="number" value="500" min="0" step="0.01" style="width:100%;box-sizing:border-box;padding:12px"></label></div><div id="o" style="margin-top:20px;font-size:1.3rem"></div></section></div></main><script>const ids=['u','p','c','f'];function calc(){const [u,p,c,f]=ids.map(x=>+document.querySelector('#'+x).value||0),rev=u*p,profit=rev-u*c-f,margin=rev?profit/rev*100:0;document.querySelector('#o').innerHTML=`Revenue: <strong>${rev.toFixed(2)}</strong><br>Profit: <strong>${profit.toFixed(2)}</strong><br>Margin: <strong>${margin.toFixed(1)}%</strong>`}ids.forEach(x=>document.querySelector('#'+x).oninput=calc);calc()</script></body></html>
