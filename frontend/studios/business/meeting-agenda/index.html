<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meeting Agenda — Nexauren</title><meta name="description" content="Prepare focused meeting agendas with topics, owners and decisions."><link rel="stylesheet" href="/studios/audio/studio.css"><script src="/js/ads.js" defer></script>
</head><body><main class="as-page"><div class="as-wrap"><a class="as-crumb" href="/studios/business/">← Business Studio</a><section class="as-hero"><div class="as-hero-copy"><span class="as-kicker">MEETING AGENDA</span><h1>Meet with purpose.</h1><p>Prepare topics, assign owners and capture the decisions that matter.</p></div></section><section class="as-section"><input id="name" placeholder="Meeting title" style="width:100%;box-sizing:border-box;padding:14px;border-radius:12px"><div id="topics" style="margin-top:14px"></div><button id="add">Add topic</button></section></div></main><script>let a=[];const q=document.querySelector('#topics');function draw(){q.innerHTML=a.map((x,n)=>`<div style="display:grid;grid-template-columns:1fr 160px auto;gap:8px;margin:10px 0"><input placeholder="Topic" value="${x.t}" oninput="a[${n}].t=this.value"><input placeholder="Owner" value="${x.o}" oninput="a[${n}].o=this.value"><button onclick="a.splice(${n},1);draw()">×</button></div>`).join('')}add.onclick=()=>{a.push({t:'',o:''});draw()};draw()</script></body></html>
