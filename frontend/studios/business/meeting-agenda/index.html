<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meeting Agenda — Nexauren</title><meta name="description" content="Prepare focused meeting agendas with topics, owners and decisions."><link rel="stylesheet" href="/studios/audio/studio.css"><script src="/js/ads.js" defer></script><style>.agenda-section{display:grid;gap:12px}.agenda-input{width:100%;box-sizing:border-box;padding:14px;border-radius:12px;border:1px solid #d9dde7;font:inherit}.topic-row{display:grid;grid-template-columns:minmax(0,1fr) 180px auto;gap:8px;margin:10px 0}.topic-row button{min-width:42px}.agenda-actions{display:flex;flex-wrap:wrap;gap:10px}.agenda-actions button{min-height:42px}.agenda-status{min-height:1.4em}.as-crumb:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid currentColor;outline-offset:2px}@media(max-width:640px){.topic-row{grid-template-columns:1fr}.topic-row button{width:100%}.agenda-actions{display:grid;grid-template-columns:1fr}.agenda-actions button{width:100%}}@media print{.as-crumb,.as-hero,.agenda-actions,.agenda-status,#add{display:none!important}.as-page,.as-wrap,.agenda-section{max-width:none!important;margin:0!important;padding:0!important}.agenda-input{border:0;padding:0}}</style></head><body><main class="as-page"><div class="as-wrap"><a class="as-crumb" href="/tools/">← Tools</a><section class="as-hero"><div class="as-hero-copy"><span class="as-kicker">BUSINESS</span><h1>Meet with purpose.</h1><p>Prepare topics, assign owners and capture the decisions that matter.</p></div></section><section class="as-section agenda-section"><label for="name">Meeting title</label><input class="agenda-input" id="name" placeholder="Meeting title" autocomplete="off"><div id="topics"></div><div class="agenda-actions"><button id="add" type="button">Add topic</button><button id="copy" type="button">Copy agenda</button><button id="clear" type="button">Clear</button><button id="print" type="button">Print / Save PDF</button></div><p id="status" class="agenda-status" role="status" aria-live="polite"></p></section></div></main><script>let a=[];const q=document.querySelector('#topics'),name=document.querySelector('#name'),status=document.querySelector('#status');function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function setStatus(t){status.textContent=t}function draw(){q.innerHTML=a.map((x,n)=>`<div class="topic-row"><input class="agenda-input" aria-label="Topic ${n+1}" placeholder="Topic" value="${esc(x.t)}" data-field="t" data-index="${n}"><input class="agenda-input" aria-label="Owner for topic ${n+1}" placeholder="Owner" value="${esc(x.o)}" data-field="o" data-index="${n}"><button type="button" aria-label="Remove topic ${n+1}" data-remove="${n}">×</button></div>`).join('');q.querySelectorAll('input').forEach(el=>el.addEventListener('input',e=>{a[+e.target.dataset.index][e.target.dataset.field]=e.target.value}));q.querySelectorAll('[data-remove]').forEach(el=>el.addEventListener('click',()=>{a.splice(+el.dataset.remove,1);draw()}))}add.onclick=()=>{a.push({t:'',o:''});draw()};copy.onclick=async()=>{const lines=[name.value.trim(),...a.map((x,i)=>`${i+1}. ${x.t.trim()}${x.o.trim()?` — ${x.o.trim()}`:''}`).filter(Boolean)].filter(Boolean);if(!lines.length){setStatus('Nothing to copy.');return}try{await navigator.clipboard.writeText(lines.join('\n'));setStatus('Agenda copied.')}catch(e){setStatus('Copy failed.')}};clear.onclick=()=>{a=[];name.value='';draw();setStatus('Agenda cleared.');name.focus()};print.onclick=()=>{if(!name.value.trim()&&!a.some(x=>x.t.trim()||x.o.trim())){setStatus('Add a meeting title or topic before printing.');return}window.print()};draw()</script><script src="/js/business-i18n.js"></script></body></html>
