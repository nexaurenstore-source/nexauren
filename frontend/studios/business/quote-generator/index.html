<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quote Generator — Nexauren</title><meta name="description" content="Build a professional quote with services, quantities and totals."><link rel="stylesheet" href="/studios/audio/studio.css"><script src="/js/ads.js" defer></script><style>.biz-form{display:grid;gap:12px}.biz-field{display:grid;gap:6px}.biz-field input{width:100%;box-sizing:border-box;padding:13px;border-radius:12px;border:1px solid #e5e0ef}.biz-row{display:grid;grid-template-columns:minmax(0,1fr) 90px 120px auto;gap:8px;margin:10px 0}.biz-row input{width:100%;box-sizing:border-box;padding:11px;border-radius:10px;border:1px solid #e5e0ef}.biz-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.biz-actions button,.biz-row button{min-height:42px}.biz-total{margin-top:18px;padding:18px;border-radius:16px;background:#f6f2ff;line-height:1.8}.biz-status{color:#665f78}@media(max-width:620px){.biz-row{grid-template-columns:1fr 1fr}.biz-row input:first-child{grid-column:1/-1}.biz-row button{grid-column:1/-1}.biz-actions>*{flex:1 1 140px}}@media print{.as-crumb,.as-hero,.biz-actions,.biz-add,.biz-remove{display:none!important}.as-page{padding:0;background:#fff}}</style></head><body><main class="as-page"><div class="as-wrap"><a class="as-crumb" href="/tools/">← Tools</a><section class="as-hero"><div class="as-hero-copy"><span class="as-kicker">BUSINESS</span><h1>Price with clarity.</h1><p>Create a service quote with quantities, unit prices and an adjustable tax estimate.</p></div></section><section class="as-section"><div class="biz-form"><label class="biz-field">Customer name<input id="customer" autocomplete="name" placeholder="Customer name"></label><label class="biz-field">Tax rate (%)<input id="tax" type="number" min="0" max="100" step="0.1" value="0"></label></div><div id="rows" style="margin-top:14px"></div><div class="biz-actions"><button class="biz-add" id="add" type="button">Add service</button><button id="clear" type="button">Clear</button><button id="print" type="button">Print / Save PDF</button></div><div id="out" class="biz-total biz-status" role="status" aria-live="polite"></div></section></div></main><script>let items=[];const rows=document.querySelector('#rows'),out=document.querySelector('#out'),customer=document.querySelector('#customer'),tax=document.querySelector('#tax');function safe(v){return String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}function draw(){rows.innerHTML=items.map((x,n)=>`<div class="biz-row"><input aria-label="Service ${n+1}" placeholder="Service" value="${safe(x.d)}" data-field="d" data-index="${n}"><input aria-label="Service ${n+1} quantity" type="number" min="1" step="1" value="${Math.max(1,+x.q||1)}" data-field="q" data-index="${n}"><input aria-label="Service ${n+1} unit price" type="number" min="0" step="0.01" value="${Math.max(0,+x.p||0)}" data-field="p" data-index="${n}"><button class="biz-remove" type="button" data-remove="${n}" aria-label="Remove service ${n+1}">×</button></div>`).join('');const sub=items.reduce((z,x)=>z+Math.max(1,+x.q||1)*Math.max(0,+x.p||0),0),rate=Math.min(100,Math.max(0,+tax.value||0)),amount=sub*rate/100;out.innerHTML=`<div>Customer: <strong>${safe(customer.value)||'—'}</strong></div><div>Subtotal: <strong>${sub.toFixed(2)}</strong></div><div>Tax (${rate.toFixed(1)}%): <strong>${amount.toFixed(2)}</strong></div><div>Total: <strong>${(sub+amount).toFixed(2)}</strong></div>`}document.querySelector('#add').onclick=()=>{items.push({d:'',q:1,p:0});draw()};document.querySelector('#clear').onclick=()=>{items=[];customer.value='';tax.value=0;draw()};document.querySelector('#print').onclick=()=>window.print();rows.addEventListener('input',e=>{const i=e.target.dataset.index,f=e.target.dataset.field;if(i!==undefined){items[i][f]=f==='d'?e.target.value:Math.max(f==='q'?1:0,+e.target.value||0);draw()}});rows.addEventListener('click',e=>{const i=e.target.dataset.remove;if(i!==undefined){items.splice(+i,1);draw()}});customer.oninput=draw;tax.oninput=draw;draw()</script></body></html>
