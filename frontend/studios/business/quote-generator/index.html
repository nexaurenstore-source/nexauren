<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quote Generator — Nexauren</title><meta name="description" content="Build a professional quote with services, quantities and totals."><link rel="stylesheet" href="/studios/audio/studio.css"></head><body><main class="as-page"><div class="as-wrap"><a class="as-crumb" href="/studios/business/">← Business Studio</a><section class="as-hero"><div class="as-hero-copy"><span class="as-kicker">QUOTE GENERATOR</span><h1>Price with clarity.</h1><p>Create a simple service quote with quantities, unit prices and a tax estimate.</p></div></section><section class="as-section"><input id="c" placeholder="Customer name" style="width:100%;box-sizing:border-box;padding:14px;border-radius:12px"><div id="rows"></div><button id="add">Add service</button><div id="out" style="margin-top:18px"></div></section></div></main><script>let a=[];const rows=document.querySelector('#rows'),out=document.querySelector('#out');function draw(){rows.innerHTML=a.map((x,n)=>`<div style="display:grid;grid-template-columns:1fr 90px 100px auto;gap:8px;margin:10px 0"><input placeholder="Service" value="${x.d}" oninput="a[${n}].d=this.value"><input type="number" min="1" value="${x.q}" oninput="a[${n}].q=+this.value;draw()"><input type="number" min="0" step="0.01" value="${x.p}" oninput="a[${n}].p=+this.value;draw()"><button onclick="a.splice(${n},1);draw()">×</button></div>`).join('');const s=a.reduce((z,x)=>z+x.q*x.p,0);out.innerHTML=`Estimated subtotal: <strong>${s.toFixed(2)}</strong>`}add.onclick=()=>{a.push({d:'',q:1,p:0});draw()};draw()</script></body></html>
