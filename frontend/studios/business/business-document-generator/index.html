<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Business Document Generator — Nexauren</title><meta name="description" content="Draft professional business documents from a title and structured content."><link rel="stylesheet" href="/studios/audio/studio.css"><script src="/js/ads.js" defer></script><style>.as-section{display:grid;gap:12px}.doc-input,.doc-body{width:100%;box-sizing:border-box;padding:14px;border-radius:12px;border:1px solid #d9dde7;font:inherit}.doc-body{padding:18px;resize:vertical}.doc-actions{display:flex;flex-wrap:wrap;gap:10px}.doc-actions button{min-height:42px}.doc-status{min-height:1.4em}.as-crumb:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid currentColor;outline-offset:2px}@media(max-width:640px){.doc-actions{display:grid;grid-template-columns:1fr}.doc-actions button{width:100%}}@media print{.as-crumb,.as-hero,.doc-actions,.doc-status{display:none!important}.as-page,.as-wrap,.as-section{max-width:none!important;margin:0!important;padding:0!important}.doc-input,.doc-body{border:0;padding:0}.doc-body{min-height:70vh}}</style></head><body><main class="as-page"><div class="as-wrap"><a class="as-crumb" href="/tools/">← Tools</a><section class="as-hero"><div class="as-hero-copy"><span class="as-kicker">BUSINESS</span><h1>Draft professionally.</h1><p>Turn structured notes into a clean business document ready to copy or print.</p></div></section><section class="as-section"><label for="title">Document title</label><input class="doc-input" id="title" placeholder="Document title" autocomplete="off"><label for="body">Document content</label><textarea class="doc-body" id="body" rows="14" placeholder="Write your content…"></textarea><div class="doc-actions"><button id="copy" type="button">Copy</button><button id="clear" type="button">Clear</button><button id="print" type="button">Print / Save PDF</button></div><p id="status" class="doc-status" role="status" aria-live="polite"></p></section></div></main><script>const title=document.querySelector('#title'),body=document.querySelector('#body'),status=document.querySelector('#status');function setStatus(t){status.textContent=t}copy.onclick=async()=>{const text=[title.value.trim(),body.value.trim()].filter(Boolean).join('\n\n');if(!text){setStatus('Nothing to copy.');return}try{await navigator.clipboard.writeText(text);setStatus('Document copied.')}catch(e){setStatus('Copy failed. Please select the text manually.')}};clear.onclick=()=>{title.value='';body.value='';setStatus('Document cleared.');title.focus()};print.onclick=()=>{if(!title.value.trim()&&!body.value.trim()){setStatus('Add content before printing.');return}window.print()};</script></body></html>
