<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment status — Nexauren</title><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/nexauren-redesign.css"></head><body><header id="site-header"></header><main class="nx-page"><section class="nx-hero"><div class="nx-container"><span class="nx-eyebrow">Nexauren Billing</span><h1 id="title">Payment received.</h1><p id="status">Your return page never grants credits. The backend verifies the payment and updates your account independently.</p><div class="nx-actions"><a class="nx-button nx-button-primary" href="/billing/">Open Billing</a><a class="nx-button" href="/dashboard/">Dashboard</a></div></div></section></main><footer id="site-footer"></footer><script src="/js/app.js" defer></script><script>
(async function(){
 const title=document.getElementById('title'),status=document.getElementById('status');
 const reference=new URL(location.href).searchParams.get('reference');
 if(!reference){status.textContent='Payment reference not present. Open Billing to see the current account state.';return;}
 async function check(){try{const res=await fetch('/api/billing/payment?reference='+encodeURIComponent(reference),{credentials:'include'});const data=await res.json();if(!res.ok)throw new Error(data.error||'Unable to check payment status.');const p=data.payment||{};if(p.status==='successful'){title.textContent='Payment confirmed.';status.textContent=p.type==='credit_purchase'?'The backend has confirmed your payment. Your credits are now available in Billing.':'The backend has confirmed your subscription payment. Your subscription will appear in Billing after the subscription webhook lifecycle is synchronized.';return true}if(p.status==='failed'||p.status==='cancelled'){title.textContent='Payment not completed.';status.textContent='The backend did not confirm this payment. No credits were granted from this page.';return true}title.textContent='Payment pending.';status.textContent='PayPal has not yet been confirmed by the Nexauren backend. This page does not grant credits. We will keep checking for a short time.';return false}catch(e){status.textContent=e.message||'Unable to check payment status.';return false}}
 let done=await check();let attempts=0;const timer=setInterval(async()=>{if(done||++attempts>=12){clearInterval(timer);return}done=await check()},5000);
})();
</script></body></html>
