<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment status — Nexauren</title><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/nexauren-redesign.css"></head><body><header id="site-header"></header><main class="nx-page"><section class="nx-hero"><div class="nx-container"><span class="nx-eyebrow">Nexauren Billing</span><h1 id="title">Confirming payment…</h1><p id="status">We are securely verifying your PayPal payment with the Nexauren backend. This page never grants credits by itself.</p><div class="nx-actions"><a class="nx-button nx-button-primary" href="/billing/">Open Billing</a><a class="nx-button" href="/dashboard/">Dashboard</a></div></div></section></main><footer id="site-footer"></footer><script src="/js/app.js" defer></script><script>
(async function(){
 const title=document.getElementById('title'),status=document.getElementById('status');
 const reference=new URL(location.href).searchParams.get('reference');
 if(!reference){title.textContent='Payment reference missing.';status.textContent='Open Billing to see the current account state. No credits were granted from this page.';return;}
 async function verify(){try{
  const res=await fetch('/api/billing/payment',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({reference})});
  const data=await res.json().catch(()=>({})); const p=data.payment||{};
  if(res.ok && p.status==='successful'){title.textContent='Payment confirmed.';status.textContent=p.type==='credit_purchase'?'The backend confirmed your payment and finalized your credit purchase. Your credits are now available in Billing.':'The backend confirmed your payment. Your subscription will appear in Billing after its provider lifecycle is synchronized.';return true;}
  if(res.status===409){title.textContent='Payment pending.';status.textContent=data.error||'PayPal has not yet confirmed the payment. We will keep checking automatically.';return false;}
  if(res.status===404){title.textContent='Payment not found.';status.textContent=data.error||'The payment reference could not be found. No credits were granted.';return true;}
  throw new Error(data.error||'Unable to verify the payment.');
 }catch(e){title.textContent='Payment verification in progress.';status.textContent=e.message||'Unable to verify the payment right now. We will retry automatically.';return false;}}
 let done=await verify();let attempts=0;const timer=setInterval(async()=>{if(done||++attempts>=12){clearInterval(timer);return;}done=await verify();},5000);
})();
</script></body></html>
