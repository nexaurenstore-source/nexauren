<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Users — Nexauren Admin</title><link rel="stylesheet" href="/admin/style.css"><style>.actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.action-btn{border:1px solid var(--border);background:var(--card,#fff);color:var(--text);border-radius:9px;padding:7px 9px;font:inherit;font-size:12px;font-weight:700;cursor:pointer}.action-btn:hover{border-color:var(--primary);color:var(--primary)}.action-btn.danger:hover{border-color:#dc2626;color:#dc2626}.action-btn:disabled{opacity:.5;cursor:not-allowed}.modal{position:fixed;inset:0;background:rgba(15,23,42,.48);display:none;align-items:center;justify-content:center;padding:18px;z-index:50}.modal.show{display:flex}.modal-card{width:min(620px,100%);background:var(--card,#fff);border:1px solid var(--border);border-radius:18px;box-shadow:0 24px 70px rgba(0,0,0,.2);overflow:hidden}.modal-head{display:flex;justify-content:space-between;align-items:flex-start;padding:20px;border-bottom:1px solid var(--border)}.modal-head h2{margin:0 0 4px}.modal-head p{margin:0;color:var(--text-soft,#6b7280);font-size:13px}.modal-close{border:0;background:transparent;font-size:25px;cursor:pointer;color:var(--text)}.details{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:20px}.detail{border:1px solid var(--border);border-radius:12px;padding:12px}.detail.full{grid-column:1/-1}.detail span{display:block;color:var(--text-soft,#6b7280);font-size:11px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}.detail strong{word-break:break-word}.modal-actions{display:flex;justify-content:flex-end;gap:8px;padding:0 20px 20px}.menu{position:relative}.menu-panel{display:none;position:absolute;right:0;top:calc(100% + 5px);min-width:160px;background:var(--card,#fff);border:1px solid var(--border);border-radius:12px;box-shadow:0 14px 35px rgba(0,0,0,.12);padding:5px;z-index:20}.menu.open .menu-panel{display:block}.menu-item{display:block;width:100%;border:0;background:transparent;text-align:left;padding:9px 10px;border-radius:8px;font:inherit;font-size:12px;font-weight:700;cursor:pointer}.menu-item:hover{background:rgba(99,91,255,.08);color:var(--primary)}@media(max-width:650px){.details{grid-template-columns:1fr}.detail.full{grid-column:auto}.modal-actions{flex-direction:column}.modal-actions .action-btn{width:100%}}</style></head><body><div class="app-shell"><header class="topbar"><a class="brand" href="/admin/"><span class="brand-mark">N</span><span><strong>NEXAUREN</strong><small>ADMIN CONSOLE</small></span></a><div class="top-actions"><span class="secure-pill">● Administrator</span><a class="refresh" href="/admin/">← Dashboard</a></div></header><main><section class="hero"><div><p class="eyebrow">ADMINISTRATION / PEOPLE</p><h1>Users</h1><p id="status">Loading users…</p></div><div class="hero-glow"></div></section><section class="panel"><div class="panel-heading"><div><h2>All users</h2><p class="panel-subtitle">Search and inspect registered Nexauren accounts.</p></div><form id="searchForm" class="toolbar"><label class="search-box"><span>⌕</span><input id="search" type="search" autocomplete="off" placeholder="Search username or email…"></label><button id="searchBtn" type="submit" class="refresh">Search</button><button id="clearBtn" type="button" class="refresh secondary" hidden>Clear</button></form></div><div class="table-wrap"><table><thead><tr><th>User</th><th>Email</th><th>Joined</th><th>XP</th><th>Level</th><th>Last access</th><th>Actions</th></tr></thead><tbody id="rows"><tr><td colspan="7" class="empty">Loading users…</td></tr></tbody></table></div><div class="pager"><button id="prev" class="refresh" type="button">← Previous</button><span id="page">Page 1</span><button id="next" class="refresh" type="button">Next →</button></div></section></main><div id="toast" class="toast"></div><div id="userModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-card"><div class="modal-head"><div><h2 id="modalTitle">User details</h2><p id="modalSubtitle">Account information</p></div><button id="modalClose" class="modal-close" type="button" aria-label="Close">×</button></div><div id="details" class="details"><div class="detail full"><span>Loading</span><strong>Loading user details…</strong></div></div><div class="modal-actions"><button id="modalSignout" class="action-btn" type="button">Sign out</button><button id="modalReset" class="action-btn" type="button">Reset password</button></div></div></div><script>const $=id=>document.getElementById(id);let page=1;const limit=20;let controller=null;let selectedUser=null;function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function date(v){if(!v)return '—';const n=Number(v);if(!Number.isFinite(n))return esc(v);return new Date((n<100000000000?n*1000:n)).toLocaleString()}function toast(msg){$('toast').textContent=msg;$('toast').classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').classList.remove('show'),3500)}function setBusy(b){$('searchBtn').disabled=b;$('prev').disabled=b||page<=1;$('next').disabled=b}function closeMenus(){document.querySelectorAll('.menu.open').forEach(x=>x.classList.remove('open'))}function openModal(){closeMenus();$('userModal').classList.add('show')}function closeModal(){$('userModal').classList.remove('show');selectedUser=null}async function viewUser(id){selectedUser=id;openModal();$('modalTitle').textContent='User details';$('modalSubtitle').textContent=id;$('details').innerHTML='<div class="detail full"><span>Loading</span><strong>Loading user details…</strong></div>';try{const r=await fetch('/api/admin/users/'+encodeURIComponent(id)+'/details',{credentials:'include',cache:'no-store',headers:{Accept:'application/json'}});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Unable to load user details.');const u=d.user||{};const p=d.progress||{};const s=d.sessions||{};$('modalTitle').textContent=u.username||u.email||'User details';$('modalSubtitle').textContent=u.email||u.id||'';$('details').innerHTML='<div class="detail full"><span>User ID</span><strong>'+esc(u.id)+'</strong></div><div class="detail"><span>Username</span><strong>'+esc(u.username||'—')+'</strong></div><div class="detail"><span>Email</span><strong>'+esc(u.email||'—')+'</strong></div><div class="detail"><span>XP</span><strong>'+Number(p.xp||0).toLocaleString()+'</strong></div><div class="detail"><span>Level</span><strong>'+esc(p.level||1)+'</strong></div><div class="detail"><span>Joined</span><strong>'+date(u.created_at)+'</strong></div><div class="detail"><span>Updated</span><strong>'+date(u.updated_at)+'</strong></div><div class="detail"><span>Active sessions</span><strong>'+Number(s.active||0)+'</strong></div><div class="detail"><span>Last access</span><strong>'+date(s.last_access)+'</strong></div>'}catch(e){$('details').innerHTML='<div class="detail full"><span>Error</span><strong>'+esc(e.message)+'</strong></div>'}}async function action(id,type,label){if(!id)return;if(type==='revoke-sessions'&&id===window.__adminId){toast('You cannot revoke your own admin session.');return}if(!confirm(label+'? This action affects the selected account.'))return;try{const r=await fetch('/api/admin/users/'+encodeURIComponent(id)+'/'+type,{method:'POST',credentials:'include',headers:{Accept:'application/json'}});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Action failed.');toast(d.message||'Action completed successfully.');if(selectedUser===id&&type==='revoke-sessions')viewUser(id)}catch(e){toast(e.message)}}function rowHTML(u){const id=String(u.id||'');const safeId=esc(id);return '<tr><td><strong>'+esc(u.username||u.email||id)+'</strong><br><small>'+safeId+'</small></td><td>'+esc(u.email||'—')+'</td><td>'+date(u.created_at)+'</td><td>'+Number(u.xp||0).toLocaleString()+'</td><td>'+esc(u.level||1)+'</td><td>'+date(u.last_access||u.last_login)+'</td><td><div class="actions"><button class="action-btn" type="button" onclick="viewUser('+JSON.stringify(id)+')">View</button><div class="menu"><button class="action-btn" type="button" onclick="this.parentElement.classList.toggle(\'open\');event.stopPropagation()">⋮</button><div class="menu-panel"><button class="menu-item" type="button" onclick="viewUser('+JSON.stringify(id)+')">View profile</button><button class="menu-item" type="button" onclick="action('+JSON.stringify(id)+',\'revoke-sessions\',\'Revoke all sessions\')">Sign out all sessions</button><button class="menu-item" type="button" onclick="action('+JSON.stringify(id)+',\'reset-password\',\'Send password reset\')">Reset password</button></div></div></div></td></tr>'}async function load(){if(controller)controller.abort();controller=new AbortController();const q=$('search').value.trim();$('status').textContent=q?'Searching…':'Loading users…';$('rows').innerHTML='<tr><td colspan="7" class="empty">'+(q?'Searching users…':'Loading users…')+'</td></tr>';setBusy(true);try{const params=new URLSearchParams({page:String(page),limit:String(limit)});if(q)params.set('q',q);const r=await fetch('/api/admin/users?'+params,{credentials:'include',cache:'no-store',signal:controller.signal});const d=await r.json().catch(()=>({}));if(r.status===401||r.status===403){$('status').textContent='Administrator access required.';$('rows').innerHTML='<tr><td colspan="7" class="empty">You do not have administrator access.</td></tr>';return}if(!r.ok)throw new Error(d.error||'Unable to load users.');const rows=Array.isArray(d.users)?d.users:Array.isArray(d.results)?d.results:[];$('rows').innerHTML=rows.length?rows.map(rowHTML).join(''):'<tr><td colspan="7" class="empty">'+(q?'No users match “'+esc(q)+'”.':'No users found.')+'</td></tr>';$('page').textContent='Page '+page;$('status').textContent=(d.total!=null?Number(d.total).toLocaleString()+' users':rows.length+' users shown');$('prev').disabled=page<=1;$('next').disabled=rows.length<limit;$('clearBtn').hidden=!q}catch(e){if(e.name!=='AbortError'){$('status').textContent=e.message;$('rows').innerHTML='<tr><td colspan="7" class="empty">Unable to load users.</td></tr>'}}finally{setBusy(false)}}$('searchForm').addEventListener('submit',e=>{e.preventDefault();page=1;load()});$('clearBtn').onclick=()=>{$('search').value='';page=1;load()};$('prev').onclick=()=>{if(page>1){page--;load()}};$('next').onclick=()=>{page++;load()};$('modalClose').onclick=closeModal;$('userModal').addEventListener('click',e=>{if(e.target===$('userModal'))closeModal()});document.addEventListener('click',e=>{if(!e.target.closest('.menu'))closeMenus()});$('modalSignout').onclick=()=>selectedUser&&action(selectedUser,'revoke-sessions','Revoke all sessions');$('modalReset').onclick=()=>selectedUser&&action(selectedUser,'reset-password','Send password reset');load();</script></body></html>
