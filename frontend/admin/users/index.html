<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Users — Nexauren Admin</title><link rel="stylesheet" href="/admin/style.css"></head><body><div class="app-shell"><header class="topbar"><a class="brand" href="/admin/"><span class="brand-mark">N</span><span><strong>NEXAUREN</strong><small>ADMIN CONSOLE</small></span></a><div class="top-actions"><span class="secure-pill">● Administrator</span><a class="refresh" href="/admin/">← Dashboard</a></div></header><main><section class="hero"><div><p class="eyebrow">ADMINISTRATION / PEOPLE</p><h1>Users</h1><p id="status">Loading users…</p></div><div class="hero-glow"></div></section><section class="panel"><div class="panel-heading"><div><h2>All users</h2><p class="panel-subtitle">Search and inspect registered Nexauren accounts.</p></div><form id="searchForm" class="toolbar"><label class="search-box"><span>⌕</span><input id="search" type="search" autocomplete="off" placeholder="Search username or email…"></label><button id="searchBtn" type="submit" class="refresh">Search</button><button id="clearBtn" type="button" class="refresh secondary" hidden>Clear</button></form></div><div class="table-wrap"><table><thead><tr><th>User</th><th>Email</th><th>Joined</th><th>XP</th><th>Level</th><th>Last access</th></tr></thead><tbody id="rows"><tr><td colspan="6" class="empty">Loading users…</td></tr></tbody></table></div><div class="pager"><button id="prev" class="refresh" type="button">← Previous</button><span id="page">Page 1</span><button id="next" class="refresh" type="button">Next →</button></div></section></main><div id="toast" class="toast"></div><script>const $=id=>document.getElementById(id);let page=1;const limit=20;let controller=null;function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function date(v){if(!v)return '—';const n=Number(v);if(!Number.isFinite(n))return esc(v);return new Date((n<100000000000?n*1000:n)).toLocaleString()}function setBusy(b){$('searchBtn').disabled=b;$('prev').disabled=b||page<=1;$('next').disabled=b}async function load(){if(controller)controller.abort();controller=new AbortController();const q=$('search').value.trim();$('status').textContent=q?'Searching…':'Loading users…';$('rows').innerHTML='<tr><td colspan="6" class="empty">'+(q?'Searching users…':'Loading users…')+'</td></tr>';setBusy(true);try{const params=new URLSearchParams({page:String(page),limit:String(limit)});if(q)params.set('q',q);const r=await fetch('/api/admin/users?'+params,{credentials:'include',cache:'no-store',signal:controller.signal});const d=await r.json().catch(()=>({}));if(r.status===401||r.status===403){$('status').textContent='Administrator access required.';$('rows').innerHTML='<tr><td colspan="6" class="empty">You do not have administrator access.</td></tr>';return}if(!r.ok)throw new Error(d.error||'Unable to load users.');const rows=Array.isArray(d.users)?d.users:Array.isArray(d.results)?d.results:[];$('rows').innerHTML=rows.length?rows.map(u=>'<tr><td><strong>'+esc(u.username||u.email||u.id)+'</strong><br><small>'+esc(u.id)+'</small></td><td>'+esc(u.email||'—')+'</td><td>'+date(u.created_at)+'</td><td>'+Number(u.xp||0).toLocaleString()+'</td><td>'+esc(u.level||1)+'</td><td>'+date(u.last_access||u.last_login)+'</td></tr>').join(''):'<tr><td colspan="6" class="empty">'+(q?'No users match “'+esc(q)+'”.':'No users found.')+'</td></tr>';$('page').textContent='Page '+page;$('status').textContent=(d.total!=null?Number(d.total).toLocaleString()+' users':rows.length+' users shown');$('prev').disabled=page<=1;$('next').disabled=rows.length<limit;$('clearBtn').hidden=!q}catch(e){if(e.name!=='AbortError'){$('status').textContent=e.message;$('rows').innerHTML='<tr><td colspan="6" class="empty">Unable to load users.</td></tr>'}}finally{setBusy(false)}}$('searchForm').addEventListener('submit',e=>{e.preventDefault();page=1;load()});$('clearBtn').onclick=()=>{$('search').value='';page=1;load()};$('prev').onclick=()=>{if(page>1){page--;load()}};$('next').onclick=()=>{page++;load()};load();</script></body></html>
