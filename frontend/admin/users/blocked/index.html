<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blocked Users — Nexauren Admin</title><link rel="stylesheet" href="/admin/style.css"><style>main{max-width:1200px;margin:auto}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.search{background:#111b31;border:1px solid #33415f;color:#fff;border-radius:9px;padding:9px 12px;min-width:260px}.action{border:1px solid #33415f;background:#17233b;color:#fff;border-radius:9px;padding:8px 11px;font-weight:700;cursor:pointer}.action:hover{border-color:#7ea7ff}.danger{border-color:rgba(245,107,181,.35)}.table-wrap{overflow:auto}.empty{text-align:center;padding:30px;color:#94a3b8}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:rgba(245,107,181,.12);color:#ffd8ed;border:1px solid rgba(245,107,181,.3);font-size:11px;font-weight:700}.toast{position:fixed;right:20px;bottom:20px;background:#111b31;color:#fff;border:1px solid #33415f;border-radius:10px;padding:12px 15px;opacity:0;transition:.2s}.toast.show{opacity:1}</style></head><body><div class="app-shell"><header class="topbar"><a class="brand" href="/admin/"><span class="brand-mark">N</span><span><strong>NEXAUREN</strong><small>ADMIN CONSOLE</small></span></a><div class="top-actions"><span class="secure-pill">● Administrator</span><a class="refresh" href="/admin/users/">← Users</a></div></header><main><section class="hero"><div><p class="eyebrow">ADMINISTRATION / SECURITY</p><h1>Blocked users</h1><p id="status">Loading blocked users…</p></div><div class="hero-glow"></div></section><section class="panel"><div class="panel-heading"><div><h2>Blocked accounts</h2><p class="panel-subtitle">Accounts currently prevented from signing in.</p></div><form id="form" class="toolbar"><input id="q" class="search" type="search" placeholder="Search username or email…"><button class="action" type="submit">Search</button><button id="clear" class="action" type="button">Clear</button></form></div><div class="table-wrap"><table><thead><tr><th>User</th><th>Email</th><th>Blocked</th><th>XP</th><th>Level</th><th>Action</th></tr></thead><tbody id="rows"><tr><td colspan="6" class="empty">Loading…</td></tr></tbody></table></div><div class="pager"><button id="prev" class="refresh" type="button">← Previous</button><span id="page">Page 1</span><button id="next" class="refresh" type="button">Next →</button></div></section></main><div id="toast" class="toast"></div><script>const $=id=>document.getElementById(id);let page=1;const limit=50;function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function date(v){if(!v)return'—';const n=Number(v),d=new Date(n<100000000000?n*1000:n);return Number.isNaN(d.getTime())?'—':d.toLocaleString()}function toast(m){$('toast').textContent=m;$('toast').classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').classList.remove('show'),3000)}async function load(){const q=$('q').value.trim();$('status').textContent='Loading…';$('rows').innerHTML='<tr><td colspan="6" class="empty">Loading…</td></tr>';try{const p=new URLSearchParams({page:String(page),limit:String(limit)});if(q)p.set('q',q);const r=await fetch('/api/admin/users/blocked?'+p,{credentials:'include',cache:'no-store',headers:{Accept:'application/json'}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Unable to load blocked users.');const users=Array.isArray(d.users)?d.users:[];$('rows').innerHTML=users.length?users.map(u=>'<tr><td><strong>'+esc(u.username||u.email||u.id)+'</strong><br><small>'+esc(u.id)+'</small></td><td>'+esc(u.email||'—')+'</td><td><span class="badge">Blocked '+date(u.blocked_at)+'</span></td><td>'+Number(u.xp||0).toLocaleString()+'</td><td>'+esc(u.level||1)+'</td><td><button class="action danger" data-id="'+esc(u.id)+'">Unblock</button></td></tr>').join(''):'<tr><td colspan="6" class="empty">No blocked users.</td></tr>';$('status').textContent=Number(d.total||0).toLocaleString()+' blocked user'+(Number(d.total||0)===1?'':'s');$('page').textContent='Page '+page;$('prev').disabled=page<=1;$('next').disabled=users.length<limit}catch(e){$('status').textContent=e.message;$('rows').innerHTML='<tr><td colspan="6" class="empty">Unable to load blocked users.</td></tr>'}}document.addEventListener('click',async e=>{const b=e.target.closest('[data-id]');if(!b)return;if(!confirm('Unblock this user?'))return;b.disabled=true;try{const r=await fetch('/api/admin/users/'+encodeURIComponent(b.dataset.id)+'/unblock',{method:'POST',credentials:'include',headers:{Accept:'application/json'}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Unblock failed.');toast(d.message||'User unblocked.');load()}catch(err){toast('Error: '+err.message);b.disabled=false}});$('form').onsubmit=e=>{e.preventDefault();page=1;load()};$('clear').onclick=()=>{$('q').value='';page=1;load()};$('prev').onclick=()=>{if(page>1){page--;load()}};$('next').onclick=()=>{page++;load()};load();</script></body></html>
