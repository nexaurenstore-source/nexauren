<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nexauren Admin · Blog</title><link rel="stylesheet" href="/admin/style.css"><style>.blog-toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:18px}.btn{border:1px solid var(--line);color:#fff;background:#121a2e;border-radius:10px;padding:10px 14px;cursor:pointer}.btn.primary{background:linear-gradient(135deg,#4f8cff,#9b6cff);border:0}.btn.danger{background:#3a1118;border-color:#6b2530;color:#ffb4bd}.form{display:grid;gap:14px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:grid;gap:7px}.field label{font-size:11px;color:#8fa0ba;font-weight:700;text-transform:uppercase;letter-spacing:.08em}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:10px;background:#0b1325;color:#fff;padding:11px;outline:0}.field textarea{min-height:260px;resize:vertical}.actions{display:flex;gap:8px;justify-content:flex-end}.hidden{display:none!important}.status{padding:5px 9px;border-radius:999px;font-size:10px}.published{color:#8ff0b9;background:rgba(53,208,127,.08)}.draft{color:#ffd28a;background:rgba(255,155,74,.08)}.image-box{border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:12px}.image-actions{display:flex;gap:8px;flex-wrap:wrap}.image-preview{display:none;width:100%;max-height:300px;object-fit:cover;border-radius:12px}.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}.gallery button{padding:0;border:1px solid var(--line);background:#0b1325;border-radius:10px;overflow:hidden;cursor:pointer}.gallery img{display:block;width:100%;height:90px;object-fit:cover}.gallery small{display:block;padding:6px;color:#8fa0ba;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}@media(max-width:700px){.form-grid{grid-template-columns:1fr}.blog-toolbar{align-items:stretch;flex-direction:column}}</style></head><body><div class="app-shell"><header class="topbar"><a class="brand" href="/admin/"><span class="brand-mark">N</span><span><strong>NEXAUREN</strong><small>ADMIN CONSOLE · BLOG</small></span></a><div class="top-actions"><a class="refresh secondary" href="/admin/">← Admin</a></div></header><main><section class="hero"><div><p class="eyebrow">CONTENT MANAGEMENT</p><h1>Blog</h1><p>Crie, edite e publique artigos do Nexauren.</p></div></section><section class="panel"><div class="blog-toolbar"><div><h2 id="panelTitle">Artigos</h2><p class="panel-subtitle">Gerencie os conteúdos publicados e rascunhos.</p></div><button class="btn primary" id="newPost">+ Novo artigo</button></div><div id="list"><div class="table-wrap"><table><thead><tr><th>Título</th><th>Categoria</th><th>Status</th><th>Data</th><th>Ações</th></tr></thead><tbody id="posts"><tr><td colspan="5" class="empty">Carregando artigos…</td></tr></tbody></table></div></div><div id="editor" class="hidden"><form class="form" id="postForm"><div class="form-grid"><div class="field"><label>Título</label><input id="title" required maxlength="180"></div><div class="field"><label>Slug</label><input id="slug" maxlength="180"></div></div><div class="form-grid"><div class="field"><label>Categoria</label><select id="category"></select></div><div class="field"><label>Autor</label><input id="author" value="Nexauren" maxlength="100"></div></div><div class="field"><label>Resumo</label><textarea id="excerpt" style="min-height:100px"></textarea></div><div class="field"><label>Conteúdo</label><textarea id="content" required></textarea></div><div class="image-box"><label>Imagem de capa</label><img id="imagePreview" class="image-preview" alt="Pré-visualização"><div class="image-actions"><label class="btn primary" for="imagePicker">📱 Escolher da galeria</label><input id="imagePicker" type="file" accept="image/*" hidden><button type="button" class="btn" id="showGallery">🖼️ Imagens usadas</button></div><div id="gallery" class="gallery hidden"></div><input id="cover_image" placeholder="URL da imagem" readonly></div><div class="form-grid"><div class="field"><label>Imagem Open Graph</label><input id="og_image" placeholder="Será a capa por padrão"></div><div class="field"><label>SEO title</label><input id="seo_title" maxlength="180"></div></div><div class="field"><label>Meta description</label><input id="meta_description" maxlength="300"></div><div class="form-grid"><div class="field"><label>Status</label><select id="status"><option value="draft">Rascunho</option><option value="published">Publicado</option></select></div><div class="field"><label>Destaque</label><select id="featured"><option value="0">Não</option><option value="1">Sim</option></select></div></div><div class="actions"><button type="button" class="btn danger hidden" id="deletePost">Eliminar artigo</button><button type="button" class="btn" id="cancel">Cancelar</button><button type="submit" class="btn primary">Salvar artigo</button></div></form></div></section></main><div id="toast" class="toast"></div></div><script src="/admin/blog/script.js"></script></body></html>
