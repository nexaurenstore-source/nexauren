<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nexauren Admin — Notifications</title>
<link rel="stylesheet" href="/admin/style.css">
<style>
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.toolbar input,.toolbar select{padding:11px 12px;border:1px solid #ddd;border-radius:10px;background:#fff}.toolbar input{flex:1;min-width:180px}.table-wrap{overflow:auto}.admin-table{width:100%;border-collapse:collapse;min-width:760px}.admin-table th,.admin-table td{padding:12px;border-bottom:1px solid #eee;text-align:left;vertical-align:top}.admin-table th{font-size:12px;text-transform:uppercase;letter-spacing:.04em}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#f1f1f1;font-size:12px}.muted{color:#777}.empty{text-align:center;padding:30px;color:#777}.error{padding:12px;border-radius:10px;background:#fff1f1;color:#a11}.pagination{display:flex;justify-content:space-between;align-items:center;margin-top:15px;gap:10px}.pagination button{padding:9px 13px;border:1px solid #ddd;border-radius:9px;background:#fff}
</style>
</head>
<body>
<header class="topbar"><div><strong>NEXAUREN</strong><span>Admin</span></div><a href="/admin/" style="color:inherit;text-decoration:none">Dashboard</a></header>
<main>
<section class="hero"><div><p class="eyebrow">ADMINISTRATION</p><h1>Notifications</h1><p id="status">Loading notifications…</p></div></section>
<section class="cards">
<article><span>Total</span><strong id="total">—</strong></article>
<article><span>Unread</span><strong id="unread">—</strong></article>
<article><span>Announcements</span><strong id="announcements">—</strong></article>
</section>
<section class="panel">
<div class="toolbar"><input id="q" type="search" placeholder="Search title, message or type…"><select id="type"><option value="">All types</option><option value="form_response">form_response</option><option value="new_tool">new_tool</option><option value="new_feature">new_feature</option><option value="update">update</option><option value="achievement">achievement</option><option value="announcement">announcement</option><option value="important">important</option></select><button id="refresh">Refresh</button></div>
<div id="message"></div><div class="table-wrap"><table class="admin-table"><thead><tr><th>Title</th><th>Message</th><th>Type</th><th>State</th><th>Date</th></tr></thead><tbody id="rows"></tbody></table></div>
<div class="pagination"><button id="prev">Previous</button><span id="page">Page 1</span><button id="next">Next</button></div>
</section>
</main>
<script>
const $=id=>document.getElementById(id);let page=1;const limit=25;
async function load(){
 $('status').textContent='Loading notifications…';$('message').innerHTML='';$('rows').innerHTML='<tr><td colspan="5" class="empty">Loading…</td></tr>';
 const params=new URLSearchParams({page,limit});if($('q').value.trim())params.set('q',$('q').value.trim());if($('type').value)params.set('type',$('type').value);
 try{const r=await fetch('/api/admin/notifications?'+params,{credentials:'include',headers:{Accept:'application/json'}});const data=await r.json().catch(()=>({}));if(r.status===401||r.status===403){$('status').textContent='Administrator access required.';return}if(!r.ok)throw new Error(data.error||'Unable to load notifications.');
 const items=Array.isArray(data.notifications)?data.notifications:(Array.isArray(data.items)?data.items:[]);const total=Number(data.total??items.length);$('total').textContent=total.toLocaleString();$('unread').textContent=Number(data.unread??0).toLocaleString();$('announcements').textContent=Number(data.announcements??items.filter(x=>x.type==='announcement').length).toLocaleString();
 $('rows').innerHTML=items.length?items.map(n=>'<tr><td><strong>'+esc(n.title||'Untitled')+'</strong></td><td>'+esc(n.message||'')+'</td><td><span class="badge">'+esc(n.type||'')+'</span></td><td>'+esc(n.status||n.state||'')+'</td><td class="muted">'+fmt(n.created_at||n.createdAt||n.date)+'</td></tr>').join(''):'<tr><td colspan="5" class="empty">No notifications found.</td></tr>';
 $('page').textContent='Page '+page;$('prev').disabled=page<=1;$('next').disabled=items.length<limit;$('status').textContent='Administrator access verified.';
 }catch(e){$('rows').innerHTML='';$('message').innerHTML='<div class="error">'+esc(e.message)+'</div>';$('status').textContent='Unable to load notifications.'}
}
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function fmt(v){if(!v)return '—';const d=new Date(v);return isNaN(d)?esc(v):d.toLocaleString()}
let timer; $('q').addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(()=>{page=1;load()},300)});$('type').addEventListener('change',()=>{page=1;load()});$('refresh').addEventListener('click',load);$('prev').addEventListener('click',()=>{if(page>1){page--;load()}});$('next').addEventListener('click',()=>{page++;load()});load();
</script>
</body></html>
