<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Activity — Nexauren Admin</title><link rel="stylesheet" href="/admin/style.css"></head><body><div class="app-shell"><header class="topbar"><a class="brand" href="/admin/"><span class="brand-mark">N</span><span><strong>NEXAUREN</strong><small>ADMIN CONSOLE</small></span></a><div class="top-actions"><span class="secure-pill">● Administrator</span><a class="refresh" href="/admin/">← Dashboard</a></div></header><main><section class="hero"><div><p class="eyebrow">ADMINISTRATION / ACTIVITY</p><h1>Activity</h1><p id="status">Loading activity…</p></div><div class="hero-glow"></div></section><section class="panel"><div class="panel-heading"><div><h2>Recent activity</h2><p class="panel-subtitle">Activity already recorded by Nexauren.</p></div><button id="refresh" class="refresh">↻ Refresh</button></div><div class="table-wrap"><table><thead><tr><th>Action</th><th>Tool</th><th>Details</th><th>Date</th></tr></thead><tbody id="rows"><tr><td colspan="4" class="empty">Loading activity…</td></tr></tbody></table></div></section></main><script>const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=v=>{if(!v)return'—';const d=new Date(v);return Number.isNaN(d.getTime())?esc(v):d.toLocaleString()};const read=(k,f=[])=>{try{const v=JSON.parse(localStorage.getItem(k)||'null');return Array.isArray(v)?v:f}catch{return f}};function render(){const a=read('nexauren_activity').slice().reverse();$('rows').innerHTML=a.length?a.map(x=>'<tr><td><strong>'+esc(x.title||x.type||'Activity')+'</strong></td><td>'+esc(x.name||x.toolId||'—')+'</td><td>'+esc(x.url||'—')+'</td><td>'+fmt(x.time)+'</td></tr>').join(''):'<tr><td colspan="4" class="empty">No activity recorded in this browser yet.</td></tr>';$('status').textContent=a.length?a.length+' recorded events':'No recorded activity'}$('refresh').onclick=render;window.addEventListener('storage',render);window.addEventListener('nexauren:activity',render);render();</script></body></html>
