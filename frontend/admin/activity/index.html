<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Activity — Nexauren Admin</title><link rel="stylesheet" href="/admin/style.css"></head><body><div class="app-shell"><header class="topbar"><a class="brand" href="/admin/"><span class="brand-mark">N</span><span><strong>NEXAUREN</strong><small>ADMIN CONSOLE</small></span></a><div class="top-actions"><span class="secure-pill">● Administrator</span><a class="refresh" href="/admin/">← Dashboard</a></div></header><main><section class="hero"><div><p class="eyebrow">ADMINISTRATION / ACTIVITY</p><h1>Activity</h1><p id="status">Loading recent activity…</p></div><div class="hero-glow"></div></section><section class="panel"><div class="panel-heading"><div><h2>Recent activity</h2><p class="panel-subtitle">A live view of important platform actions.</p></div><button id="refresh" class="refresh">↻ Refresh</button></div><div class="table-wrap"><table><thead><tr><th>Action</th><th>User</th><th>Details</th><th>Date</th></tr></thead><tbody id="rows"><tr><td colspan="4" class="empty">Loading activity…</td></tr></tbody></table></div></section></main><script>const $=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function date(v){if(!v)return '—';const n=Number(v);if(!Number.isFinite(n))return esc(v);return new Date(n<100000000000?n*1000:n).toLocaleString()}async function load(){ $('status').textContent='Loading recent activity…';$('rows').innerHTML='<tr><td colspan="4" class="empty">Loading activity…</td></tr>';try{const r=await fetch('/api/admin/activity',{credentials:'include',cache:'no-store'});const d=await r.json().catch(()=>({}));if(r.status===401||r.status===403){$('status').textContent='Administrator access required.';$('rows').innerHTML='<tr><td colspan="4" class="empty">You do not have administrator access.</td></tr>';return}if(!r.ok)throw new Error(d.error||'Unable to load activity.');const items=Array.isArray(d.activity)?d.activity:Array.isArray(d.activities)?d.activities:Array.isArray(d.results)?d.results:[];$('rows').innerHTML=items.length?items.map(a=>'<tr><td><strong>'+esc(a.action||a.type||'Activity')+'</strong></td><td>'+esc(a.username||a.email||a.user_id||'—')+'</td><td>'+esc(a.details||a.message||a.tool||'—')+'</td><td>'+date(a.created_at||a.timestamp||a.date)+'</td></tr>').join(''):'<tr><td colspan="4" class="empty">No recent activity.</td></tr>';$('status').textContent=items.length+' recent '+(items.length===1?'event':'events')}catch(e){$('status').textContent=e.message;$('rows').innerHTML='<tr><td colspan="4" class="empty">Unable to load activity.</td></tr>'}}$('refresh').onclick=load;load();</script></body></html>
