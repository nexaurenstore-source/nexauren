<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Nexauren account dashboard."
    >

    <meta
        name="theme-color"
        content="#08080d"
    >

    <title>Dashboard — Nexauren</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>

<body>

<header class="site-header">

    <nav class="navigation">

        <a
            href="index.html"
            class="brand"
            aria-label="Nexauren Home"
        >
            <span class="brand-mark">N</span>
            <span class="brand-name">Nexauren</span>
        </a>

        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="pages/tools.html">
                Tools
            </a>

            <button
                type="button"
                id="logout-button"
            >
                Logout
            </button>

        </div>

    </nav>

</header>


<main class="auth-page">

    <section class="auth-container">

        <div class="auth-header">

            <div class="auth-icon">
                N
            </div>

            <span class="auth-badge">
                Nexauren Account
            </span>

            <h1 id="dashboard-title">
                Welcome
            </h1>

            <p id="dashboard-email">
                Loading your account...
            </p>

        </div>


        <div
            id="dashboard-message"
            class="auth-message"
            role="alert"
            aria-live="polite"
        ></div>


        <div class="auth-form">

            <div class="form-group">

                <label>
                    Account status
                </label>

                <div>
                    Signed in
                </div>

            </div>


            <button
                type="button"
                id="logout-button-main"
                class="auth-submit"
            >
                Sign out
            </button>

        </div>

    </section>

</main>


<script
    src="js/dashboard.js"
    defer
></script>

</body>

                </html>
