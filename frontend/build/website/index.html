<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Website Builder — Nexauren</title><meta name="description" content="Create websites with simple pages and sections. Builder data stays in your browser session."><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/build/website/builder.css"></head><body class="wb-body"><div class="wb-app"><header class="wb-top"><button class="wb-back" id="backBtn">← Back</button><div class="wb-brand">Nexauren <span>Website Builder</span></div><div class="wb-page-picker"><span>Page</span><select id="pagePicker" aria-label="Current page"></select></div><div class="wb-spacer"></div><div class="wb-device" aria-label="Preview device"><button data-device="desktop" class="active">Desktop</button><button data-device="tablet">Tablet</button><button data-device="mobile">Mobile</button></div><button id="previewBtn" class="wb-ghost">Preview</button><button id="exportBtn" class="wb-primary">Export HTML</button></header><main class="wb-main"><aside class="wb-panel left"><div class="panel-heading"><h2>Pages</h2><span class="hint">Your site</span></div><p class="wb-help">Create pages, then build each one with simple sections. No drag-and-drop.</p><div id="pageList" class="page-list"></div><button id="addPageBtn" class="add-page">＋ Create page</button><hr><div class="panel-heading"><h2>Sections</h2><span class="hint">Current page</span></div><div id="sectionList" class="section-list"></div><button id="addSectionBtn" class="add-section">＋ Add section</button></aside><section class="canvas-wrap"><div id="canvas" class="canvas"></div></section><aside id="propertiesPanel" class="wb-panel right"><div id="properties"></div></aside></main></div><div id="sectionModal" class="modal-bg"><div class="modal"><div class="modal-head"><div><h3>Add section</h3><p class="modal-sub">Choose a ready-made section, then choose its design.</p></div><button id="closeSectionModal" class="wb-ghost">Close</button></div><div id="sectionOptions"></div></div></div><div id="pageModal" class="modal-bg"><div class="modal small"><div class="modal-head"><h3>Create page</h3><button id="closePageModal" class="wb-ghost">Close</button></div><div class="field"><label>Page name</label><input id="newPageName" placeholder="About, Services, Contact..."></div><button id="createPage" class="wb-primary">Create page</button></div></div><div id="pageSettingsModal" class="modal-bg"><div class="modal small"><div class="modal-head"><div><h3>Page settings</h3><p class="modal-sub">This only changes the current browser session.</p></div><button id="closePageSettings" class="wb-ghost">Close</button></div><div class="field"><label>Page name</label><input id="pageName"></div><div class="field"><label>URL path</label><input id="pageSlug" placeholder="/about"></div><div class="modal-actions"><button id="duplicatePage" class="wb-ghost">Duplicate</button><button id="deletePage" class="wb-danger">Delete</button><span class="action-spacer"></span><button id="savePageSettings" class="wb-primary">Save</button></div></div></div><div id="toast" class="toast"></div><script src="/build/website/page-builder-v2.js" defer></script><script src="/build/website/section-design-editor.js" defer></script><script src="/build/website/visual-controls.js" defer></script><script src="/build/website/integration-center.js" defer></script><script src="/build/website/integration-center-backend.js" defer></script></body></html>
