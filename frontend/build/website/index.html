<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Website Builder — Nexauren</title><meta name="description" content="Create websites with simple pages and sections. Builder data stays in your browser."><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/build/website/builder.css"></head><body class="wb-body"><div class="wb-app"><header class="wb-top"><button class="wb-back" id="backBtn">← Back</button><div class="wb-brand">Nexauren</div><div class="wb-page-picker"><span>Page</span><select id="pagePicker" aria-label="Current page"></select></div><div class="wb-spacer"></div><div class="wb-device"><button data-device="desktop" class="active">Desktop</button><button data-device="tablet">Tablet</button><button data-device="mobile">Mobile</button></div><button id="previewBtn" class="wb-ghost">Preview</button><button id="exportBtn" class="wb-primary">Export</button></header><main class="wb-main"><aside class="wb-panel left"><h2>Pages</h2><p class="wb-help">Create pages first. Each page is made from simple sections.</p><div id="pageList" class="page-list"></div><button id="addPageBtn" class="add-page">＋ Create page</button><hr><h2>Sections</h2><div id="sectionList" class="section-list"></div><button id="addSectionBtn" class="add-section">＋ Add section</button></aside><section class="canvas-wrap"><div id="canvas" class="canvas"></div></section><aside id="propertiesPanel" class="wb-panel right"><div id="properties"></div></aside></main></div><div id="sectionModal" class="modal-bg"><div class="modal"><div class="modal-head"><h3>Add section</h3><button id="closeSectionModal" class="wb-ghost">Close</button></div><div id="sectionOptions" class="options"></div></div></div><div id="pageModal" class="modal-bg"><div class="modal"><div class="modal-head"><h3>Create page</h3><button id="closePageModal" class="wb-ghost">Close</button></div><div class="field"><label>Page name</label><input id="newPageName" placeholder="About, Services, Contact..."></div><button id="createPage" class="wb-primary">Create page</button></div></div><div id="toast" class="toast"></div><script src="/build/website/builder.js" defer></script></body></html>
