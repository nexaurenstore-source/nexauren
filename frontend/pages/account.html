<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Account | Nexauren</title><meta name="description" content="Create and manage your Nexauren account."><link rel="stylesheet" href="../css/style.css"><style>main{min-height:70vh;padding:64px 20px}.auth{max-width:520px;margin:auto;background:#fff;border:1px solid #e8e8ef;border-radius:24px;padding:32px;box-shadow:0 20px 60px #00000012}.tabs{display:flex;gap:8px;margin-bottom:24px}.tabs button{flex:1;padding:12px;border:0;border-radius:12px;background:#f2f3f8;cursor:pointer}.tabs .active{background:#635bff;color:#fff}.field{display:grid;gap:7px;margin:14px 0}.field input{padding:13px;border:1px solid #ddd;border-radius:12px;font:inherit}.primary{width:100%;padding:14px;border:0;border-radius:12px;background:#635bff;color:#fff;font-weight:700;cursor:pointer}.danger{margin-top:28px;padding-top:20px;border-top:1px solid #eee}.danger button{padding:11px;border:1px solid #e33;border-radius:10px;background:#fff;color:#c22}.message{min-height:24px;margin:12px 0}.hidden{display:none}</style></head><body><div id="site-header"></div><main><section class="auth"><h1>Minha conta</h1><p>Entre ou crie sua conta Nexauren.</p><div class="tabs"><button id="login-tab" class="active">Entrar</button><button id="register-tab">Criar conta</button></div><form id="auth-form"><div id="name-field" class="field hidden"><label for="name">Nome</label><input id="name" autocomplete="name"></div><div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required></div><div class="field"><label for="password">Senha</label><input id="password" type="password" minlength="8" autocomplete="current-password" required></div><button class="primary" id="submit" type="submit">Entrar</button><div id="message" class="message" role="status"></div></form><section id="danger" class="danger hidden"><h2>Área de perigo</h2><p>Desativar sua conta ou iniciar a eliminação permanente.</p><button id="deactivate" type="button">Desativar conta</button><button id="delete" type="button">Eliminar conta</button></section></section></main><div id="site-footer"></div><script src="../js/app.js" defer></script><script src="../js/auth.js" defer></script></body></html>
