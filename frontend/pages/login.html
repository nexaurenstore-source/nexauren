<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="description" content="Sign in to your Nexauren account."><meta name="theme-color" content="#08080d"><title>Sign In — Nexauren</title><link rel="stylesheet" href="/css/style.css"></head><body><header class="site-header"><nav class="navigation"><a href="/" class="brand" aria-label="Nexauren Home"><span class="brand-mark">N</span><span class="brand-name">Nexauren</span></a><div class="nav-links"><a href="/">Home</a><a href="/tools/">Tools</a><a href="/register" class="nav-login">Create account</a></div></nav></header><main class="auth-page"><section class="auth-container"><div class="auth-header"><div class="auth-icon">N</div><span class="auth-badge">Nexauren Account</span><h1>Welcome back</h1><p>Sign in to continue to your Nexauren account.</p></div><form id="login-form" class="auth-form" novalidate><div class="form-group"><label for="email">Email</label><input type="email" id="email" name="email" autocomplete="email" maxlength="254" placeholder="you@example.com" required><small class="form-error" id="email-error"></small></div><div class="form-group"><div class="form-label-row"><label for="password">Password</label><span class="form-hint">Use your Nexauren account password.</span></div><input type="password" id="password" name="password" autocomplete="current-password" maxlength="200" placeholder="Enter your password" required><small class="form-error" id="password-error"></small></div><div id="login-message" class="auth-message" role="alert" aria-live="polite"></div><button type="submit" id="login-button" class="auth-submit">Sign in</button></form><div class="auth-footer"><span>Don't have an account?</span><a href="/register">Create account</a></div></section></main><script src="/js/login.js" defer></script></body></html>
