<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Create your Nexauren account."
    >

    <meta
        name="theme-color"
        content="#08080d"
    >

    <title>Create Account — Nexauren</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

    <style>
        /* =====================================================
           REGISTER PAGE
           ===================================================== */

        .auth-page {
            min-height: calc(100vh - 76px);

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 70px 20px;

            position: relative;
            overflow: hidden;
        }

        .auth-glow {
            position: absolute;

            width: 420px;
            height: 420px;

            border-radius: 50%;

            background: var(--nx-primary);

            filter: blur(130px);

            opacity: 0.11;

            pointer-events: none;
        }

        .auth-glow-one {
            top: -180px;
            left: -150px;
        }

        .auth-glow-two {
            right: -180px;
            bottom: -180px;
        }

        .auth-container {
            position: relative;
            z-index: 2;

            width: 100%;
            max-width: 460px;
        }

        .auth-card {
            padding: 42px;

            border: 1px solid var(--nx-border);
            border-radius: 26px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255, 255, 255, 0.045),
                    rgba(255, 255, 255, 0.015)
                );

            box-shadow:
                0 30px 100px rgba(0, 0, 0, 0.25);

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .auth-heading {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-heading .brand-mark {
            width: 46px;
            height: 46px;

            margin: 0 auto 20px;

            border-radius: 14px;

            font-size: 1.15rem;
        }

        .auth-heading h1 {
            font-size: 2.25rem;

            line-height: 1;

            letter-spacing: -0.055em;
        }

        .auth-heading p {
            margin-top: 12px;

            color: var(--nx-text-muted);

            font-size: 0.9rem;
        }

        .auth-form {
            display: flex;
            flex-direction: column;

            gap: 17px;
        }

        .form-group {
            display: flex;
            flex-direction: column;

            gap: 8px;
        }

        .form-label {
            color: var(--nx-text-soft);

            font-size: 0.82rem;
            font-weight: 650;
        }

        .form-input {
            width: 100%;

            height: 50px;

            padding: 0 15px;

            border: 1px solid var(--nx-border);
            border-radius: 12px;

            outline: none;

            background:
                rgba(255, 255, 255, 0.035);

            color: var(--nx-text);

            font: inherit;

            transition:
                border-color var(--nx-transition),
                background var(--nx-transition),
                box-shadow var(--nx-transition);
        }

        .form-input::placeholder {
            color: #5f5f6c;
        }

        .form-input:focus {
            border-color:
                rgba(124, 92, 255, 0.7);

            background:
                rgba(124, 92, 255, 0.045);

            box-shadow:
                0 0 0 4px
                rgba(124, 92, 255, 0.08);
        }

        .password-hint {
            color: var(--nx-text-muted);

            font-size: 0.72rem;

            line-height: 1.5;
        }

        .terms {
            display: flex;
            align-items: flex-start;

            gap: 10px;

            margin-top: 2px;

            color: var(--nx-text-muted);

            font-size: 0.74rem;

            line-height: 1.5;
        }

        .terms input {
            width: 16px;
            height: 16px;

            flex: 0 0 auto;

            margin-top: 1px;

            accent-color: var(--nx-primary);
        }

        .terms a {
            color: var(--nx-primary-light);
        }

        .terms a:hover {
            text-decoration: underline;
        }

        .auth-submit {
            width: 100%;

            min-height: 50px;

            margin-top: 4px;

            cursor: pointer;

            border-radius: 12px;

            color: #ffffff;

            background:
                linear-gradient(
                    135deg,
                    var(--nx-primary),
                    #6548df
                );

            font-weight: 750;

            box-shadow:
                0 12px 35px
                rgba(124, 92, 255, 0.22);

            transition:
                transform var(--nx-transition),
                box-shadow var(--nx-transition);
        }

        .auth-submit:hover {
            transform: translateY(-2px);

            box-shadow:
                0 16px 42px
                rgba(124, 92, 255, 0.32);
        }

        .auth-login {
            margin-top: 25px;

            text-align: center;

            color: var(--nx-text-muted);

            font-size: 0.85rem;
        }

        .auth-login a {
            color: var(--nx-primary-light);

            font-weight: 700;
        }

        .auth-login a:hover {
            text-decoration: underline;
        }

        .back-home {
            display: block;

            margin-top: 22px;

            text-align: center;

            color: var(--nx-text-muted);

            font-size: 0.78rem;
        }

        .back-home:hover {
            color: var(--nx-text);
        }

        @media (max-width: 620px) {

            .auth-page {
                min-height: calc(100vh - 68px);

                padding: 40px 14px;
            }

            .auth-card {
                padding: 30px 22px;

                border-radius: 22px;
            }

            .auth-heading h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>

<body>

    <!-- =====================================================
         HEADER
         ===================================================== -->

    <header class="site-header">

        <nav class="navigation">

            <a
                href="../index.html"
                class="brand"
                aria-label="Nexauren Home"
            >
                <span class="brand-mark">N</span>

                <span class="brand-name">
                    Nexauren
                </span>
            </a>

            <div class="nav-links">

                <a href="../index.html#tools">
                    Tools
                </a>

                <a href="../index.html#categories">
                    Categories
                </a>

                <a
                    href="login.html"
                    class="nav-login"
                >
                    Sign in
                </a>

            </div>

        </nav>

    </header>


    <!-- =====================================================
         REGISTER
         ===================================================== -->

    <main class="auth-page">

        <div class="auth-glow auth-glow-one"></div>
        <div class="auth-glow auth-glow-two"></div>

        <div class="auth-container">

            <section class="auth-card">

                <div class="auth-heading">

                    <div class="brand-mark">
                        N
                    </div>

                    <h1>
                        Create your account
                    </h1>

                    <p>
                        Join Nexauren and start exploring.
                    </p>

                </div>


                <form
                    class="auth-form"
                    action="#"
                    method="post"
                >

                    <!-- NAME -->

                    <div class="form-group">

                        <label
                            class="form-label"
                            for="name"
                        >
                            Name
                        </label>

                        <input
                            class="form-input"
                            id="name"
                            name="name"
                            type="text"
                            autocomplete="name"
                            maxlength="100"
                            placeholder="Your name"
                            required
                        >

                    </div>


                    <!-- EMAIL -->

                    <div class="form-group">

                        <label
                            class="form-label"
                            for="email"
                        >
                            Email
                        </label>

                        <input
                            class="form-input"
                            id="email"
                            name="email"
                            type="email"
                            autocomplete="email"
                            maxlength="254"
                            placeholder="you@example.com"
                            required
                        >

                    </div>


                    <!-- PASSWORD -->

                    <div class="form-group">

                        <label
                            class="form-label"
                            for="password"
                        >
                            Password
                        </label>

                        <input
                            class="form-input"
                            id="password"
                            name="password"
                            type="password"
                            autocomplete="new-password"
                            minlength="8"
                            maxlength="200"
                            placeholder="Create a password"
                            required
                        >

                        <span class="password-hint">
                            Use at least 8 characters.
                        </span>

                    </div>


                    <!-- CONFIRM PASSWORD -->

                    <div class="form-group">

                        <label
                            class="form-label"
                            for="confirm-password"
                        >
                            Confirm password
                        </label>

                        <input
                            class="form-input"
                            id="confirm-password"
                            name="confirm_password"
                            type="password"
                            autocomplete="new-password"
                            minlength="8"
                            maxlength="200"
                            placeholder="Repeat your password"
                            required
                        >

                    </div>


                    <!-- TERMS -->

                    <label class="terms">

                        <input
                            type="checkbox"
                            name="terms"
                            required
                        >

                        <span>
                            I agree to the
                            <a href="#">
                                Terms of Service
                            </a>
                            and
                            <a href="#">
                                Privacy Policy
                            </a>.
                        </span>

                    </label>


                    <!-- SUBMIT -->

                    <button
                        class="auth-submit"
                        type="submit"
                    >
                        Create account
                    </button>

                </form>


                <p class="auth-login">

                    Already have an account?

                    <a href="login.html">
                        Sign in
                    </a>

                </p>

            </section>


            <a
                href="../index.html"
                class="back-home"
            >
                ← Back to Nexauren
            </a>

        </div>

    </main>


    <!-- =====================================================
         FOOTER
         ===================================================== -->

    <footer class="site-footer">

        <div class="footer-content">

            <a
                href="../index.html"
                class="brand footer-brand"
            >
                <span class="brand-mark">N</span>

                <span class="brand-name">
                    Nexauren
                </span>
            </a>

            <p>
                Simple tools. Powerful possibilities.
            </p>

            <span class="footer-copy">
                © 2026 Nexauren.
            </span>

        </div>

    </footer>

</body>
  </html>
