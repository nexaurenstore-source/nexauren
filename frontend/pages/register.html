<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Criar conta | Nexauren</title><meta name="description" content="Crie sua conta Nexauren."><link rel="stylesheet" href="../css/style.css"></head><body><div id="site-header"></div><main class="auth-page"><section class="auth-card"><span>✨</span><h1>Criar conta</h1><p>Crie sua conta para sincronizar sua experiência Nexauren.</p><form id="register-form"><label>Nome<input id="name" autocomplete="name" maxlength="80" required></label><label>Email<input id="email" type="email" autocomplete="email" required></label><label>Senha<input id="password" type="password" autocomplete="new-password" minlength="8" required></label><label>Confirmar senha<input id="confirm-password" type="password" autocomplete="new-password" minlength="8" required></label><button type="submit">Criar conta</button><p id="message" role="status"></p></form><p>Já tem conta? <a href="/pages/login.html">Entrar</a></p></section></main><div id="site-footer"></div><script src="../js/app.js" defer></script><script src="../js/register.js" defer></script></body></html>
