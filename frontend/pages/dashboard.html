<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Nexauren Dashboard"
    >

    <title>Nexauren — Dashboard</title>

    <link
        rel="stylesheet"
        href="/css/style.css"
    >

    <link
        rel="stylesheet"
        href="/css/dashboard.css"
    >

</head>


<body>

    <div
        class="page-transition"
        aria-hidden="true"
    ></div>


    <header>

        <nav>

            <a
                href="/"
                class="logo"
            >
                NEXAUREN
            </a>


            <div class="nav-links">

                <a href="/">
                    Home
                </a>

                <button
                    id="logout-button"
                    type="button"
                    class="nav-logout"
                >
                    Sign Out
                </button>

            </div>

        </nav>

    </header>


    <main class="dashboard-page">

        <section class="dashboard-hero">

            <div class="dashboard-hero-content">

                <div
                    id="account-status"
                    class="status"
                >
                    Checking session...
                </div>


                <h1>
                    Your Dashboard
                </h1>


                <p>
                    Explore Nexauren through
                    categories built for creativity
                    and digital work.
                </p>

            </div>

        </section>


        <section class="dashboard-categories">

            <div class="section-title">

                <h2>
                    Categories
                </h2>

                <p>
                    Choose a category to explore.
                </p>

            </div>


            <div
                id="categories-grid"
                class="categories-grid"
            >

                <div
                    class="card"
                    style="text-align:center;"
                >

                    <h3>
                        Checking session...
                    </h3>

                    <p>
                        Please wait.
                    </p>

                </div>

            </div>

        </section>

    </main>


    <footer>

        <p>
            © 2026 Nexauren.
            All rights reserved.
        </p>

    </footer>


    <script
        src="/js/app.js"
        defer
    ></script>


    <script
        src="/js/dashboard.js"
        defer
    ></script>

</body>

</html>
