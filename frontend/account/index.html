<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Account — Nexauren</title><meta name="description" content="View your Nexauren account, level, XP and achievements."><link rel="canonical" href="https://nexaurenstory.com/account/"><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/menu.css"><style>.account{max-width:900px;margin:60px auto;padding:24px}.account-card{padding:28px;border:1px solid var(--border,#ddd);border-radius:20px;background:var(--card,#fff)}.account-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin:22px 0}.account-stat{padding:18px;border:1px solid var(--border,#ddd);border-radius:14px}.account-stat strong{display:block;font-size:28px}.account-stat span{color:var(--text-soft,#687080)}.progress{margin:22px 0}.progress-head{display:flex;justify-content:space-between;gap:12px;margin-bottom:8px;font-weight:700}.progress-track{height:10px;border-radius:999px;background:var(--border,#e4e6ee);overflow:hidden}.progress-fill{height:100%;width:0;border-radius:999px;background:var(--primary,#635bff);transition:width .35s ease}.account-actions{display:flex;gap:10px;flex-wrap:wrap}.account-actions button,.account-actions a{padding:12px 16px;border-radius:10px;border:0;text-decoration:none;cursor:pointer;font-weight:700}.account-actions button{background:#635bff;color:#fff}.account-actions a{border:1px solid var(--border,#ddd);color:inherit}.account-message{margin:12px 0;min-height:22px}.achievements-section{margin-top:24px}.achievements-section h2{margin-bottom:14px}.achievements{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.achievement{display:flex;align-items:center;gap:14px;padding:16px;border:1px solid var(--border,#ddd);border-radius:16px}.achievement.locked{opacity:.55}.achievement-icon{font-size:34px}.achievement strong{display:block}.achievement p{margin:4px 0;font-size:14px;color:var(--text-soft,#687080)}.achievement small{font-weight:700}</style></head><body><header id="site-header"></header><main class="account"><section class="account-card"><span class="kicker">Your account</span><h1 id="welcome">My Account</h1><p id="identity">Loading...</p><div class="account-grid"><div class="account-stat"><strong id="level">—</strong><span>Level</span></div><div class="account-stat"><strong id="xp">—</strong><span>Total XP</span></div><div class="account-stat"><strong>∞</strong><span>Maximum Level</span></div></div><div class="progress"><div class="progress-head"><span>Progress to next level</span><span id="progress-label">—</span></div><div class="progress-track"><div id="progress-fill" class="progress-fill"></div></div></div><section class="achievements-section"><h2>🏆 Achievements & Trophies</h2><div id="achievements" class="achievements" data-achievements></div></section><div id="account-message" class="account-message"></div><div class="account-actions"><a href="/dashboard/">Dashboard</a><a href="/levels.html">Levels</a><a href="/settings/">Settings</a><button id="logout">Log out</button></div></section></main><footer id="site-footer"></footer><script src="/js/app.js" defer></script><script src="/auth/auth.js"></script><script src="/js/levels.js"></script><script src="/js/achievements.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{const msg=document.querySelector('#account-message');try{const data=await NexaurenAuth.me();if(!data.authenticated)throw new Error('Session not found.');const u=data.user||{},p=data.progress||{},s=data.settings||{},level=Math.max(1,Number(p.level??1)),xp=Math.max(0,Number(p.xp??0));document.querySelector('#welcome').textContent=`Hello, ${u.username||'user'}!`;document.querySelector('#identity').textContent=u.email||'';document.querySelector('#level').textContent=level;document.querySelector('#xp').textContent=xp;const req=window.NexaurenLevels?.get?.().xp===xp?Math.max(100,Math.floor(100+Math.pow(level,1.38)*22)):Math.max(100,level*100);const prev=Math.max(0,xp-(req));document.querySelector('#progress-label').textContent=`${Math.max(0,req-prev)} XP to level ${level+1}`;document.querySelector('#progress-fill').style.width=`${Math.min(100,(prev/req)*100)}%`;window.NexaurenAchievements?.check?.();window.NexaurenAchievements?.render?.();}catch(e){msg.textContent=e.message||'Please log in to continue.';setTimeout(()=>location.href='/auth/',900)}});document.querySelector('#logout').addEventListener('click',async()=>{try{await NexaurenAuth.logout()}finally{location.href='/auth/'}});</script></body></html>
