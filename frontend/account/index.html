<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minha conta — Nexauren</title><meta name="description" content="Veja os dados da sua conta, nível e progresso na Nexauren."><link rel="canonical" href="https://nexaurenstory.com/account/"><link rel="stylesheet" href="/css/style.css"><style>.account{max-width:760px;margin:60px auto;padding:24px}.account-card{padding:28px;border:1px solid var(--border,#ddd);border-radius:20px;background:var(--card,#fff)}.account-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin:22px 0}.account-stat{padding:18px;border:1px solid var(--border,#ddd);border-radius:14px}.account-stat strong{display:block;font-size:28px}.account-stat span{color:var(--text-soft,#687080)}.account-actions{display:flex;gap:10px;flex-wrap:wrap}.account-actions button,.account-actions a{padding:12px 16px;border-radius:10px;border:0;text-decoration:none;cursor:pointer;font-weight:700}.account-actions button{background:#635bff;color:#fff}.account-actions a{border:1px solid var(--border,#ddd);color:inherit}.account-message{margin:12px 0;min-height:22px}</style></head><body><header id="site-header"></header><main class="account"><section class="account-card"><span class="kicker">Sua conta</span><h1 id="welcome">Minha conta</h1><p id="identity">Carregando...</p><div class="account-grid"><div class="account-stat"><strong id="level">—</strong><span>Nível</span></div><div class="account-stat"><strong id="xp">—</strong><span>XP</span></div><div class="account-stat"><strong id="language">—</strong><span>Idioma</span></div></div><div id="account-message" class="account-message"></div><div class="account-actions"><a href="/dashboard/">Dashboard</a><a href="/settings/">Definições</a><button id="logout">Sair</button></div></section></main><footer id="site-footer"></footer><script src="/js/app.js" defer></script><script src="/auth/auth.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{const msg=document.querySelector('#account-message');try{const data=await NexaurenAuth.me();if(!data.authenticated)throw new Error('Sessão não encontrada.');const u=data.user||{},p=data.progress||{},s=data.settings||{};document.querySelector('#welcome').textContent=`Olá, ${u.username||'usuário'}!`;document.querySelector('#identity').textContent=u.email||'';document.querySelector('#level').textContent=p.level??1;document.querySelector('#xp').textContent=p.xp??0;document.querySelector('#language').textContent=s.language||'en';}catch(e){msg.textContent=e.message||'Faça login para continuar.';setTimeout(()=>location.href='/auth/',900)}});document.querySelector('#logout').addEventListener('click',async()=>{try{await NexaurenAuth.logout()}finally{location.href='/auth/'}});</script></body></html>
