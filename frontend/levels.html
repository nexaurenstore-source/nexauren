<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nexauren Levels</title><meta name="description" content="Track your Nexauren XP, level and badges."><link rel="stylesheet" href="/css/style.css"><style>.level-page{max-width:760px;margin:auto;padding:50px 20px}.level-card{padding:28px;border:1px solid var(--border);border-radius:22px;background:var(--card);text-align:center}.level-number{font-size:5rem;font-weight:800;color:var(--primary)}.xp-bar{height:14px;background:var(--border);border-radius:99px;overflow:hidden}.xp-fill{height:100%;width:0;background:var(--primary);transition:width .5s}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}.stat{padding:15px;border:1px solid var(--border);border-radius:14px}.stat strong{display:block;font-size:1.2rem}@media(max-width:500px){.stats{grid-template-columns:1fr}}</style></head><body><div id="site-header"></div><main class="level-page"><div class="level-card"><p>🏆 NEXAUREN LEVELS</p><div class="level-number" data-nexauren-level>1</div><h1 data-nexauren-title>Beginner</h1><p data-nexauren-xp>0 XP</p><div class="xp-bar"><div class="xp-fill" data-nexauren-progress></div></div><p data-nexauren-next>100 XP to level 2</p><div class="stats"><div class="stat"><strong data-nexauren-level>1</strong>Level</div><div class="stat"><strong data-nexauren-xp>0 XP</strong>Total XP</div><div class="stat"><strong>1000</strong>Max Level</div></div></div></main><div id="site-footer"></div><script src="/js/app.js" defer></script><script src="/js/levels.js" defer></script></body></html>
