<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Payment status — Nexauren</title>
<meta name="description" content="Check the status of your Nexauren payment.">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/menu.css">
<link rel="stylesheet" href="/css/nexauren-redesign.css">
<style>
.payment-status{max-width:720px;margin:72px auto;padding:24px}.payment-card{padding:28px;border:1px solid var(--border,#ddd);border-radius:20px;background:var(--card,#fff)}.payment-state{font-size:28px;font-weight:800;margin:10px 0}.payment-muted{color:var(--text-soft,#687080)}.payment-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.payment-btn{display:inline-block;padding:11px 15px;border-radius:10px;border:1px solid var(--border,#ddd);font-weight:700;text-decoration:none;color:inherit}.payment-btn.primary{background:#635bff;color:#fff;border-color:#635bff}
</style>
</head>
<body>
<header id="site-header"></header>
<main class="payment-status">
  <section class="payment-card">
    <span class="nx-kicker">Nexauren Payment</span>
    <h1>Payment status</h1>
    <div id="state" class="payment-state">Confirming…</div>
    <p id="detail" class="payment-muted">We are securely verifying your payment with Nexauren's backend.</p>
    <div class="payment-actions">
      <a id="billingLink" class="payment-btn primary" href="/billing/">Manage billing</a>
      <a id="storeLink" class="payment-btn" href="/nexauren-store/">Back to Store</a>
      <a class="payment-btn" href="/dashboard/">Back to dashboard</a>
    </div>
  </section>
</main>
<footer id="site-footer"></footer>
<script src="/js/app.js" defer></script>
<script src="/auth/auth.js"></script>
<script>
(async function(){
  const state=document.getElementById('state');
  const detail=document.getElementById('detail');
  const billingLink=document.getElementById('billingLink');
  const params=new URLSearchParams(location.search);
  const reference=(params.get('reference')||'').trim();
  const type=(params.get('type')||'').trim().toLowerCase();
  const isStore=type==='store_purchase';
  if(isStore){billingLink.hidden=true;document.getElementById('storeLink').classList.add('primary')}
  if(!reference){state.textContent='Reference missing';detail.textContent='No payment reference was returned. This page does not grant access from the return URL.';return;}

  const statusUrl=isStore?'/api/store/payment?reference='+encodeURIComponent(reference):'/api/billing/payment?reference='+encodeURIComponent(reference);
  async function verify(){
    try{
      const statusRes=await fetch(statusUrl,{credentials:'include',headers:{Accept:'application/json'},cache:'no-store'});
      const statusData=await statusRes.json().catch(()=>({}));
      const existing=statusData.payment||{};
      const existingStatus=String(existing.status||'').toLowerCase();
      if(existingStatus==='successful'){
        state.textContent='Payment confirmed.';
        detail.textContent=isStore?'The payment was captured and the product was added to your Store library.':existing.type==='credit_purchase'?'The payment was captured and your credits have been added to your Nexauren account.':'The payment was confirmed. Your subscription will appear in Billing after provider synchronization.';
        return true;
      }

      const res=await fetch(statusUrl,{method:isStore?'GET':'POST',credentials:'include',headers:isStore?{Accept:'application/json'}:{'Content-Type':'application/json',Accept:'application/json'},...(isStore?{}:{body:JSON.stringify({reference})})});
      const data=await res.json().catch(()=>({}));
      const payment=data.payment||{};
      const status=String(payment.status||'pending').toLowerCase();
      if(res.ok&&((isStore&&data.success===true)||status==='successful')){
        state.textContent='Payment confirmed.';
        detail.textContent=isStore?'The payment was captured and the product was added to your Store library.':payment.type==='credit_purchase'?'The payment was captured and your credits have been added to your Nexauren account.':'The payment was confirmed. Your subscription will appear in Billing after provider synchronization.';
        return true;
      }
      if(res.status===404){state.textContent='Payment not found';detail.textContent=data.error||'The payment reference could not be found. This page does not grant access from the return URL.';return true}
      if(res.status===401){state.textContent='Login required';detail.textContent='Please sign in to Nexauren and return to the payment page to verify this purchase.';return true}
      if(res.status===409){state.textContent='Payment pending.';detail.textContent=data.error||'PayPal has not confirmed the payment yet. We will check again automatically.';return false}
      throw new Error(data.error||'Unable to verify the payment.');
    }catch(error){state.textContent='Verification in progress';detail.textContent=error.message||'Unable to verify the payment right now. We will retry automatically. This page does not grant access from the return URL.';return false}
  }
  let done=await verify();let attempts=0;const timer=setInterval(async()=>{if(done||++attempts>=12){clearInterval(timer);return}done=await verify()},5000);
})();
</script>
</body>
</html>
