<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Report a Problem — Nexauren</title><meta name="description" content="Report a problem with a Nexauren tool or website feature."><link rel="stylesheet" href="/css/style.css"></head><body><div id="site-header"></div><main class="container page-content"><h1>Report a Problem</h1><p>Tell us what went wrong and help us improve Nexauren.</p><form class="feedback-form" data-mail-form data-type="Problem report"><label>Problem or tool<select name="problem" required><option value="">Select…</option><option>Website</option><option>Video Editor</option><option>NexaFace</option><option>Image tools</option><option>Video tools</option><option>Audio tools</option><option>Text tools</option><option>PDF tools</option><option>Other</option></select></label><label>Title<input name="title" required maxlength="120" placeholder="Short description"></label><label>Message<textarea name="message" required rows="8" placeholder="Describe the problem…"></textarea></label><button class="button button-primary" type="submit">Send report</button></form></main><div id="site-footer"></div><script src="/js/app.js" defer></script><script src="/js/feedback.js" defer></script></body></html>
