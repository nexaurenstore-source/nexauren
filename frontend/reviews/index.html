<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Community Reviews — Nexauren</title><meta name="description" content="Public reviews and ratings from the Nexauren community."><link rel="canonical" href="https://nexaurenstory.com/reviews/"><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/menu.css"><style>.reviews-page{max-width:1050px;margin:55px auto;padding:24px}.reviews-hero{text-align:center;margin-bottom:30px}.reviews-hero h1{margin-bottom:8px}.review-list{display:grid;gap:15px}.review-card{padding:20px;border:1px solid var(--border,#ddd);border-radius:18px;background:var(--card,#fff)}.review-top{display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap}.review-tool{font-weight:800}.review-stars{letter-spacing:2px}.review-user{font-weight:700}.review-date{opacity:.6;font-size:.88em}.review-body{margin:12px 0 0;white-space:pre-wrap}.reviews-empty{text-align:center;padding:45px;opacity:.65}.reviews-pagination{display:flex;justify-content:center;gap:10px;align-items:center;margin-top:24px}.reviews-pagination button{padding:9px 15px;border:1px solid var(--border,#ddd);background:transparent;border-radius:10px;cursor:pointer}.reviews-pagination button:disabled{opacity:.4}.reviews-summary{display:inline-flex;gap:9px;align-items:center;padding:9px 14px;border:1px solid var(--border,#ddd);border-radius:999px}</style></head><body><header id="site-header"></header><main class="reviews-page"><section class="reviews-hero"><span class="kicker">Community</span><h1>Community Reviews</h1><p>See what people are saying about Nexauren tools.</p><div class="reviews-summary"><strong id="total">0</strong> public reviews</div></section><section class="review-list" id="reviews"><div class="reviews-empty">Loading reviews…</div></section><nav class="reviews-pagination" id="pagination"></nav></main><footer id="site-footer"></footer><script src="/js/app.js" defer></script><script>document.addEventListener('DOMContentLoaded',()=>{const list=document.querySelector('#reviews'),pagination=document.querySelector('#pagination'),total=document.querySelector('#total');let page=1;const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const stars=n=>{n=Number(n)||0;return [...Array(5)].map((_,i)=>i<n?'★':'☆').join('')};async function load(){try{const r=await fetch('/api/reviews/all?page='+page+'&limit=15',{cache:'no-store'}),d=await r.json();if(!r.ok)throw Error();total.textContent=d.total||0;list.innerHTML=d.reviews?.length?d.reviews.map(x=>'<article class="review-card"><div class="review-top"><div><div class="review-tool">'+esc(x.tool_name)+'</div><div class="review-stars">'+stars(x.rating)+'</div></div><div><span class="review-user">'+esc(x.display_name||'Anonymous')+'</span><br><span class="review-date">'+esc(new Date(x.created_at*1000).toLocaleDateString())+'</span></div></div><p class="review-body">'+esc(x.review)+'</p></article>').join(''):'<div class="reviews-empty">No public reviews yet.</div>';const pages=Math.ceil((d.total||0)/15);pagination.innerHTML=pages>1?'<button id="prev" '+(page<=1?'disabled':'')+'>Previous</button><span>'+page+' / '+pages+'</span><button id="next" '+(page>=pages?'disabled':'')+'>Next</button>':'';document.querySelector('#prev')?.addEventListener('click',()=>{page--;load()});document.querySelector('#next')?.addEventListener('click',()=>{page++;load()})}catch{list.innerHTML='<div class="reviews-empty">Could not load community reviews.</div>'}}load()});</script></body></html>
