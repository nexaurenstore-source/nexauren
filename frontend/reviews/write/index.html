<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Escrever avaliação — Nexauren</title><meta name="description" content="Avalie uma ferramenta Nexauren e partilhe a sua experiência com a comunidade."><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/menu.css"><style>.review-write{max-width:760px;margin:50px auto;padding:24px}.review-box{background:var(--card,#fff);border:1px solid var(--border,#ddd);border-radius:22px;padding:28px}.tool-name{font-size:1.15rem;font-weight:800;margin:8px 0 24px}.stars{display:flex;gap:6px;margin:10px 0 20px}.stars button{font-size:2rem;border:0;background:none;cursor:pointer;padding:2px}.field{margin:15px 0}.field label{display:block;font-weight:700;margin-bottom:7px}.field input,.field textarea{width:100%;box-sizing:border-box;padding:13px;border:1px solid var(--border,#ddd);border-radius:11px;font:inherit}.field textarea{min-height:140px;resize:vertical}.publish{border:0;border-radius:11px;padding:13px 20px;background:var(--primary,#635bff);color:#fff;font-weight:700;cursor:pointer}.publish:disabled{opacity:.5}.notice{padding:13px;border-radius:11px;background:rgba(99,91,255,.08);margin:15px 0}.back{display:inline-block;margin-bottom:15px}.error{color:#b42318}.success{color:#087443}</style></head><body><header id="site-header"></header><main class="review-write"><a class="back" href="/reviews/">← Voltar para avaliações</a><div class="review-box"><span class="kicker">Community</span><h1>Escrever avaliação</h1><div class="tool-name" id="toolName">A carregar ferramenta…</div><div id="auth" class="notice">A verificar sessão…</div><form id="form" hidden><div class="field"><label>Nome público</label><input id="displayName" maxlength="50" required placeholder="Nome que aparecerá publicamente"></div><div class="field"><label>Avaliação</label><div class="stars" id="stars" aria-label="Escolha uma classificação"></div></div><div class="field"><label>Comentário</label><textarea id="review" maxlength="1000" required placeholder="Conte a sua experiência com esta ferramenta…"></textarea></div><button class="publish" id="publish" type="submit">Publicar avaliação</button><p id="message"></p></form></div></main><footer id="site-footer"></footer><script src="/js/app.js" defer></script><script>document.addEventListener('DOMContentLoaded',async()=>{const q=new URLSearchParams(location.search),tool=q.get('tool')||'',name=q.get('name')||'',toolName=document.querySelector('#toolName'),auth=document.querySelector('#auth'),form=document.querySelector('#form'),display=document.querySelector('#displayName'),stars=document.querySelector('#stars'),review=document.querySelector('#review'),message=document.querySelector('#message'),publish=document.querySelector('#publish');let rating=5;toolName.textContent=name||tool||'Ferramenta Nexauren';for(let i=1;i<=5;i++){const b=document.createElement('button');b.type='button';b.textContent='★';b.dataset.rating=i;b.addEventListener('click',()=>{rating=i;[...stars.children].forEach((x,j)=>x.textContent=j<i?'★':'☆')});stars.appendChild(b)}const readJson=async r=>{const type=(r.headers.get('content-type')||'').toLowerCase();if(!type.includes('application/json')){const text=await r.text();throw new Error(r.ok?'A API devolveu uma resposta inválida.':'A API de avaliações não está disponível neste momento.')}return r.json()};try{const r=await fetch('/api/auth/me',{credentials:'include',cache:'no-store'}),m=await readJson(r);if(!m.authenticated){auth.innerHTML='É necessário iniciar sessão para publicar uma avaliação.<br><br><a href="/auth/">Entrar / Criar conta</a>';return}auth.hidden=true;form.hidden=false;display.value=m.user?.username||''}catch(err){auth.classList.add('error');auth.textContent=err.message||'Não foi possível verificar a sessão.'}form.addEventListener('submit',async e=>{e.preventDefault();publish.disabled=true;message.className='';message.textContent='A publicar…';try{if(!tool)throw new Error('Ferramenta inválida.');const r=await fetch('/api/reviews',{method:'POST',credentials:'include',cache:'no-store',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({tool_id:tool,tool_name:name||tool,display_name:display.value.trim(),rating,review:review.value.trim()})}),d=await readJson(r);if(!r.ok)throw Error(d.error||'Não foi possível publicar.');message.className='success';message.textContent='Avaliação publicada com sucesso!';setTimeout(()=>location.href='/reviews/',700)}catch(err){message.className='error';message.textContent=err.message||'Não foi possível publicar.'}finally{publish.disabled=false}});[...stars.children].forEach((x,j)=>x.textContent=j<5?'★':'☆')});</script></body></html>
