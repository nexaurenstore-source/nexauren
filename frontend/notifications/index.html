<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notifications — Nexauren</title><link rel="canonical" href="https://nexaurenstory.com/notifications/"><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/menu.css"><style>.notifications-page{max-width:960px;margin:48px auto;padding:24px}.notifications-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}.notifications-head h1{margin:0}.notifications-actions{display:flex;gap:8px;flex-wrap:wrap}.notifications-actions button{border:1px solid var(--border,#ddd);background:var(--card,#fff);color:inherit;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}.notification-card{display:flex;gap:14px;align-items:flex-start;padding:18px;margin:12px 0;border:1px solid var(--border,#ddd);border-radius:16px;background:var(--card,#fff)}.notification-card.unread{border-left:4px solid var(--primary,#635bff)}.notification-card-body{flex:1;min-width:0}.notification-card h2{font-size:18px;margin:0 0 7px}.notification-card p{margin:0 0 8px;line-height:1.5}.notification-card small{opacity:.65}.notification-card .delete{border:0;background:none;color:#dc2626;cursor:pointer;font-weight:700;padding:6px}.notification-meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:7px;font-size:12px}.notification-badge{padding:4px 8px;border-radius:999px;background:rgba(99,91,255,.1)}.empty{text-align:center;padding:50px 20px;opacity:.65}.pager{display:flex;justify-content:center;align-items:center;gap:12px;margin:24px}.pager button{padding:9px 14px;border:1px solid var(--border,#ddd);background:var(--card,#fff);border-radius:9px;cursor:pointer}.message{min-height:24px;margin:10px 0}@media(max-width:650px){.notifications-page{margin:20px auto;padding:16px}.notifications-head{align-items:flex-start;flex-direction:column}.notification-card{padding:14px}.notification-card .delete{font-size:12px}}</style></head><body><header id="site-header"></header><main class="notifications-page"><div class="notifications-head"><div><span class="kicker">NEXAUREN</span><h1>🔔 Notifications</h1><p id="summary">Loading your notifications...</p></div><div class="notifications-actions"><button id="read-all">Mark all as read</button></div></div><div id="message" class="message"></div><section id="list"></section><div class="pager"><button id="prev">Previous</button><span id="page">1</span><button id="next">Next</button></div></main><footer id="site-footer"></footer><script src="/js/app.js" defer></script><script src="/auth/auth.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const list=document.querySelector('#list'),summary=document.querySelector('#summary'),msg=document.querySelector('#message'),pageEl=document.querySelector('#page'),prev=document.querySelector('#prev'),next=document.querySelector('#next');let page=1,limit=20,total=0;const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const date=v=>{const n=Number(v);return Number.isFinite(n)&&n>0?new Date(n*1000).toLocaleString(undefined,{dateStyle:'medium',timeStyle:'short'}):''};const load=async()=>{msg.textContent='';try{const r=await fetch(`/api/notifications?page=${page}&limit=${limit}`,{credentials:'include',cache:'no-store'});if(r.status===401){location.href='/auth/?next=/notifications/';return}if(!r.ok)throw new Error('Unable to load notifications.');const d=await r.json();total=Number(d.total||0);const items=Array.isArray(d.notifications)?d.notifications:[];summary.textContent=`${total} notification${total===1?'':'s'} · ${Number(d.unread_count||0)} unread`;list.innerHTML=items.length?items.map(n=>`<article class="notification-card ${n.read_at?'':'unread'}"><div class="notification-card-body"><div class="notification-meta"><span class="notification-badge">${esc(n.type||'information')}</span><span class="notification-badge">${esc(n.priority||'LOW')}</span>${n.read_at?'<span>✓ Read</span>':'<strong>● Unread</strong>'}</div><h2>${esc(n.title)}</h2><p>${esc(n.message)}</p><small>${esc(date(n.published_at||n.created_at))}</small></div><button class="delete" data-delete="${esc(n.id)}" aria-label="Delete notification">Delete</button></article>`).join(''):'<div class="empty">🔔<br><br>You have no notifications.</div>';pageEl.textContent=String(page);prev.disabled=page<=1;next.disabled=page*limit>=total}catch(e){msg.textContent=e.message||'Unable to load notifications.'}};list.addEventListener('click',async e=>{const b=e.target.closest('[data-delete]');if(!b)return;if(!confirm('Delete this notification?'))return;b.disabled=true;try{const r=await fetch(`/api/notifications/${encodeURIComponent(b.dataset.delete)}`,{method:'DELETE',credentials:'include'});if(!r.ok)throw new Error('Unable to delete notification.');await load()}catch(e){msg.textContent=e.message;b.disabled=false}});document.querySelector('#read-all').addEventListener('click',async()=>{await fetch('/api/notifications/read-all',{method:'POST',credentials:'include'});await load()});prev.addEventListener('click',()=>{if(page>1){page--;load()}});next.addEventListener('click',()=>{if(page*limit<total){page++;load()}});load()});</script></body></html>
