<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spreadsheet — Online Spreadsheet Editor</title><meta name="description" content="Create, edit and organize data in a powerful spreadsheet directly in your browser."><meta name="keywords" content="spreadsheet, online spreadsheet, formulas, tables, charts, productivity"><meta name="robots" content="index,follow"><link rel="canonical" href="https://nexaurenstory.com/tools/productivity/spreadsheet/"><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="./style.css"></head><body><header class="sheet-header"><a href="/tools/productivity/" class="back">← Productivity</a><div><h1>Spreadsheet</h1><p>Powerful spreadsheet editor that works in your browser.</p></div></header><main class="app"><div class="topbar"><button id="newBtn">New</button><button id="undoBtn">↶ Undo</button><button id="redoBtn">↷ Redo</button><button id="addRowBtn">+ Row</button><button id="addColBtn">+ Column</button><button id="delRowBtn">− Row</button><button id="delColBtn">− Column</button><button id="mergeBtn">Merge</button><button data-format="bold"><b>B</b></button><button data-format="italic"><i>I</i></button><button data-format="underline"><u>U</u></button><button id="importCsvBtn">Import CSV</button><button id="exportCsvBtn" class="primary">Export CSV</button><button id="saveProjectBtn">Save Project</button><button id="loadProjectBtn">Load Project</button><button id="chartBtn">Chart</button><button id="resetBtn">Reset Spreadsheet</button><input id="csvInput" type="file" accept=".csv,text/csv" hidden><input id="projectInput" type="file" accept=".json,.nexa" hidden></div><div class="formatbar"><select id="align"><option value="left">Left</option><option value="center">Center</option><option value="right">Right</option></select><select id="numberFormat"><option value="general">General</option><option value="number">Number</option><option value="currency">Currency</option><option value="percent">Percent</option></select><input id="bgColor" type="color" title="Background"><button id="borderBtn">Borders</button><input id="search" placeholder="Search cells..."><button id="sortBtn">Sort</button><button id="filterBtn">Filter</button></div><div class="formula"><span id="cellName">A1</span><input id="formulaInput" placeholder="Enter value or formula, e.g. =SUM(A1:A5)"></div><div class="tabs" id="tabs"></div><div class="table-scroll"><table id="sheet"><thead></thead><tbody></tbody></table></div><div class="statusbar"><span id="status">Ready</span><span>Offline-ready • Autosave enabled</span></div></main><script src="./script.js"></script><script src="/js/ads.js"></script></body></html>
