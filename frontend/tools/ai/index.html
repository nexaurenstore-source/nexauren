<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Tools — Nexauren</title><meta name="description" content="Explore Nexauren AI tools that run directly in your browser."><link rel="canonical" href="https://nexaurenstory.com/tools/ai/"><link rel="stylesheet" href="/css/style.css"></head><body><div id="site-header"></div><main class="container" style="padding:50px 20px 80px"><section style="text-align:center;margin-bottom:30px"><div style="font-size:2.5rem">🤖</div><h1>AI Tools</h1><p>Browser-based AI tools from Nexauren.</p></section><section id="ai-tools" class="tools-grid"><p>Loading AI tools…</p></section></main><div id="site-footer"></div><script src="/js/app.js" defer></script><script>document.addEventListener('DOMContentLoaded',async()=>{const box=document.getElementById('ai-tools');try{const r=await fetch('/data/tools.json',{cache:'no-store'});const d=await r.json();const tools=(d.tools||[]).filter(t=>t.category==='ai');box.innerHTML=tools.length?tools.map(t=>`<article class="tool-card"><a href="${t.url}" data-tool-id="${t.id}" data-tool-name="${t.name}"><h2>${t.name}</h2><p>${t.description||''}</p></a></article>`).join(''):'<p>No AI tools registered yet.</p>'}catch{box.innerHTML='<p>Unable to load AI tools.</p>'}});</script></body></html>
