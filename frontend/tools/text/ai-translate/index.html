<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Translate — Translate Text Online</title><meta name="description" content="Translate text between 20 languages with a browser-based AI translation tool from Nexauren."><meta name="keywords" content="AI translate, translator, translate text, online translator, Nexauren"><link rel="canonical" href="https://nexaurenstory.com/tools/text/ai-translate/"><meta property="og:title" content="AI Translate — Nexauren"><meta property="og:description" content="Translate text between 20 languages directly in your browser."><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="style.css"></head><body><div id="site-header"></div><main class="container ai-page"><div class="ai-head"><span>🤖 AI TOOL</span><h1>AI Translate</h1><p>Translate text between 20 languages.</p></div><section class="translator-card"><div class="lang-row"><label>From<select id="from"><option value="auto">Detect language</option><option>Portuguese</option><option>English</option><option>Spanish</option><option>French</option><option>German</option><option>Italian</option><option>Dutch</option><option>Russian</option><option>Ukrainian</option><option>Arabic</option><option>Hindi</option><option>Bengali</option><option>Chinese</option><option>Japanese</option><option>Korean</option><option>Turkish</option><option>Polish</option><option>Swedish</option><option>Greek</option><option>Indonesian</option></select></label><button id="swap" class="icon-btn" title="Swap languages">⇄</button><label>To<select id="to"><option>English</option><option>Portuguese</option><option>Spanish</option><option>French</option><option>German</option><option>Italian</option><option>Dutch</option><option>Russian</option><option>Ukrainian</option><option>Arabic</option><option>Hindi</option><option>Bengali</option><option>Chinese</option><option>Japanese</option><option>Korean</option><option>Turkish</option><option>Polish</option><option>Swedish</option><option>Greek</option><option>Indonesian</option></select></label></div><div class="translate-grid"><div class="pane"><div class="pane-top"><span>Original</span><span id="count">0 / 5000</span></div><textarea id="input" maxlength="5000" placeholder="Type or paste your text here…"></textarea><div class="pane-actions"><label class="file-btn">📥 Import TXT<input id="file" type="file" accept=".txt,text/plain"></label><button id="clear">Clear</button><button id="speakInput">🔊 Listen</button></div></div><div class="pane result"><div class="pane-top"><span>Translation</span><span id="status">Ready</span></div><textarea id="output" readonly placeholder="Your translation will appear here…"></textarea><div class="pane-actions"><button id="copy">📋 Copy</button><button id="download">💾 Download</button><button id="speakOutput">🔊 Listen</button></div></div></div><button id="translate" class="button button-primary translate-btn">✨ Translate</button><p class="privacy-note">🔒 Your text stays in your browser. No account required.</p></section></main><div id="site-footer"></div><script src="/js/app.js" defer></script><script src="/js/levels.js" defer></script><script src="script.js" defer></script></body></html>
