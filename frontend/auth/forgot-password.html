<!doctype html>
<html lang="pt">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recuperar senha — Nexauren</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="./style.css"></head>
<body><main class="auth-page"><section class="auth-card"><div class="auth-logo">Nexauren</div><p class="auth-subtitle">Recupere o acesso à sua conta.</p><h1>Esqueci a senha</h1><p>Digite o e-mail da sua conta e enviaremos um link para criar uma nova senha.</p><div id="message" class="auth-message" role="status" aria-live="polite"></div><form id="form" class="auth-form"><label class="auth-field">Email<input id="email" type="email" autocomplete="email" required></label><button class="auth-submit" type="submit">Enviar link</button></form><p class="auth-note"><a href="./index.html">Voltar para entrar</a></p></section></main><script src="./auth.js"></script><script>const form=document.querySelector('#form'),message=document.querySelector('#message');form.onsubmit=async e=>{e.preventDefault();const b=form.querySelector('button');b.disabled=true;message.textContent='Enviando...';message.className='auth-message';try{const result=await NexaurenAuth.forgotPassword(document.querySelector('#email').value.trim());message.textContent=result.message||'Se uma conta existir para esse e-mail, enviaremos um link de recuperação.';message.className='auth-message success';form.reset()}catch(error){message.textContent=error.message||'Não foi possível enviar o e-mail.';message.className='auth-message error'}finally{b.disabled=false}}</script></body></html>
