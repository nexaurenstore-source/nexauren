<!doctype html>
<html lang="pt">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nova senha — Nexauren</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="./style.css"></head>
<body><main class="auth-page"><section class="auth-card"><div class="auth-logo">Nexauren</div><p class="auth-subtitle">Defina uma nova senha.</p><h1>Nova senha</h1><p>Escolha uma senha com pelo menos 8 caracteres.</p><div id="message" class="auth-message" role="status" aria-live="polite"></div><form id="form" class="auth-form"><label class="auth-field">Nova senha<input id="password" type="password" minlength="8" autocomplete="new-password" required></label><label class="auth-field">Confirmar senha<input id="confirm" type="password" minlength="8" autocomplete="new-password" required></label><button class="auth-submit" type="submit">Alterar senha</button></form><p class="auth-note"><a href="./index.html">Voltar para entrar</a></p></section></main><script src="./auth.js"></script><script>const params=new URLSearchParams(location.search),token=params.get('token')||'',form=document.querySelector('#form'),message=document.querySelector('#message');if(!token){form.hidden=true;message.textContent='Este link de recuperação é inválido ou está incompleto.';message.className='auth-message error'}form.onsubmit=async e=>{e.preventDefault();const password=document.querySelector('#password').value,confirm=document.querySelector('#confirm').value;if(password!==confirm){message.textContent='As senhas não coincidem.';message.className='auth-message error';return}const b=form.querySelector('button');b.disabled=true;message.textContent='Atualizando...';try{await NexaurenAuth.resetPassword({token,password});message.textContent='Senha atualizada com sucesso. Redirecionando para o login...';message.className='auth-message success';setTimeout(()=>location.href='./index.html',1200)}catch(error){message.textContent=error.message||'Não foi possível atualizar a senha.';message.className='auth-message error';b.disabled=false}}</script></body></html>
