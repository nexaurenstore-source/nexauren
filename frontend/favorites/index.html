<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Favorites — Nexauren</title><meta name="description" content="Your private Nexauren favorite tools."><link rel="canonical" href="https://nexaurenstory.com/favorites/"><link rel="stylesheet" href="/css/style.css"><style>.favorites-page{max-width:1050px;margin:55px auto;padding:24px}.favorites-hero{text-align:center;margin-bottom:30px}.favorites-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}.favorite-card{border:1px solid var(--border,#ddd);border-radius:18px;padding:20px;background:var(--card,#fff)}.favorite-card h2{font-size:1.1rem}.favorite-card a{display:inline-block;margin-top:12px}.empty{text-align:center;padding:50px;opacity:.65}</style></head><body><header id="site-header"></header><main class="favorites-page"><section class="favorites-hero"><h1>Favorites</h1><p>Your saved tools are private and visible only to you.</p></section><section class="favorites-grid" id="favorites"><div class="empty">Loading favorites…</div></section></main><footer id="site-footer"></footer><script src="/js/app.js" defer></script><script>(async()=>{const el=document.querySelector('#favorites');try{const m=await fetch('/api/auth/me',{credentials:'include'}).then(r=>r.json());if(!m.authenticated){el.innerHTML='<div class="empty">Sign in to see your private favorites.</div>';return}const r=await fetch('/api/favorites',{credentials:'include',cache:'no-store'}),d=await r.json();el.innerHTML=d.favorites?.length?d.favorites.map(x=>'<article class="favorite-card"><h2>'+String(x.tool_name).replace(/[&<>"\']/g,'')+'</h2><a href="'+String(x.url).replace(/"/g,'&quot;')+'">Open Tool</a></article>').join(''):'<div class="empty">You have no favorite tools yet.</div>'}catch{el.innerHTML='<div class="empty">Could not load favorites.</div>'}})();</script></body></html>
