name: Billing Syntax Check

on:
  push:
    paths:
      - 'scripts/worker/**'
      - 'scripts/build-worker.mjs'
      - 'worker.js'
      - 'package.json'
  pull_request:
    paths:
      - 'scripts/worker/**'
      - 'scripts/build-worker.mjs'
      - 'worker.js'
      - 'package.json'

jobs:
  billing-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check scripts/worker/billing.js
      # billing-routes.js is an inline route fragment injected inside Worker fetch(r, e), so validate it in an async-function context.
      - name: Check billing routes syntax
        run: >-
          node -e "const fs=require('node:fs'); const source=fs.readFileSync('scripts/worker/billing-routes.js','utf8'); new Function('r','e','return (async function(){\\n'+source+'\\n})');"
      - run: node --check scripts/worker/billing-safety-patch.js
      - run: node --check scripts/worker/payment-providers.js
      - run: node --check scripts/worker/billing-webhooks.js
      - run: node --check scripts/worker/subscription-lifecycle.js
      - run: node --check scripts/build-worker.mjs
