name: Update sitemap

on:
  push:
    branches: [main]
    paths:
      - 'frontend/data/tools.json'
      - 'scripts/generate-sitemap.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate sitemap
        run: node scripts/generate-sitemap.js

      - name: Commit sitemap if changed
        run: |
          if git diff --quiet -- frontend/sitemap.xml; then
            echo "Sitemap is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/sitemap.xml
          git commit -m "chore: update sitemap from tools registry"
          git push
