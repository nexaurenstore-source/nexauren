name: Deploy Nexauren Marketplace

on:
  push:
    branches: [main]
    paths:
      - 'marketplace-worker/**'
      - 'frontend/nexauren-store/**'
      - '.github/workflows/deploy-marketplace.yml'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Marketplace Worker
        run: npm run check:marketplace-worker

      - name: Deploy Marketplace Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config marketplace-worker/wrangler.json
