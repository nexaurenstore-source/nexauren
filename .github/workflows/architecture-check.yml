name: Nexauren Architecture Check

on:
  push:
    branches: [main, 'refactor/**']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Materialize ads.js on every Experience page
        run: node scripts/inject-experience-ads.mjs

      - name: Persist Experience ads tags
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/studios
          if git diff --cached --quiet; then
            echo "No Experience ads changes needed."
          else
            git commit -m "chore: add ads.js to Studio Experiences [skip ci]"
            git push
          fi

      - name: Validate registry, security and build Worker
        run: npm run check
