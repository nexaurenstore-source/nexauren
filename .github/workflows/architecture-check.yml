name: Nexauren Architecture Check

on:
  push:
    branches: [main, 'refactor/**']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Materialize ads.js on every Experience page
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('frontend/studios')
          script = '<script src="/js/ads.js" defer></script>'
          changed = 0

          for path in root.rglob('index.html'):
              relative = path.relative_to(root)
              if len(relative.parts) != 3:
                  continue

              html = path.read_text(encoding='utf-8')
              if script in html:
                  continue

              marker = '</head>'
              index = html.lower().rfind(marker)
              if index < 0:
                  raise SystemExit(f'Missing </head>: {path}')

              path.write_text(html[:index] + script + '\n' + html[index:], encoding='utf-8')
              changed += 1
              print(f'Added ads.js: {path}')

          print(f'Experience pages changed: {changed}')
          PY

      - name: Persist Experience ads tags
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/studios
          if git diff --cached --quiet; then
            echo "No Experience ads changes needed."
          else
            git commit -m "chore: add ads.js to Studio Experiences [skip ci]"
            git push
          fi

      - name: Validate registry, security and build Worker
        run: npm run check
