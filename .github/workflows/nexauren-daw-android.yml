name: Nexauren DAW Android

on:
  workflow_dispatch:
  push:
    paths:
      - "apps/nexauren-daw-android/**"
      - ".github/workflows/nexauren-daw-android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/nexauren-daw-android

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.13"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nexauren-daw-debug-apk
          path: apps/nexauren-daw-android/app/build/outputs/apk/debug/app-debug.apk
