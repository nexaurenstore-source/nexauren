name: Nexauren D1 Migrations

on:
  push:
    branches: [main]
    paths:
      - 'migrations/**'
      - 'wrangler.json'
      - '.github/workflows/d1-migrations.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexauren-d1-migrations
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply D1 migrations to remote database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply nexauren-db --remote
