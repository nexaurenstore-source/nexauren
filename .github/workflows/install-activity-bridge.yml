name: Install activity bridge
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch activity bridge
        run: |
          node <<'NODE'
          const fs=require('fs');
          const workerPath='worker.js';
          let w=fs.readFileSync(workerPath,'utf8');
          const marker='/* NEXAUREN ACTIVITY BRIDGE v1 */';
          if(!w.includes(marker)){
            const helpers=`${marker}
async function ensureActivitySchema(e){await e.DB.batch([e.DB.prepare('CREATE TABLE IF NOT EXISTS activity_logs (id TEXT PRIMARY KEY,user_id TEXT NOT NULL,action TEXT NOT NULL,tool_id TEXT,tool_name TEXT,url TEXT,details TEXT,created_at INTEGER NOT NULL)'),e.DB.prepare('CREATE INDEX IF NOT EXISTS idx_activity_logs_created ON activity_logs(created_at DESC)'),e.DB.prepare('CREATE INDEX IF NOT EXISTS idx_activity_logs_user ON activity_logs(user_id,created_at DESC)')])}
async function postActivity(r,e){const u=await currentUser(r,e);if(!u)return json({error:'Authentication required.'},401,cors(r));const d=await body(r);const action=clean(d?.type||d?.action).slice(0,80);if(!action)return json({error:'Activity type required.'},400,cors(r));await ensureActivitySchema(e);const now=Math.floor(Date.now()/1000);const rawTime=Date.parse(String(d?.time||''));const createdAt=Number.isFinite(rawTime)?Math.floor(rawTime/1000):now;await e.DB.prepare('INSERT INTO activity_logs (id,user_id,action,tool_id,tool_name,url,details,created_at) VALUES (?1,?2,?3,?4,?5,?6,?7,?8)').bind(uuid(),u.id,action,clean(d?.toolId).slice(0,120),clean(d?.name).slice(0,160),clean(d?.url).slice(0,500),clean(d?.details||d?.title).slice(0,500),createdAt).run();return json({success:true},201,cors(r))}
async function getAdminActivity(r,e){const admin=await isAdmin(r,e);if(!admin)return json({error:'Admin access required.'},admin===null?401:403,cors(r));await ensureActivitySchema(e);const u=new URL(r.url);const page=Math.max(1,Number(u.searchParams.get('page'))||1),limit=Math.max(1,Math.min(100,Number(u.searchParams.get('limit'))||30)),offset=(page-1)*limit,q=clean(u.searchParams.get('q'));const where=q?' WHERE (a.action LIKE ?1 OR a.tool_name LIKE ?1 OR a.details LIKE ?1 OR u.username LIKE ?1 OR u.email LIKE ?1)':'';const bind=q?('%'+q+'%'):null;const count=await e.DB.prepare('SELECT COUNT(*) AS total FROM activity_logs a JOIN users u ON u.id=a.user_id'+where).bind(...(bind?[bind]:[])).first();const rows=await e.DB.prepare('SELECT a.id,a.action,a.tool_id,a.tool_name,a.url,a.details,a.created_at,u.id AS user_id,u.username,u.email FROM activity_logs a JOIN users u ON u.id=a.user_id'+where+' ORDER BY a.created_at DESC LIMIT ?'+(q?'2':'1')+' OFFSET ?'+(q?'3':'2')).bind(...(q?[bind,limit,offset]:[limit,offset])).all();return json({page,limit,total:Number(count?.total||0),activity:rows?.results||[]},200,cors(r))}
`;
            const at=w.indexOf('export default');
            if(at<0) throw new Error('Could not locate export default in worker.js');
            w=w.slice(0,at)+helpers+w.slice(at);
            const re=/export default\s*\{\s*(?:async\s+)?fetch\s*\([^)]*\)\s*\{/;
            const m=re.exec(w);
            if(!m) throw new Error('Could not locate Worker fetch handler');
            const insertion=`${m[0]}
    const __activityPath=new URL(r.url).pathname;
    if(r.method==='POST' && __activityPath==='/api/activity') return postActivity(r,e);
    if(r.method==='GET' && __activityPath==='/api/admin/activity') return getAdminActivity(r,e);`;
            w=w.slice(0,m.index)+insertion+w.slice(m.index+m[0].length);
            fs.writeFileSync(workerPath,w);
          }
          const appPath='frontend/js/app.js';
          let a=fs.readFileSync(appPath,'utf8');
          const amarker='/* NEXAUREN ACTIVITY SYNC v1 */';
          if(!a.includes(amarker)){
            const old=`const recordActivity=(type,tool,extra={})=>{const a=read('nexauren_activity');a.push({type,title:extra.title||activityTitle(type,tool),toolId:tool?.id||extra.toolId||'',name:tool?.name||extra.name||'',url:tool?.url||extra.url||'',time:now()});write('nexauren_activity',a.slice(-200))};`;
            const neu=`${amarker} const recordActivity=(type,tool,extra={})=>{const item={type,title:extra.title||activityTitle(type,tool),toolId:tool?.id||extra.toolId||'',name:tool?.name||extra.name||'',url:tool?.url||extra.url||'',time:now()};const a=read('nexauren_activity');a.push(item);write('nexauren_activity',a.slice(-200));fetch('/api/activity',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify(item),keepalive:true}).catch(()=>{})};`;
            if(!a.includes(old)) throw new Error('Could not locate recordActivity in app.js');
            a=a.replace(old,neu);
            fs.writeFileSync(appPath,a);
          }
          NODE
      - name: Commit bridge
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker.js frontend/js/app.js
          if git diff --cached --quiet; then echo 'Activity bridge already installed'; exit 0; fi
          git commit -m 'Integrate server-side activity tracking'
          git push
