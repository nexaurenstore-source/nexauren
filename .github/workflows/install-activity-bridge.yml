name: Install admin data bridge
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install activity bridge
        run: node scripts/install-activity-bridge.mjs
      - name: Commit bridge
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker.js
          if git diff --cached --quiet; then echo 'No bridge changes needed'; exit 0; fi
          git commit -m 'Add server-side admin activity tools API'
          git push
