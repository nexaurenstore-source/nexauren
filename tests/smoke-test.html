<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nexauren — Smoke Test</title>
</head>
<body>
  <main>
    <h1>Nexauren Smoke Test</h1>
    <p id="status">Executando teste...</p>
  </main>

  <script>
    const status = document.getElementById('status');

    try {
      if (!status) throw new Error('Elemento de status não encontrado.');

      status.textContent = 'OK — HTML e JavaScript carregaram corretamente.';
      status.dataset.test = 'passed';
    } catch (error) {
      status.textContent = `FALHOU — ${error.message}`;
      status.dataset.test = 'failed';
      console.error(error);
    }
  </script>
</body>
</html>
